name: REelo CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reelo_test
          POSTGRES_USER: reelo
          POSTGRES_PASSWORD: reelo_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reelo -d reelo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      REELO_DATABASE_URL: postgresql://reelo:reelo_test_password@localhost:5432/reelo_test
      REELO_SECRET: ci-test-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q .

      - name: Apply PostgreSQL migrations
        working-directory: backend
        run: python run_migrations.py

      - name: Verify PostgreSQL schema
        working-directory: backend
        run: python postgres_verify.py

      - name: Run PostgreSQL integration tests
        working-directory: backend
        run: pytest -q test_postgres_integration.py test_postgres_api_contract.py test_postgres_http.py test_postgres_recovery.py test_postgres_query_performance.py test_video_processing.py test_video_playback_http.py

      - name: Run isolated smoke tests
        working-directory: backend
        run: pytest -q test_smoke.py

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JavaScript syntax
        run: |
          set -e
          find app -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          import sys

          failed = False
          for path in Path('app').glob('*.html'):
              text = path.read_text(encoding='utf-8', errors='ignore')
              for index, code in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.I | re.S), 1):
                  if not code.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as f:
                      f.write(code)
                      temp = f.name
                  result = subprocess.run(['node', '--check', temp], capture_output=True, text=True)
                  Path(temp).unlink(missing_ok=True)
                  if result.returncode:
                      failed = True
                      print(f'JavaScript syntax error in {path}, inline script #{index}:')
                      print(result.stderr)
          if failed:
              sys.exit(1)
          PY

  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Compose configuration
        env:
          REELO_SECRET: ci-test-secret
          POSTGRES_PASSWORD: ci-postgres-password
        run: docker compose config -q

      - name: Validate Nginx configuration
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          sudo nginx -t -c "$GITHUB_WORKSPACE/nginx.conf" -p "$GITHUB_WORKSPACE"

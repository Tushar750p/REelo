name: Connect REelo saved API

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect saved router
        shell: python
        run: |
          from pathlib import Path
          p = Path('backend/main.py')
          text = p.read_text(encoding='utf-8')
          import_line = 'from saved_routes import router as saved_router\n'
          if import_line not in text:
              marker = 'from automated_moderation import moderate_text\n'
              text = text.replace(marker, marker + import_line, 1)
          mount_line = 'app.include_router(saved_router)\n'
          if mount_line not in text:
              marker = 'app.add_middleware(CORSMiddleware,allow_origins=os.getenv("CORS_ORIGINS","*").split(","),allow_credentials=True,allow_methods=["*"],allow_headers=["*"])\n'
              if marker in text:
                  text = text.replace(marker, marker + mount_line, 1)
              else:
                  raise SystemExit('FastAPI middleware marker not found')
          p.write_text(text, encoding='utf-8')

      - name: Commit connection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/main.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Connect saved videos API router'
            git push
          fi

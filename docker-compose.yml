services:
  migrate:
    build: ./backend
    command: ["python", "run_migrations.py"]
    environment:
      REELO_DATABASE_URL: ${REELO_DATABASE_URL:-postgresql://reelo:reelo@postgres:5432/reelo}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      REELO_SECRET: ${REELO_SECRET:?Set REELO_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LIVEKIT_URL: ${LIVEKIT_URL:-http://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
      REELO_REDIS_URL: redis://redis:6379/0
      REELO_DATABASE_URL: ${REELO_DATABASE_URL:-postgresql://reelo:reelo@postgres:5432/reelo}
      REELO_ENV: ${REELO_ENV:-development}
      REELO_RATE_LIMIT: ${REELO_RATE_LIMIT:-120}
      REELO_RATE_WINDOW_SECONDS: ${REELO_RATE_WINDOW_SECONDS:-60}
      REELO_OBJECT_STORAGE_BUCKET: ${REELO_OBJECT_STORAGE_BUCKET:-}
      REELO_CDN_BASE_URL: ${REELO_CDN_BASE_URL:-}
    volumes:
      - reelo_media:/app/media
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reelo}
      POSTGRES_USER: ${POSTGRES_USER:-reelo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - reelo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - reelo_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed -e "s|__REELO_LIVEKIT_KEY__|$${LIVEKIT_API_KEY}|g"
        -e "s|__REELO_LIVEKIT_SECRET__|$${LIVEKIT_API_SECRET}|g"
        /etc/livekit.yaml > /tmp/livekit.yaml
        && exec livekit-server --config /tmp/livekit.yaml
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-50020:50000-50020/udp"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7880/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "5173:80"
    volumes:
      - ./app:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  reelo_media:
  reelo_postgres:
  reelo_redis:

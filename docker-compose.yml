services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      REELO_SECRET: ${REELO_SECRET:-local-development-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LIVEKIT_URL: ${LIVEKIT_URL:-http://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
    volumes:
      - reelo_media:/app/media
      - reelo_db:/app
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-50020:50000-50020/udp"
    environment:
      LIVEKIT_KEYS: "devkey: devsecret"
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "5173:80"
    volumes:
      - ./app:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  reelo_media:
  reelo_db:

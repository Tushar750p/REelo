server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter '</body>' '<script src="/comment-actions.js"></script><script src="/video-actions.js"></script><script src="/video-playback.js"></script><script src="/trending.js"></script><script src="/topics.js"></script><script src="/smart-search.js"></script></body>';
  }
}

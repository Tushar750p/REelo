server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Keep browser requests same-origin while allowing an explicit API override.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    client_max_body_size 100m;
  }

  # Uploaded media lives in the API container's shared media volume.
  location /media/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ =404;
    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter '<head>' '<head><script>window.REELO_API=window.REELO_API||location.origin;</script><link rel="stylesheet" href="/reelo-ui-polish.css">';
    sub_filter '</body>' '<script src="/comment-actions.js"></script><script src="/video-actions.js"></script><script src="/video-playback.js"></script><script src="/adaptive-playback.js"></script><script src="/reelo-ui-polish.js"></script><script src="/feed-learning.js"></script><script src="/feed-infinite.js"></script><script src="/trending.js"></script><script src="/topics.js"></script><script src="/smart-search.js"></script><script src="/create-enhanced.js"></script><script src="/camera-integration.js"></script><script src="/live-sfu.js"></script><script src="/live-moderation.js"></script><script src="/live-gifts.js"></script></body>';
  }
}

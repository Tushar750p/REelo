# REelo LiveKit production-style configuration.
# Credentials are injected by docker-compose at container startup.
port: 7880
bind_addresses:
  - 0.0.0.0
rtc:
  tcp_port: 7881
  udp_port: 7882
  port_range_start: 50000
  port_range_end: 50020
redis:
  address: redis:6379
keys:
  __REELO_LIVEKIT_KEY__: __REELO_LIVEKIT_SECRET__
turn:
  enabled: false
logging:
  level: info
room:
  auto_create: true
  empty_timeout: 300

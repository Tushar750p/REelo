<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>REelo Editor</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font:14px Inter,system-ui,sans-serif}.wrap{max-width:520px;margin:auto;min-height:100vh;background:#0b0b0b}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #252525;position:sticky;top:0;background:#0b0b0bf5;z-index:3}.top button{border:0;background:none;color:#fff;font-size:15px;font-weight:700}.done{background:#fff!important;color:#000!important;border-radius:10px!important;padding:9px 14px!important}.preview{height:52vh;min-height:330px;background:#000;display:grid;place-items:center;position:relative}.preview video{max-width:100%;max-height:100%;width:auto;height:auto}.empty{color:#777;text-align:center}.timeline{padding:14px 16px}.track{height:58px;border-radius:12px;background:repeating-linear-gradient(90deg,#222 0 8%,#171717 8% 10%);border:1px solid #333;position:relative}.range{position:absolute;top:0;bottom:0;width:2px;background:#fff}.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 12px 18px}.tool{border:1px solid #292929;background:#151515;color:#fff;border-radius:13px;padding:12px 5px;font-weight:700}.tool small{display:block;color:#888;margin-top:4px;font-weight:500}.panel{padding:0 15px 22px}.panel h3{margin:10px 0}.row{display:flex;gap:9px;overflow:auto}.chip{white-space:nowrap;border:1px solid #333;background:#171717;color:#fff;border-radius:20px;padding:9px 13px}.slider{width:100%}.field{width:100%;margin-top:8px;background:#151515;border:1px solid #333;border-radius:11px;padding:12px;color:#fff;outline:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.action{border:1px solid #333;background:#171717;color:#fff;border-radius:11px;padding:12px;font-weight:800}.primary{border:0;background:#fff;color:#000}.status{margin:10px 0;padding:11px;border-radius:10px;background:#151515;color:#aaa;display:none}.status.show{display:block}.drafts{border-top:1px solid #292929;padding:18px 15px 30px}.draft{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #222}.draft video{width:70px;height:82px;object-fit:cover;border-radius:9px;background:#111}.draft .meta{flex:1;min-width:0}.draft b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.draft small{color:#777}.draft button{border:1px solid #333;background:#171717;color:#fff;border-radius:9px;padding:8px}.draft .del{color:#ffb4b4}</style></head><body><main class="wrap"><header class="top"><button onclick="history.back()">‹ Back</button><b>REelo Editor</b><button class="done" onclick="publish()">Publish</button></header><section class="preview"><video id="video" controls playsinline></video><div id="empty" class="empty">Choose a video to start editing</div></section><section class="timeline"><div class="track"><div id="range" class="range"></div></div><input id="trim" class="slider" type="range" min="0" max="100" value="100"></section><nav class="tools"><button class="tool" onclick="pick()">✂️<small>Trim</small></button><button class="tool" onclick="speed()">1×<small>Speed</small></button><button class="tool" onclick="filter()">✨<small>Filter</small></button><button class="tool" onclick="text()">T<small>Text</small></button><button class="tool" onclick="music()">🎵<small>Music</small></button></nav><section class="panel"><h3>Quick adjustments</h3><div class="row"><button class="chip" onclick="rotate()">↻ Rotate</button><button class="chip" onclick="flip()">⇋ Flip</button><button class="chip" onclick="mute()">🔇 Mute</button><button class="chip" onclick="resetVideo()">Reset</button></div><input id="caption" class="field" maxlength="2200" placeholder="Write a caption…"><input id="start" class="field" type="number" min="0" step="0.1" placeholder="Trim start (seconds)"><input id="end" class="field" type="number" min="0" step="0.1" placeholder="Trim end (seconds)"><div class="actions"><button class="action" onclick="saveDraft()">💾 Save draft</button><button class="action primary" onclick="publish()">Publish video</button></div><div id="status" class="status"></div></section><section class="drafts"><h3>Saved drafts</h3><div id="draftList">Login to see your drafts.</div></section><input id="file" hidden type="file" accept="video/*"><script>const API=window.REELO_API||'http://localhost:8000',token=localStorage.getItem('reelo_token')||'';const v=document.getElementById('video'),file=document.getElementById('file'),empty=document.getElementById('empty'),statusEl=document.getElementById('status');let url='',draftId=new URLSearchParams(location.search).get('draft')||'',soundId=new URLSearchParams(location.search).get('sound')||'',sourceFile=null,state={speed:1,filter:'none',rotate:0,flip:false,mute:false};const headers=()=>token?{Authorization:'Bearer '+token}:{};const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function setStatus(x){statusEl.textContent=x;statusEl.classList.add('show')}function pick(){file.click()}file.onchange=()=>{const f=file.files[0];if(!f)return;sourceFile=f;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);v.src=url;empty.style.display='none'};async function loadDraft(){if(!draftId||!token)return;try{const r=await fetch(API+'/api/drafts/'+encodeURIComponent(draftId),{headers:headers()});if(!r.ok)return;const d=await r.json();soundId=soundId||d.settings?.sound_id||'';document.getElementById('caption').value=d.caption||'';state={speed:Number(d.settings?.speed)||1,filter:d.settings?.filter||'none',rotate:Number(d.settings?.rotate)||0,flip:!!d.settings?.flip,mute:!!d.settings?.mute};document.getElementById('start').value=d.settings?.start??'';document.getElementById('end').value=d.settings?.end??'';v.src=API+d.url;empty.style.display='none';setStatus('Draft loaded. Continue editing.')}catch(e){}}async function loadDrafts(){if(!token){document.getElementById('draftList').textContent='Log in to save and continue drafts.';return}try{const r=await fetch(API+'/api/drafts',{headers:headers()});const d=await r.json();const items=d.items||[];document.getElementById('draftList').innerHTML=items.length?items.map(x=>`<div class="draft"><video src="${esc(API+x.url)}" muted></video><div class="meta"><b>${esc(x.caption||'Untitled draft')}</b><small>${esc(x.updated_at||'')}</small></div><button onclick="openDraft('${esc(x.id)}')">Open</button><button class="del" onclick="deleteDraft('${esc(x.id)}')">Delete</button></div>`).join(''):'<div style="color:#777;padding:15px 0">No saved drafts yet.</div>'}catch(e){}}function openDraft(id){location.href='editor.html?draft='+encodeURIComponent(id)}async function deleteDraft(id){if(!confirm('Delete this draft?'))return;const r=await fetch(API+'/api/drafts/'+encodeURIComponent(id),{method:'DELETE',headers:headers()});if(r.ok){if(draftId===id)location.href='editor.html';else loadDrafts()}}function speed(){const x=prompt('Playback speed: 0.5, 1, 1.5 or 2',String(state.speed));const n=Number(x);if([.5,1,1.5,2].includes(n)){state.speed=n;v.playbackRate=n}}function filter(){const x=prompt('Filter: none, mono, warm, cool',state.filter)||'none';if(!['none','mono','warm','cool'].includes(x))return;state.filter=x;v.style.filter={none:'none',mono:'grayscale(1)',warm:'sepia(.35) saturate(1.2)',cool:'saturate(.85) hue-rotate(12deg)'}[x]}function text(){document.getElementById('caption').focus()}function music(){location.href='sounds.html?from=editor'+(draftId?'&draft='+encodeURIComponent(draftId):'')}function rotate(){state.rotate=(state.rotate+90)%360;apply()}function flip(){state.flip=!state.flip;apply()}function mute(){state.mute=!state.mute;v.muted=state.mute}function apply(){v.style.transform=`rotate(${state.rotate}deg) scaleX(${state.flip?-1:1})`}function resetVideo(){state={speed:1,filter:'none',rotate:0,flip:false,mute:false};v.playbackRate=1;v.muted=false;v.style.filter='none';v.style.transform='none';document.getElementById('start').value='';document.getElementById('end').value=''}document.getElementById('trim').oninput=e=>document.getElementById('range').style.width=e.target.value+'%';function settings(){return {speed:state.speed,filter:state.filter,rotate:state.rotate,flip:state.flip,mute:state.mute,start:document.getElementById('start').value,end:document.getElementById('end').value,sound_id:soundId}}async function getPublishFile(){if(sourceFile)return sourceFile;if(!draftId)return null;const r=await fetch(API+'/api/drafts/'+encodeURIComponent(draftId),{headers:headers()});if(!r.ok)throw Error('Draft unavailable');const d=await r.json();const b=await fetch(API+d.url,{headers:headers()});if(!b.ok)throw Error('Draft media unavailable');return new File([await b.blob()],d.filename||'draft.mp4',{type:'video/mp4'})}async function saveDraft(){if(!token)return alert('Log in to save drafts.');try{const f=await getPublishFile();if(!f)return alert('Choose a video first.');setStatus('Saving draft…');const fd=new FormData();fd.append('file',f);fd.append('draft_id',draftId);fd.append('caption',document.getElementById('caption').value);fd.append('settings',JSON.stringify(settings()));const r=await fetch(API+'/api/drafts',{method:'POST',headers:headers(),body:fd});const d=await r.json();if(!r.ok)throw Error(d.detail||'Could not save draft');draftId=d.id;history.replaceState({},'',location.pathname+'?draft='+encodeURIComponent(draftId)+(soundId?'&sound='+encodeURIComponent(soundId):''));setStatus('Draft saved. You can continue later.');loadDrafts()}catch(e){setStatus(e.message)}}async function publish(){if(!token)return alert('Log in to publish.');try{const f=await getPublishFile();if(!f)return alert('Choose a video first.');setStatus('Processing video…');const fd=new FormData();fd.append('file',f);fd.append('caption',document.getElementById('caption').value);fd.append('start',document.getElementById('start').value);fd.append('end',document.getElementById('end').value);fd.append('speed',String(state.speed));fd.append('filter_name',state.filter);fd.append('rotate',String(state.rotate));fd.append('flip',String(state.flip));fd.append('mute',String(state.mute));fd.append('sound_id',soundId);const r=await fetch(API+'/api/editor/publish',{method:'POST',headers:headers(),body:fd});const d=await r.json();if(!r.ok)throw Error(d.detail||'Publish failed');if(draftId)await fetch(API+'/api/drafts/'+encodeURIComponent(draftId),{method:'DELETE',headers:headers()});setStatus('Published!');location.href='index.html?published='+encodeURIComponent(d.id)}catch(e){setStatus(e.message)}}loadDraft();loadDrafts();</script></main></body></html>

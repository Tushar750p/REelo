<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>REelo Editor</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font:14px Inter,system-ui,sans-serif}.wrap{max-width:520px;margin:auto;min-height:100vh;background:#0b0b0b}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #252525;position:sticky;top:0;background:#0b0b0bf5;z-index:3}.top button{border:0;background:none;color:#fff;font-size:15px;font-weight:700}.done{background:#fff!important;color:#000!important;border-radius:10px!important;padding:9px 14px!important}.preview{height:55vh;min-height:360px;background:#000;display:grid;place-items:center;position:relative}.preview video{max-width:100%;max-height:100%;width:auto;height:auto}.empty{color:#777}.timeline{padding:14px 16px}.track{height:58px;border-radius:12px;background:repeating-linear-gradient(90deg,#222 0 8%,#171717 8% 10%);border:1px solid #333;position:relative}.range{position:absolute;top:0;bottom:0;width:2px;background:#fff}.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 12px 20px}.tool{border:1px solid #292929;background:#151515;color:#fff;border-radius:13px;padding:12px 5px;font-weight:700}.tool small{display:block;color:#888;margin-top:4px;font-weight:500}.panel{padding:0 15px 22px}.panel h3{margin:10px 0}.row{display:flex;gap:9px;overflow:auto}.chip{white-space:nowrap;border:1px solid #333;background:#171717;color:#fff;border-radius:20px;padding:9px 13px}.slider{width:100%}.field{width:100%;margin-top:8px;background:#151515;border:1px solid #333;border-radius:11px;padding:12px;color:#fff}</style></head><body><main class="wrap"><header class="top"><button onclick="history.back()">‹ Back</button><b>REelo Editor</b><button class="done" onclick="finish()">Next</button></header><section class="preview"><video id="video" controls playsinline></video><div id="empty" class="empty">Choose a video to start editing</div></section><section class="timeline"><div id="track" class="track"><div id="range" class="range"></div></div><input id="trim" class="slider" type="range" min="0" max="100" value="100"></section><nav class="tools"><button class="tool" onclick="pick()">✂️<small>Trim</small></button><button class="tool" onclick="speed()">1×<small>Speed</small></button><button class="tool" onclick="filter()">✨<small>Filter</small></button><button class="tool" onclick="text()">T<small>Text</small></button><button class="tool" onclick="music()">🎵<small>Music</small></button></nav><section class="panel"><h3>Quick adjustments</h3><div class="row"><button class="chip" onclick="rotate()">↻ Rotate</button><button class="chip" onclick="flip()">⇋ Flip</button><button class="chip" onclick="mute()">🔇 Mute</button><button class="chip" onclick="resetVideo()">Reset</button></div><input id="caption" class="field" placeholder="Add text overlay…"><input id="start" class="field" type="number" min="0" step="0.1" placeholder="Trim start (seconds)"><input id="end" class="field" type="number" min="0" step="0.1" placeholder="Trim end (seconds)"></section><input id="file" hidden type="file" accept="video/*"><script>const v=document.getElementById('video'),file=document.getElementById('file'),empty=document.getElementById('empty');let url='',state={speed:1,filter:'none',rotate:0,flip:false,mute:false};function pick(){file.click()}file.onchange=()=>{const f=file.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);v.src=url;empty.style.display='none'}function speed(){const x=prompt('Playback speed: 0.5, 1, 1.5 or 2','1');const n=Number(x);if([.5,1,1.5,2].includes(n)){state.speed=n;v.playbackRate=n}}function filter(){const x=prompt('Filter: none, mono, warm, cool','none')||'none';if(!['none','mono','warm','cool'].includes(x))return;state.filter=x;v.style.filter={none:'none',mono:'grayscale(1)',warm:'sepia(.35) saturate(1.2)',cool:'saturate(.85) hue-rotate(12deg)'}[x]}function text(){const x=document.getElementById('caption');x.focus();x.select()}function music(){location.href='sounds.html'}function rotate(){state.rotate=(state.rotate+90)%360;apply()}function flip(){state.flip=!state.flip;apply()}function mute(){state.mute=!state.mute;v.muted=state.mute}function apply(){v.style.transform=`rotate(${state.rotate}deg) scaleX(${state.flip?-1:1})`}function resetVideo(){state={speed:1,filter:'none',rotate:0,flip:false,mute:false};v.playbackRate=1;v.muted=false;v.style.filter='none';v.style.transform='none'}document.getElementById('trim').oninput=e=>{document.getElementById('range').style.width=e.target.value+'%'};function finish(){if(!file.files[0])return alert('Choose a video first.');const params=new URLSearchParams({editor:'1',caption:document.getElementById('caption').value,start:document.getElementById('start').value,end:document.getElementById('end').value,speed:String(state.speed),filter:state.filter,rotate:String(state.rotate),flip:String(state.flip),mute:String(state.mute)});location.href='index.html?'+params.toString()}</script></main></body></html>

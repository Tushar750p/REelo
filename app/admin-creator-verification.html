<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Verification · REelo Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f6f7f9;color:#111}.wrap{max-width:1280px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:42px;height:42px;border-radius:13px;background:#111;color:#fff;display:grid;place-items:center;font-weight:800}.top h1{margin:0;font-size:27px}.sub{margin:4px 0 0;color:#777;font-size:13px}.back,button{border:0;border-radius:11px;padding:10px 14px;cursor:pointer;font:inherit}.back{background:#fff;border:1px solid #e5e5e8}.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs button{background:#fff;border:1px solid #ddd}.tabs button.active{background:#111;color:#fff}.panel{background:#fff;border:1px solid #e6e7eb;border-radius:18px;overflow:hidden;box-shadow:0 5px 20px #00000008}.row{display:grid;grid-template-columns:1.25fr .5fr .72fr 1.15fr .9fr 1.15fr;gap:14px;padding:16px 18px;border-bottom:1px solid #eee;align-items:center}.row:last-child{border-bottom:0}.head{font-weight:700;background:#fafafa;font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.04em}.name{font-weight:750}.muted{color:#777;font-size:12px;margin-top:4px}.badge{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:99px;font-size:11px;font-weight:750;text-transform:capitalize}.badge:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}.pending{background:#fff4d2;color:#8a5a00}.approved,.verified{background:#e8f8ee;color:#14743c}.rejected,.failed{background:#ffe9e9;color:#a72b2b}.started{background:#eaf2ff;color:#2459a6}.review{background:#f2eaff;color:#7045a8}.expired{background:#f0f0f1;color:#666}.not_started{background:#f0f0f1;color:#666}.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.approve{background:#111;color:#fff}.approve:disabled{opacity:.38;cursor:not-allowed}.reject{background:#f0f0f1}.history{background:#f7f7f8;border:1px solid #e4e4e7}.kyc-block{display:flex;flex-direction:column;align-items:flex-start;gap:5px}.kyc-provider{font-size:11px;color:#777}.kyc-ref{font-family:ui-monospace,SFMono-Regular,monospace;font-size:10px;word-break:break-all;color:#777;max-width:180px}.warning{font-size:10px;color:#8a5a00;margin-top:2px}.success{font-size:10px;color:#14743c;margin-top:2px}.empty,.error{padding:28px}.error{color:#b42318;background:#fff1f1}.count{font-size:13px;color:#777;margin:0 0 10px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.card{background:#fff;border-radius:20px;padding:24px;width:min(560px,100%);box-shadow:0 20px 70px #0004}.card h2{margin:0 0 6px}.card textarea{width:100%;min-height:120px;padding:12px;border:1px solid #ddd;border-radius:12px;resize:vertical;font:inherit;margin-top:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.history-list{margin-top:14px;display:grid;gap:8px;max-height:55vh;overflow:auto}.history-item{padding:12px;background:#f7f7f8;border-radius:12px;font-size:12px}.flow{display:flex;gap:5px;align-items:center;margin-top:5px;font-size:10px;color:#777}.dot{width:7px;height:7px;border-radius:50%;background:#bbb}.dot.on{background:#111}@media(max-width:1000px){.wrap{padding:16px}.row{grid-template-columns:1.3fr .7fr .9fr 1fr}.row div:nth-child(2),.row div:nth-child(5){display:none}.head div:nth-child(2),.head div:nth-child(5){display:none}}@media(max-width:650px){.top{align-items:flex-start;gap:12px}.top h1{font-size:21px}.row{grid-template-columns:1fr .9fr .9fr}.row div:nth-child(3){display:none}.head div:nth-child(3){display:none}.actions{align-items:flex-start}.kyc-ref{max-width:120px}}</style></head><body><main class="wrap"><header class="top"><div class="brand"><div class="brand-mark">R</div><div><h1>Creator Verification</h1><p class="sub">Review identity, KYC status and creator eligibility</p></div></div><button class="back" onclick="location.href='index.html'">← Back</button></header><div class="tabs"><button data-status="pending" class="active">Pending</button><button data-status="approved">Approved</button><button data-status="rejected">Rejected</button><button data-status="all">All</button></div><p class="count" id="count">Loading…</p><section class="panel"><div class="row head"><div>Creator</div><div>Country</div><div>Creator Status</div><div>Identity / KYC</div><div>Updated</div><div>Actions</div></div><div id="list"></div></section></main><div class="modal" id="rejectModal"><div class="card"><h2>Reject verification</h2><p class="muted">Give the creator a clear reason so they know what to fix.</p><textarea id="reason" maxlength="500" placeholder="Example: Legal name could not be verified. Please resubmit with matching details."></textarea><div class="modal-actions"><button onclick="closeReject()">Cancel</button><button class="approve" onclick="submitReject()">Reject verification</button></div></div></div><div class="modal" id="historyModal"><div class="card"><h2>Review history</h2><p class="muted">All admin decisions for this verification request.</p><div class="history-list" id="history"></div><div class="modal-actions"><button onclick="document.getElementById('historyModal').style.display='none'">Close</button></div></div></div><script>const API=window.REELO_API||'http://localhost:8000',token=localStorage.getItem('reelo_token');const headers=token?{Authorization:'Bearer '+token}:{};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let status='pending',rejectId='';function label(v){return String(v||'not_started').replace(/_/g,' ')}function badge(v){const s=String(v||'not_started');return `<span class="badge ${esc(s)}">${esc(label(s))}</span>`}async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{...headers,...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='index.html';throw Error('Login required')}if(!r.ok)throw Error(d.detail||'Request failed');return d}function kycFlow(ks){if(ks==='verified')return '<div class="success">Identity confirmed</div>';if(ks==='started')return '<div class="flow"><span class="dot on"></span>Verification in progress</div>';if(ks==='review')return '<div class="warning">Manual review required</div>';if(ks==='failed')return '<div class="warning">Identity check failed</div>';if(ks==='expired')return '<div class="warning">Verification expired</div>';return '<div class="warning">Complete KYC first</div>'}async function load(){try{const d=await api('/api/admin/creator-verification?status='+encodeURIComponent(status));document.getElementById('count').textContent=d.items.length+' request'+(d.items.length===1?'':'s');document.getElementById('list').innerHTML=d.items.map(x=>{const ks=String(x.kyc_status||'not_started');const canApprove=x.status!=='approved'&&ks==='verified';const disabled=x.status!=='approved'&&!canApprove?'disabled':'';return `<div class="row"><div><div class="name">${esc(x.legal_name)}</div><div class="muted">Creator ID: ${esc(x.user_id)}</div></div><div>${esc(x.country)}</div><div>${badge(x.status)}</div><div class="kyc-block">${badge(ks)}<div class="kyc-provider">${esc(x.kyc_provider||'No provider')}</div>${x.kyc_reference?`<div class="kyc-ref">${esc(x.kyc_reference)}</div>`:''}${kycFlow(ks)}</div><div class="muted">${esc(x.updated_at||'')}</div><div class="actions">${x.status!=='approved'?`<button class="approve" ${disabled} title="${canApprove?'Approve creator':'KYC verification must be completed first'}" onclick="changeStatus('${esc(x.id)}','approved')">Approve</button>`:''}${x.status!=='rejected'?`<button class="reject" onclick="openReject('${esc(x.id)}')">Reject</button>`:''}<button class="history" onclick="showHistory('${esc(x.id)}')">History</button></div></div>`}).join('')||'<div class="empty">No verification requests in this view.</div>'}catch(e){document.getElementById('list').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function changeStatus(id,next){if(!confirm('Approve this creator verification?'))return;try{await api('/api/admin/creator-verification/'+encodeURIComponent(id)+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:next})});await load()}catch(e){alert(e.message)}}function openReject(id){rejectId=id;document.getElementById('reason').value='';document.getElementById('rejectModal').style.display='flex';document.getElementById('reason').focus()}function closeReject(){document.getElementById('rejectModal').style.display='none';rejectId=''}async function submitReject(){const reason=document.getElementById('reason').value.trim();if(reason.length<3){alert('Please provide a rejection reason.');return}try{await api('/api/admin/creator-verification/'+encodeURIComponent(rejectId)+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'rejected',reason})});closeReject();await load()}catch(e){alert(e.message)}}async function showHistory(id){try{const d=await api('/api/admin/creator-verification/'+encodeURIComponent(id)+'/history');document.getElementById('history').innerHTML=d.items.map(x=>`<div class="history-item"><b>${esc(x.previous_status)} → ${esc(x.status)}</b><div>${esc(x.reason||'No reason recorded')}</div><div class="muted">Admin: ${esc(x.admin_user_id)} · ${esc(x.created_at)}</div></div>`).join('')||'<div class="muted">No review history yet.</div>';document.getElementById('historyModal').style.display='flex'}catch(e){alert(e.message)}}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');status=b.dataset.status;load()});if(!token)location.href='index.html';else load();</script></body></html>

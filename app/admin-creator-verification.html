<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Verification · REelo Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f7f7f8;color:#111}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:27px}.back,button{border:0;border-radius:11px;padding:10px 14px;cursor:pointer}.back{background:#fff}.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs button{background:#fff;border:1px solid #ddd}.tabs button.active{background:#111;color:#fff}.panel{background:#fff;border:1px solid #e8e8eb;border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:1fr 1fr .7fr .7fr 1fr;gap:12px;padding:16px 18px;border-bottom:1px solid #eee;align-items:center}.head{font-weight:700;background:#fafafa}.name{font-weight:700}.muted{color:#777;font-size:12px;margin-top:4px}.badge{display:inline-block;padding:6px 9px;border-radius:99px;font-size:11px;font-weight:700;text-transform:capitalize}.pending{background:#fff5d6}.approved{background:#e9f8ee}.rejected{background:#ffeaea}.actions{display:flex;gap:7px;flex-wrap:wrap}.approve{background:#111;color:#fff}.reject{background:#eee}.empty,.error{padding:24px}.error{color:#b42318;background:#fff1f1}.count{font-size:13px;color:#777;margin:0 0 10px}@media(max-width:750px){.wrap{padding:14px}.row{grid-template-columns:1.4fr .8fr .7fr}.row div:nth-child(2){display:none}.row div:nth-child(4){display:none}.head div:nth-child(2),.head div:nth-child(4){display:none}.top h1{font-size:22px}}
</style></head><body><main class="wrap"><header class="top"><h1>Creator Verification</h1><button class="back" onclick="location.href='index.html'">← Back</button></header><div class="tabs"><button data-status="pending" class="active">Pending</button><button data-status="approved">Approved</button><button data-status="rejected">Rejected</button><button data-status="all">All</button></div><p class="count" id="count">Loading…</p><section class="panel"><div class="row head"><div>Creator</div><div>Country</div><div>Status</div><div>Updated</div><div>Actions</div></div><div id="list"></div></section></main><script>const API=window.REELO_API||'http://localhost:8000',token=localStorage.getItem('reelo_token');const headers=token?{Authorization:'Bearer '+token}:{};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let status='pending';async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{...headers,...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='index.html';throw Error('Login required')}if(!r.ok)throw Error(d.detail||'Request failed');return d}async function load(){try{const d=await api('/api/admin/creator-verification?status='+encodeURIComponent(status));document.getElementById('count').textContent=d.items.length+' request'+(d.items.length===1?'':'s');document.getElementById('list').innerHTML=d.items.map(x=>`<div class="row"><div><div class="name">${esc(x.legal_name)}</div><div class="muted">Creator ID: ${esc(x.user_id)}</div></div><div>${esc(x.country)}</div><div><span class="badge ${esc(x.status)}">${esc(x.status)}</span></div><div class="muted">${esc(x.updated_at||'')}</div><div class="actions">${x.status!=='approved'?`<button class="approve" onclick="changeStatus('${esc(x.id)}','approved')">Approve</button>`:''}${x.status!=='rejected'?`<button class="reject" onclick="changeStatus('${esc(x.id)}','rejected')">Reject</button>`:''}</div></div>`).join('')||'<div class="empty">No verification requests in this view.</div>'}catch(e){document.getElementById('list').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function changeStatus(id,next){if(!confirm(next==='approved'?'Approve this creator verification?':'Reject this creator verification?'))return;try{await api('/api/admin/creator-verification/'+encodeURIComponent(id)+'/status?status='+next,{method:'POST'});await load()}catch(e){alert(e.message)}}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');status=b.dataset.status;load()});if(!token)location.href='index.html';else load();</script></body></html>

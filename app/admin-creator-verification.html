<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Verification · REelo Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f7f7f8;color:#111}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:27px}.back,button{border:0;border-radius:11px;padding:10px 14px;cursor:pointer}.back{background:#fff}.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs button{background:#fff;border:1px solid #ddd}.tabs button.active{background:#111;color:#fff}.panel{background:#fff;border:1px solid #e8e8eb;border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:1.2fr .55fr .8fr .75fr .9fr 1.1fr;gap:12px;padding:16px 18px;border-bottom:1px solid #eee;align-items:center}.head{font-weight:700;background:#fafafa}.name{font-weight:700}.muted{color:#777;font-size:12px;margin-top:4px}.badge{display:inline-block;padding:6px 9px;border-radius:99px;font-size:11px;font-weight:700;text-transform:capitalize}.pending{background:#fff5d6}.approved{background:#e9f8ee}.rejected{background:#ffeaea}.verified{background:#e9f8ee}.started{background:#eaf2ff}.not_started{background:#f0f0f1}.actions{display:flex;gap:7px;flex-wrap:wrap}.approve{background:#111;color:#fff}.approve:disabled{opacity:.45;cursor:not-allowed}.reject{background:#eee}.history{background:#f4f4f5}.empty,.error{padding:24px}.error{color:#b42318;background:#fff1f1}.count{font-size:13px;color:#777;margin:0 0 10px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.card{background:#fff;border-radius:18px;padding:22px;width:min(520px,100%)}.card h2{margin-top:0}.card textarea{width:100%;min-height:110px;padding:12px;border:1px solid #ddd;border-radius:12px;resize:vertical;font:inherit}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.history-list{margin-top:14px;display:grid;gap:8px}.history-item{padding:10px 12px;background:#f7f7f8;border-radius:10px;font-size:12px}.kyc-ref{font-family:ui-monospace,SFMono-Regular,monospace;font-size:10px;word-break:break-all;color:#666;margin-top:4px}.warning{font-size:11px;color:#8a5a00;margin-top:5px}@media(max-width:900px){.wrap{padding:14px}.row{grid-template-columns:1.4fr .7fr .8fr .8fr}.row div:nth-child(2),.row div:nth-child(4){display:none}.head div:nth-child(2),.head div:nth-child(4){display:none}.top h1{font-size:22px}}@media(max-width:620px){.row{grid-template-columns:1fr .8fr .9fr}.row div:nth-child(3){display:none}.head div:nth-child(3){display:none}}</style></head><body><main class="wrap"><header class="top"><h1>Creator Verification</h1><button class="back" onclick="location.href='index.html'">← Back</button></header><div class="tabs"><button data-status="pending" class="active">Pending</button><button data-status="approved">Approved</button><button data-status="rejected">Rejected</button><button data-status="all">All</button></div><p class="count" id="count">Loading…</p><section class="panel"><div class="row head"><div>Creator</div><div>Country</div><div>Creator Status</div><div>KYC</div><div>Updated</div><div>Actions</div></div><div id="list"></div></section></main><div class="modal" id="rejectModal"><div class="card"><h2>Reject verification</h2><p class="muted">Give the creator a clear reason so they know what to fix.</p><textarea id="reason" maxlength="500" placeholder="Example: Legal name could not be verified. Please resubmit with matching details."></textarea><div class="modal-actions"><button onclick="closeReject()">Cancel</button><button class="approve" onclick="submitReject()">Reject</button></div></div></div><div class="modal" id="historyModal"><div class="card"><h2>Review history</h2><div class="history-list" id="history"></div><div class="modal-actions"><button onclick="document.getElementById('historyModal').style.display='none'">Close</button></div></div></div><script>const API=window.REELO_API||'http://localhost:8000',token=localStorage.getItem('reelo_token');const headers=token?{Authorization:'Bearer '+token}:{};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let status='pending',rejectId='';function kycLabel(v){return String(v||'not_started').replace('_',' ')}function kycBadge(v){const s=String(v||'not_started');return `<span class="badge ${esc(s)}">${esc(kycLabel(s))}</span>`}async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{...headers,...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='index.html';throw Error('Login required')}if(!r.ok)throw Error(d.detail||'Request failed');return d}async function load(){try{const d=await api('/api/admin/creator-verification?status='+encodeURIComponent(status));document.getElementById('count').textContent=d.items.length+' request'+(d.items.length===1?'':'s');document.getElementById('list').innerHTML=d.items.map(x=>{const ks=String(x.kyc_status||'not_started');const canApprove=x.status!=='approved'&&ks==='verified';const disabled=x.status!=='approved'&&!canApprove?'disabled':'';const note=x.status!=='approved'&&!canApprove?`<div class="warning">KYC must be verified</div>`:'';return `<div class="row"><div><div class="name">${esc(x.legal_name)}</div><div class="muted">Creator ID: ${esc(x.user_id)}</div></div><div>${esc(x.country)}</div><div><span class="badge ${esc(x.status)}">${esc(x.status)}</span></div><div>${kycBadge(ks)}<div class="muted">${esc(x.kyc_provider||'—')}</div>${x.kyc_reference?`<div class="kyc-ref">${esc(x.kyc_reference)}</div>`:''}</div><div class="muted">${esc(x.updated_at||'')}</div><div class="actions">${x.status!=='approved'?`<button class="approve" ${disabled} title="${canApprove?'Approve creator':'Complete KYC verification first'}" onclick="changeStatus('${esc(x.id)}','approved')">Approve</button>${note}`:''}${x.status!=='rejected'?`<button class="reject" onclick="openReject('${esc(x.id)}')">Reject</button>`:''}<button class="history" onclick="showHistory('${esc(x.id)}')">History</button></div></div>`}).join('')||'<div class="empty">No verification requests in this view.</div>'}catch(e){document.getElementById('list').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function changeStatus(id,next){if(!confirm('Approve this creator verification?'))return;try{await api('/api/admin/creator-verification/'+encodeURIComponent(id)+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:next})});await load()}catch(e){alert(e.message)}}function openReject(id){rejectId=id;document.getElementById('reason').value='';document.getElementById('rejectModal').style.display='flex';document.getElementById('reason').focus()}function closeReject(){document.getElementById('rejectModal').style.display='none';rejectId=''}async function submitReject(){const reason=document.getElementById('reason').value.trim();if(reason.length<3){alert('Please provide a rejection reason.');return}try{await api('/api/admin/creator-verification/'+encodeURIComponent(rejectId)+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'rejected',reason})});closeReject();await load()}catch(e){alert(e.message)}}async function showHistory(id){try{const d=await api('/api/admin/creator-verification/'+encodeURIComponent(id)+'/history');document.getElementById('history').innerHTML=d.items.map(x=>`<div class="history-item"><b>${esc(x.previous_status)} → ${esc(x.status)}</b><div>${esc(x.reason||'No reason recorded')}</div><div class="muted">Admin: ${esc(x.admin_user_id)} · ${esc(x.created_at)}</div></div>`).join('')||'<div class="muted">No review history yet.</div>';document.getElementById('historyModal').style.display='flex'}catch(e){alert(e.message)}}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');status=b.dataset.status;load()});if(!token)location.href='index.html';else load();</script></body></html>

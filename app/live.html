<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>REelo LIVE</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font:14px Inter,system-ui,sans-serif;height:100%}.wrap{max-width:520px;margin:auto;height:100dvh;background:#090909;position:relative;overflow:hidden}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #242424}.back,.ghost{border:0;background:none;color:#fff;font-size:25px}.ghost{font-size:13px;background:#191919;border-radius:18px;padding:9px 12px}.body{padding:18px}.title{width:100%;background:#161616;border:1px solid #333;border-radius:13px;color:#fff;padding:13px;outline:0}.primary{width:100%;border:0;background:#fff;color:#000;border-radius:12px;padding:13px;font-weight:900;margin-top:12px}.rooms{margin-top:22px}.room{padding:15px 0;border-bottom:1px solid #242424;display:flex;align-items:center;gap:12px}.live-dot{width:10px;height:10px;background:#f33;border-radius:50%;box-shadow:0 0 12px #f33}.meta{flex:1}.meta b{display:block}.meta small{color:#999}.join{border:0;background:#fff;color:#000;border-radius:9px;padding:9px 12px;font-weight:800}.stage{display:none;height:calc(100% - 62px);position:relative}.stage.show{display:block}.camera{width:100%;height:100%;object-fit:cover;background:#111}.overlay{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#0008,transparent 28%,transparent 55%,#000e)}.livebar{position:absolute;top:15px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}.badge{background:#e33;border-radius:8px;padding:6px 9px;font-weight:900}.viewers{background:#0008;border-radius:15px;padding:7px 10px;margin-left:auto}.close{border:0;background:#0009;color:#fff;border-radius:16px;padding:7px 10px;font-weight:800}.chat{position:absolute;left:12px;right:12px;bottom:82px;height:42%;overflow:auto;display:flex;flex-direction:column;justify-content:flex-end;gap:7px}.msg{background:#0008;border-radius:12px;padding:7px 10px;width:max-content;max-width:90%}.msg b{font-size:12px}.msg span{color:#ddd;margin-left:5px}.composer{position:absolute;left:12px;right:12px;bottom:14px;display:flex;gap:7px}.composer input{flex:1;background:#111c;border:1px solid #555;color:#fff;border-radius:22px;padding:11px 14px;outline:0}.composer button{border:0;border-radius:22px;background:#fff;color:#000;font-weight:900;padding:0 15px}.reacts{position:absolute;right:14px;bottom:150px;display:flex;flex-direction:column;gap:9px}.reacts button{border:0;background:#0008;border-radius:50%;width:44px;height:44px;font-size:21px}.float{position:absolute;right:72px;bottom:100px;animation:up 1.2s ease-out forwards;font-size:25px;pointer-events:none}@keyframes up{from{opacity:1;transform:translateY(0) scale(.7)}to{opacity:0;transform:translateY(-150px) scale(1.5)}}.empty{color:#777;text-align:center;padding:30px}</style></head><body><main class="wrap"><header class="top"><button class="back" onclick="leaveRoom()">‹</button><b>REelo LIVE</b><button class="ghost" onclick="showCreate()">Go Live</button></header><section id="home" class="body"><div id="create" style="display:none"><input id="title" class="title" maxlength="120" placeholder="What are you going live about?"><button class="primary" onclick="startLive()">🔴 Start LIVE</button></div><section class="rooms"><h3>Live now</h3><div id="rooms">Loading…</div></section></section><section id="stage" class="stage"><video id="camera" class="camera" autoplay muted playsinline></video><div class="overlay"></div><div class="livebar"><span class="badge">LIVE</span><span id="viewers" class="viewers">0 viewers</span><button id="endBtn" class="close" style="display:none" onclick="endLive()">End</button></div><div id="chat" class="chat"></div><div class="reacts"><button onclick="react('❤️')">❤️</button><button onclick="react('🔥')">🔥</button><button onclick="react('👏')">👏</button><button onclick="react('😂')">😂</button></div><div class="composer"><input id="message" maxlength="300" placeholder="Say something…"><button onclick="sendMessage()">Send</button></div></section><script>const API=window.REELO_API||'http://localhost:8000',token=localStorage.getItem('reelo_token')||'';const $=id=>document.getElementById(id);const headers=()=>token?{Authorization:'Bearer '+token}:{};const wsBase=()=>((location.protocol==='https:'?'wss://':'ws://')+location.host);let room=null,stream=null,poll=null,socket=null,isHost=false,localId='';const peers=new Map(),rtcConfig={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}async function loadRooms(){try{const r=await fetch(API+'/api/live');const d=await r.json();$('rooms').innerHTML=(d.items||[]).length?d.items.map(x=>`<div class="room"><i class="live-dot"></i><div class="meta"><b>@${esc(x.username||'creator')}</b><small>${esc(x.title)} · ${Number(x.viewer_count||0)} viewers</small></div><button class="join" onclick="join('${esc(x.id)}')">Join</button></div>`).join(''):'<div class="empty">No one is live right now.</div>'}catch(e){$('rooms').innerHTML='<div class="empty">LIVE is temporarily unavailable.</div>'}}function showCreate(){if(!token){location.href='index.html?login=1';return}$('create').style.display=$('create').style.display==='none'?'block':'none'}async function startLive(){if(!navigator.mediaDevices?.getUserMedia)return alert('Camera is not supported in this browser.');const title=$('title').value.trim()||'Live on REelo';const r=await fetch(API+'/api/live',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({title})});const d=await r.json();if(!r.ok)return alert(d.detail||'Unable to start LIVE');await openRoom(d.id,true)}async function openRoom(id,host){room=id;isHost=host;$('home').style.display='none';$('stage').classList.add('show');$('endBtn').style.display=host?'block':'none';if(host){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1080},height:{ideal:1920}},audio:true});$('camera').srcObject=stream}catch(e){alert('Camera and microphone permission is required for LIVE video.');await fetch(API+'/api/live/'+id+'/end',{method:'POST',headers:headers()});location.reload();return}}else{const jr=await fetch(API+'/api/live/'+id+'/join',{method:'POST',headers:headers()});if(!jr.ok)return location.reload()}connectSignal();await refresh();poll=setInterval(refresh,1800)}function connectSignal(){socket=new WebSocket(wsBase()+'/api/live/ws/'+encodeURIComponent(room)+'?token='+encodeURIComponent(token));socket.onopen=()=>{if(!isHost)socket.send(JSON.stringify({type:'peer-join'}))};socket.onmessage=async e=>{const m=JSON.parse(e.data||'{}');if(m.type==='ready'){localId=m.user_id||'';if(!isHost)socket.send(JSON.stringify({type:'peer-join'}));return}if(m.from===localId)return;if(m.to&&m.to!==localId)return;if(m.type==='peer-join'&&isHost){await makeOffer(m.from);return}if(m.type==='offer'&&!isHost){await handleOffer(m);return}if(m.type==='answer'&&isHost){await handleAnswer(m);return}if(m.type==='ice'){await handleIce(m)}}}async function makeOffer(viewerId){if(!stream||!socket)return;const pc=new RTCPeerConnection(rtcConfig);peers.set(viewerId,pc);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>{if(e.candidate)socket.send(JSON.stringify({type:'ice',to:viewerId,candidate:e.candidate}))};pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState))peers.delete(viewerId)};await pc.setLocalDescription(await pc.createOffer());socket.send(JSON.stringify({type:'offer',to:viewerId,description:pc.localDescription}))}async function handleOffer(m){const pc=new RTCPeerConnection(rtcConfig);peers.set(m.from,pc);pc.ontrack=e=>{if(e.streams[0])$('camera').srcObject=e.streams[0]};pc.onicecandidate=e=>{if(e.candidate)socket.send(JSON.stringify({type:'ice',to:m.from,candidate:e.candidate}))};await pc.setRemoteDescription(m.description);await pc.setLocalDescription(await pc.createAnswer());socket.send(JSON.stringify({type:'answer',to:m.from,description:pc.localDescription}))}async function handleAnswer(m){const pc=peers.get(m.from);if(pc&&!pc.currentRemoteDescription)await pc.setRemoteDescription(m.description)}async function handleIce(m){const pc=peers.get(m.from);if(pc&&m.candidate)try{await pc.addIceCandidate(m.candidate)}catch(e){}}async function refresh(){if(!room)return;const r=await fetch(API+'/api/live/'+room);if(!r.ok){leaveRoom();return}const d=await r.json();$('viewers').textContent=Number(d.room?.viewer_count||0)+' viewers';$('chat').innerHTML=(d.messages||[]).map(m=>`<div class="msg"><b>@${esc(m.username||'user')}</b><span>${esc(m.message)}</span></div>`).join('');$('chat').scrollTop=$('chat').scrollHeight}async function sendMessage(){if(!room)return;const input=$('message'),text=input.value.trim();if(!text)return;const r=await fetch(API+'/api/live/'+room+'/messages',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({message:text})});if(r.ok){input.value='';refresh()}}async function react(x){if(!room)return;const r=document.createElement('div');r.className='float';r.textContent=x;document.body.appendChild(r);setTimeout(()=>r.remove(),1200);fetch(API+'/api/live/'+room+'/reactions',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({reaction:x})})}async function join(id){if(!token){location.href='index.html?login=1';return}await openRoom(id,false)}async function endLive(){if(!room||!isHost)return;await fetch(API+'/api/live/'+room+'/end',{method:'POST',headers:headers()});leaveRoom(false);location.reload()}function leaveRoom(sendLeave=true){if(!room){history.back();return}if(sendLeave&&!isHost)fetch(API+'/api/live/'+room+'/leave',{method:'POST',headers:headers(),keepalive:true});clearInterval(poll);socket?.close();peers.forEach(p=>p.close());peers.clear();stream?.getTracks().forEach(t=>t.stop());room=null;location.href='live.html'}window.addEventListener('pagehide',()=>{if(room&&!isHost)fetch(API+'/api/live/'+room+'/leave',{method:'POST',headers:headers(),keepalive:true});stream?.getTracks().forEach(t=>t.stop())});loadRooms();</script></main></body></html>

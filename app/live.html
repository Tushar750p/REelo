<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>REelo LIVE</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font:14px Inter,system-ui,sans-serif;height:100%}.wrap{max-width:520px;margin:auto;height:100dvh;background:#090909;position:relative;overflow:hidden}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #242424}.back,.ghost{border:0;background:none;color:#fff;font-size:25px}.ghost{font-size:13px;background:#191919;border-radius:18px;padding:9px 12px}.body{padding:18px}.title{width:100%;background:#161616;border:1px solid #333;border-radius:13px;color:#fff;padding:13px;outline:0}.primary{width:100%;border:0;background:#fff;color:#000;border-radius:12px;padding:13px;font-weight:900;margin-top:12px}.rooms{margin-top:22px}.room{padding:15px 0;border-bottom:1px solid #242424;display:flex;align-items:center;gap:12px}.live-dot{width:10px;height:10px;background:#f33;border-radius:50%;box-shadow:0 0 12px #f33}.meta{flex:1}.meta b{display:block}.meta small{color:#999}.join,.invite{border:0;background:#fff;color:#000;border-radius:9px;padding:9px 12px;font-weight:800}.stage{display:none;height:calc(100% - 62px);position:relative}.stage.show{display:block}.camera{width:100%;height:100%;object-fit:cover;background:#111}.sfu-grid{position:absolute;inset:8px 8px 100px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;pointer-events:none;z-index:2}.tile{position:relative;min-height:120px;border-radius:14px;overflow:hidden;background:#171717;border:1px solid #333}.tile video{width:100%;height:100%;object-fit:cover}.tile span{position:absolute;left:7px;bottom:6px;background:#000b;border-radius:10px;padding:4px 7px;font-size:11px}.overlay{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#0008,transparent 28%,transparent 55%,#000e);z-index:3}.livebar{position:absolute;top:15px;left:14px;right:14px;display:flex;align-items:center;gap:8px;z-index:5}.badge{background:#e33;border-radius:8px;padding:6px 9px;font-weight:900}.viewers{background:#0008;border-radius:15px;padding:7px 10px;margin-left:auto}.close,.invite{border:0;background:#0009;color:#fff;border-radius:16px;padding:7px 10px;font-weight:800}.invite{background:#fff;color:#000}.chat{position:absolute;left:12px;right:12px;bottom:82px;height:35%;overflow:auto;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;z-index:5}.msg{background:#0008;border-radius:12px;padding:7px 10px;width:max-content;max-width:90%}.msg b{font-size:12px}.msg span{color:#ddd;margin-left:5px}.composer{position:absolute;left:12px;right:12px;bottom:14px;display:flex;gap:7px;z-index:6}.composer input{flex:1;background:#111c;border:1px solid #555;color:#fff;border-radius:22px;padding:11px 14px;outline:0}.composer button{border:0;border-radius:22px;background:#fff;color:#000;font-weight:900;padding:0 15px}.reacts{position:absolute;right:14px;bottom:150px;display:flex;flex-direction:column;gap:9px;z-index:6}.reacts button{border:0;background:#0008;border-radius:50%;width:44px;height:44px;font-size:21px}.float{position:absolute;right:72px;bottom:100px;animation:up 1.2s ease-out forwards;font-size:25px;pointer-events:none;z-index:8}@keyframes up{from{opacity:1;transform:translateY(0) scale(.7)}to{opacity:0;transform:translateY(-150px) scale(1.5)}}.empty{color:#777;text-align:center;padding:30px}.guest-panel{display:none;position:absolute;z-index:10;top:58px;right:12px;width:270px;background:#111;border:1px solid #333;border-radius:15px;padding:12px;box-shadow:0 15px 40px #000}.guest-panel.show{display:block}.guest-panel h4{margin:2px 0 10px}.guest-panel input{width:100%;background:#191919;border:1px solid #444;color:#fff;border-radius:10px;padding:10px}.guest-row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #292929;font-size:12px}.guest-row button{border:0;border-radius:8px;padding:6px 8px;font-weight:800}.status{color:#aaa}.remove-btn{background:#2b2b2b;color:#fff}.guest-toast{position:absolute;z-index:20;left:15px;right:15px;top:75px;background:#171717;border:1px solid #444;border-radius:14px;padding:12px;display:none;box-shadow:0 12px 35px #000}.guest-toast.show{display:block}.guest-toast button{border:0;border-radius:9px;padding:8px 11px;font-weight:800;margin:8px 6px 0 0}.stats{position:absolute;left:14px;top:58px;z-index:6;background:#0009;border-radius:12px;padding:7px 10px;color:#ddd;font-size:11px;display:none}</style><script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.min.js"></script></head><body><main class="wrap"><header class="top"><button class="back" onclick="leaveRoom()">‹</button><b>REelo LIVE</b><button class="ghost" onclick="showCreate()">Go Live</button></header><section id="home" class="body"><div id="create" style="display:none"><input id="title" class="title" maxlength="120" placeholder="What are you going live about?"><button class="primary" onclick="startLive()">🔴 Start LIVE</button></div><section class="rooms"><h3>Live now</h3><div id="rooms">Loading…</div></section></section><section id="stage" class="stage"><video id="camera" class="camera" autoplay muted playsinline style="display:none"></video><div id="sfuGrid" class="sfu-grid"></div><div class="overlay"></div><div class="livebar"><span class="badge">LIVE</span><span id="viewers" class="viewers">0 viewers</span><button id="guestBtn" class="invite" style="display:none" onclick="toggleGuests()">Invite</button><button id="endBtn" class="close" style="display:none" onclick="endLive()">End</button></div><div id="stats" class="stats"></div><div id="guestPanel" class="guest-panel"><h4>Guests</h4><input id="guestUser" placeholder="Enter user ID"><button class="primary" onclick="inviteGuest()">Invite guest</button><div id="guestList"></div></div><div id="guestToast" class="guest-toast"><b>LIVE guest invitation</b><div>You have been invited to join this LIVE.</div><button onclick="acceptGuest()">Join as guest</button><button onclick="declineGuest()">Decline</button></div><div id="chat" class="chat"></div><div class="reacts"><button onclick="react('❤️')">❤️</button><button onclick="react('🔥')">🔥</button><button onclick="react('👏')">👏</button><button onclick="react('😂')">😂</button></div><div class="composer"><input id="message" maxlength="300" placeholder="Say something…"><button onclick="sendMessage()">Send</button></div></section><script>const API=window.REELO_API||'http://localhost:8000',token=localStorage.getItem('reelo_token')||'';const $=id=>document.getElementById(id);const headers=()=>token?{Authorization:'Bearer '+token}:{};let room=null,poll=null,presencePoll=null,isHost=false,lkRoom=null,guestPoll=null,currentInvite=null;function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}async function loadRooms(){try{const r=await fetch(API+'/api/live');const d=await r.json();$('rooms').innerHTML=(d.items||[]).length?d.items.map(x=>`<div class="room"><i class="live-dot"></i><div class="meta"><b>@${esc(x.username||'creator')}</b><small>${esc(x.title)} · ${Number(x.viewer_count||0)} viewers</small></div><button class="join" onclick="join('${esc(x.id)}')">Join</button></div>`).join(''):'<div class="empty">No one is live right now.</div>'}catch(e){$('rooms').innerHTML='<div class="empty">LIVE is temporarily unavailable.</div>'}}function showCreate(){if(!token){location.href='index.html?login=1';return}$('create').style.display=$('create').style.display==='none'?'block':'none'}async function startLive(){if(!token)return location.href='index.html?login=1';const title=$('title').value.trim()||'Live on REelo';const r=await fetch(API+'/api/live',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({title})});const d=await r.json();if(!r.ok)return alert(d.detail||'Unable to start LIVE');await openRoom(d.id,true)}async function getToken(id,role){const r=await fetch(API+'/api/livekit/token',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({room:id,role})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Live service unavailable');return d}async function connectSFU(id,role){if(!window.LivekitClient)throw Error('Live video client unavailable');const d=await getToken(id,role);lkRoom=new LivekitClient.Room({adaptiveStream:true,dynacast:true});lkRoom.on(LivekitClient.RoomEvent.TrackSubscribed,(track,pub,p)=>attachTrack(track,p));lkRoom.on(LivekitClient.RoomEvent.TrackUnsubscribed,(track)=>track.detach().forEach(x=>x.remove()));lkRoom.on(LivekitClient.RoomEvent.ParticipantDisconnected,(p)=>removeTile(p.identity));lkRoom.on(LivekitClient.RoomEvent.Disconnected,()=>{lkRoom=null});await lkRoom.connect(d.url,d.token);if(role==='host'||role==='guest'){await lkRoom.localParticipant.setCameraEnabled(true);await lkRoom.localParticipant.setMicrophoneEnabled(true)}for(const p of lkRoom.remoteParticipants.values()){for(const pub of p.trackPublications.values())if(pub.isSubscribed&&pub.track)attachTrack(pub.track,p)}}function attachTrack(track,p){if(track.kind!=='video')return;let tile=document.getElementById('tile-'+CSS.escape(p.identity));if(!tile){tile=document.createElement('div');tile.className='tile';tile.id='tile-'+p.identity;tile.innerHTML='<span>@'+esc(p.identity)+'</span>';$('sfuGrid').appendChild(tile)}tile.querySelectorAll('video').forEach(v=>v.remove());const el=track.attach();el.autoplay=true;el.playsInline=true;tile.prepend(el)}function removeTile(id){const x=document.getElementById('tile-'+CSS.escape(id));if(x)x.remove()}async function heartbeat(){if(!room||isHost)return;try{const r=await fetch(API+'/api/live/v2/'+room+'/presence',{method:'POST',headers:headers()});if(r.ok){const d=await r.json();$('viewers').textContent=Number(d.viewer_count||0)+' viewers'}}catch(e){}}async function refresh(){if(!room)return;try{const r=await fetch(API+'/api/live/'+room);if(!r.ok){leaveRoom();return}const d=await r.json();$('viewers').textContent=Number(d.room?.viewer_count||0)+' viewers';$('chat').innerHTML=(d.messages||[]).map(m=>`<div class="msg"><b>@${esc(m.username||'user')}</b><span>${esc(m.message)}</span></div>`).join('');$('chat').scrollTop=$('chat').scrollHeight;const s=await fetch(API+'/api/live/v2/'+room+'/stats',{headers:headers()});if(s.ok){const x=await s.json();$('stats').style.display=isHost?'block':'none';$('stats').textContent=`${x.active_viewers||0} active · ${x.messages||0} messages · ${x.reactions||0} reactions · ${x.accepted_guests||0} guests`}}catch(e){}}async function openRoom(id,host){room=id;isHost=host;$('home').style.display='none';$('stage').classList.add('show');$('endBtn').style.display=host?'block':'none';$('guestBtn').style.display=host?'block':'none';try{if(!host){const jr=await fetch(API+'/api/live/'+id+'/join',{method:'POST',headers:headers()});if(!jr.ok)throw Error('Unable to join LIVE');await heartbeat();presencePoll=setInterval(heartbeat,15000)}await connectSFU(id,host?'host':'viewer');await refresh();poll=setInterval(refresh,1800);if(host){guestPoll=setInterval(loadGuests,2500);loadGuests()}else{guestPoll=setInterval(checkInvite,3000);checkInvite()}}catch(e){alert(e.message);leaveRoom(false)}}async function join(id){if(!token)return location.href='index.html?login=1';await openRoom(id,false)}async function sendMessage(){if(!room)return;const i=$('message'),text=i.value.trim();if(!text)return;const r=await fetch(API+'/api/live/'+room+'/messages',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({message:text})});if(r.ok){i.value='';refresh()}}async function react(x){if(!room)return;const f=document.createElement('div');f.className='float';f.textContent=x;document.body.appendChild(f);setTimeout(()=>f.remove(),1200);fetch(API+'/api/live/'+room+'/reactions',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({reaction:x})})}function toggleGuests(){$('guestPanel').classList.toggle('show');loadGuests()}async function inviteGuest(){const id=$('guestUser').value.trim();if(!id||!room)return;const r=await fetch(API+'/api/live/'+room+'/guests/invite',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({user_id:id})});const d=await r.json();if(!r.ok)return alert(d.detail||'Invite failed');$('guestUser').value='';loadGuests()}async function loadGuests(){if(!room||!isHost)return;const r=await fetch(API+'/api/live/'+room+'/guests',{headers:headers()});if(!r.ok)return;const d=await r.json();$('guestList').innerHTML=(d.items||[]).map(g=>`<div class="guest-row"><span>${esc(g.guest_id)} <em class="status">${esc(g.status)}</em></span>${['invited','accepted'].includes(g.status)?`<button class="remove-btn" onclick="removeGuest('${esc(g.guest_id)}')">Remove</button>`:''}</div>`).join('')}async function removeGuest(id){if(!room)return;await fetch(API+'/api/live/'+room+'/guests/remove/'+encodeURIComponent(id),{method:'POST',headers:headers()});loadGuests()}async function checkInvite(){if(!room||isHost)return;const r=await fetch(API+'/api/live/'+room+'/guests',{headers:headers()});if(!r.ok)return;const d=await r.json();const g=(d.items||[]).find(x=>x.status==='invited');if(g&&(!currentInvite||currentInvite.id!==g.id)){currentInvite=g;$('guestToast').classList.add('show')}}async function acceptGuest(){if(!room)return;const r=await fetch(API+'/api/live/'+room+'/guests/accept',{method:'POST',headers:headers()});const d=await r.json();if(!r.ok)return alert(d.detail||'Invitation expired');currentInvite=null;$('guestToast').classList.remove('show');if(lkRoom)await lkRoom.disconnect();await connectSFU(room,'guest')}async function declineGuest(){if(!room)return;await fetch(API+'/api/live/'+room+'/guests/decline',{method:'POST',headers:headers()});currentInvite=null;$('guestToast').classList.remove('show')}async function endLive(){if(!room||!isHost)return;await fetch(API+'/api/live/'+room+'/end',{method:'POST',headers:headers()});leaveRoom(false);location.reload()}function leaveRoom(sendLeave=true){if(!room){location.href='live.html';return}if(sendLeave&&!isHost){fetch(API+'/api/live/v2/'+room+'/leave',{method:'POST',headers:headers(),keepalive:true});fetch(API+'/api/live/'+room+'/leave',{method:'POST',headers:headers(),keepalive:true)}clearInterval(poll);clearInterval(presencePoll);clearInterval(guestPoll);try{lkRoom?.disconnect()}catch(e){}room=null;location.href='live.html'}window.addEventListener('pagehide',()=>{if(room&&!isHost){fetch(API+'/api/live/v2/'+room+'/leave',{method:'POST',headers:headers(),keepalive:true})}try{lkRoom?.disconnect()}catch(e){}});loadRooms();</script></main></body></html>

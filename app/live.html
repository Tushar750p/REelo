<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REelo LIVE</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font:14px Inter,system-ui,sans-serif;height:100%}.wrap{max-width:520px;margin:auto;min-height:100dvh;background:#090909}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #242424}.top button{border:0;border-radius:18px;padding:9px 12px;background:#191919;color:#fff}.body{padding:18px}.title,input{width:100%;background:#161616;border:1px solid #333;border-radius:12px;color:#fff;padding:12px;outline:0}.primary{width:100%;border:0;background:#fff;color:#000;border-radius:12px;padding:13px;font-weight:900;margin-top:10px}.rooms{margin-top:20px}.room{padding:14px 0;border-bottom:1px solid #242424;display:flex;align-items:center;gap:10px}.meta{flex:1}.meta b{display:block}.meta small{color:#999}.join{border:0;background:#fff;color:#000;border-radius:9px;padding:8px 12px;font-weight:800}.dot{width:9px;height:9px;background:#f33;border-radius:50%}.stage{display:none;height:calc(100dvh - 62px);position:relative}.stage.show{display:block}.grid{position:absolute;inset:8px 8px 95px;display:grid;grid-template-columns:repeat(2,1fr);gap:7px;z-index:2}.tile{min-height:120px;border-radius:14px;overflow:hidden;background:#171717;position:relative}.tile video{width:100%;height:100%;object-fit:cover}.tile span{position:absolute;left:7px;bottom:6px;background:#000b;padding:4px 7px;border-radius:10px;font-size:11px}.bar{position:absolute;top:14px;left:14px;right:14px;z-index:5;display:flex;gap:8px;align-items:center}.live{background:#e33;padding:6px 9px;border-radius:8px;font-weight:900}.viewers{margin-left:auto;background:#0009;padding:7px 10px;border-radius:15px}.bar button{border:0;border-radius:15px;padding:7px 10px}.end{background:#0009;color:#fff}.invite{background:#fff}.chat{position:absolute;left:12px;right:12px;bottom:72px;height:35%;overflow:auto;z-index:5;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}.msg{background:#0009;border-radius:12px;padding:7px 10px;width:max-content;max-width:90%}.msg span{color:#ddd;margin-left:5px}.composer{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:7px;z-index:6}.composer input{flex:1}.composer button{border:0;border-radius:20px;background:#fff;color:#000;padding:0 15px;font-weight:800}.reacts{position:absolute;right:12px;bottom:125px;z-index:6;display:flex;flex-direction:column;gap:8px}.reacts button{border:0;background:#0009;border-radius:50%;width:42px;height:42px;font-size:19px}.empty{text-align:center;color:#777;padding:30px}.panel{display:none;position:absolute;z-index:10;top:58px;right:12px;width:270px;background:#111;border:1px solid #333;border-radius:15px;padding:12px}.panel.show{display:block}.guest{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #292929;font-size:12px}.toast{display:none;position:absolute;z-index:20;left:15px;right:15px;top:75px;background:#171717;border:1px solid #444;border-radius:14px;padding:12px}.toast.show{display:block}.toast button{border:0;border-radius:9px;padding:8px;margin-top:8px;font-weight:800}</style><script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.min.js"></script></head><body><main class="wrap"><header class="top"><button onclick="leaveRoom()">‹</button><b>REelo LIVE</b><button onclick="toggleCreate()">Go Live</button></header><section id="home" class="body"><div id="create" style="display:none"><input id="title" maxlength="120" placeholder="What are you going live about?"><button class="primary" onclick="startLive()">🔴 Start LIVE</button></div><section class="rooms"><h3>Live now</h3><div id="rooms">Loading…</div></section></section><section id="stage" class="stage"><div id="grid" class="grid"></div><div class="bar"><span class="live">LIVE</span><span id="viewers" class="viewers">0 viewers</span><button id="guestBtn" class="invite" style="display:none" onclick="toggleGuests()">Invite</button><button id="endBtn" class="end" style="display:none" onclick="endLive()">End</button></div><div id="guestPanel" class="panel"><b>Invite guest</b><input id="guestUser" placeholder="User ID" style="margin-top:8px"><button class="primary" onclick="inviteGuest()">Invite</button><div id="guestList"></div></div><div id="guestToast" class="toast"><b>LIVE guest invitation</b><div>You have been invited.</div><button onclick="acceptGuest()">Join</button><button onclick="declineGuest()">Decline</button></div><div id="chat" class="chat"></div><div class="reacts"><button onclick="react('❤️')">❤️</button><button onclick="react('🔥')">🔥</button><button onclick="react('👏')">👏</button></div><div class="composer"><input id="message" maxlength="300" placeholder="Say something…"><button onclick="sendMessage()">Send</button></div></section></main><script>const API=window.REELO_API||location.origin;const token=()=>localStorage.getItem('reelo_token')||'';const auth=()=>token()?{Authorization:'Bearer '+token()}:{};const el=id=>document.getElementById(id);let room=null,isHost=false,lk=null,poll=null,presence=null,guestPoll=null,currentInvite=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function loadRooms(){try{const r=await fetch(API+'/api/live');const d=await r.json();el('rooms').innerHTML=(d.items||[]).length?d.items.map(x=>'<div class="room"><i class="dot"></i><div class="meta"><b>@'+esc(x.username||'creator')+'</b><small>'+esc(x.title||'Live')+' · '+Number(x.viewer_count||0)+' viewers</small></div><button class="join" onclick="join(\''+esc(x.id)+'\')">Join</button></div>').join(''):'<div class="empty">No one is live right now.</div>'}catch(e){el('rooms').innerHTML='<div class="empty">LIVE is temporarily unavailable.</div>'}}function toggleCreate(){if(!token()){location.href='index.html?login=1';return}el('create').style.display=el('create').style.display==='none'?'block':'none'}async function startLive(){const title=el('title').value.trim()||'Live on REelo';const r=await fetch(API+'/api/live',{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({title})});const d=await r.json();if(!r.ok){alert(d.detail||'Unable to start LIVE');return}openRoom(d.id,true)}async function join(id){if(!token()){location.href='index.html?login=1';return}openRoom(id,false)}async function getToken(id,role){const r=await fetch(API+'/api/livekit/token',{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({room:id,role})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Live service unavailable');return d}async function connectSFU(id,role){if(!window.LivekitClient)throw Error('Live video client unavailable');const d=await getToken(id,role);lk=new LivekitClient.Room({adaptiveStream:true,dynacast:true});lk.on(LivekitClient.RoomEvent.TrackSubscribed,(track,p)=>attach(track,p));lk.on(LivekitClient.RoomEvent.TrackUnsubscribed,track=>track.detach().forEach(v=>v.remove()));lk.on(LivekitClient.RoomEvent.ParticipantDisconnected,p=>removeTile(p.identity));await lk.connect(d.url,d.token);if(role==='host'||role==='guest'){await lk.localParticipant.setCameraEnabled(true);await lk.localParticipant.setMicrophoneEnabled(true)}}function attach(track,p){if(track.kind!=='video')return;let t=document.getElementById('tile-'+CSS.escape(p.identity));if(!t){t=document.createElement('div');t.className='tile';t.id='tile-'+p.identity;t.innerHTML='<span>@'+esc(p.identity)+'</span>';el('grid').appendChild(t)}t.querySelectorAll('video').forEach(v=>v.remove());const v=track.attach();v.autoplay=true;v.playsInline=true;t.prepend(v)}function removeTile(id){const t=document.getElementById('tile-'+CSS.escape(id));if(t)t.remove()}async function openRoom(id,host){room=id;isHost=host;el('home').style.display='none';el('stage').classList.add('show');el('endBtn').style.display=host?'block':'none';el('guestBtn').style.display=host?'block':'none';try{if(!host){const r=await fetch(API+'/api/live/'+id+'/join',{method:'POST',headers:auth()});if(!r.ok)throw Error('Unable to join LIVE');presence=setInterval(heartbeat,15000)}await connectSFU(id,host?'host':'viewer');refresh();poll=setInterval(refresh,1800);guestPoll=setInterval(host?loadGuests:checkInvite,3000)}catch(e){alert(e.message);leaveRoom(false)}}async function heartbeat(){if(!room||isHost)return;const r=await fetch(API+'/api/live/v2/'+room+'/presence',{method:'POST',headers:auth()});if(r.ok){const d=await r.json();el('viewers').textContent=Number(d.viewer_count||0)+' viewers'}}async function refresh(){if(!room)return;try{const r=await fetch(API+'/api/live/'+room);if(!r.ok){leaveRoom();return}const d=await r.json();el('viewers').textContent=Number(d.room?.viewer_count||0)+' viewers';el('chat').innerHTML=(d.messages||[]).map(m=>'<div class="msg"><b>@'+esc(m.username||'user')+'</b><span>'+esc(m.message)+'</span></div>').join('');el('chat').scrollTop=el('chat').scrollHeight}catch(e){}}async function sendMessage(){const text=el('message').value.trim();if(!room||!text)return;const r=await fetch(API+'/api/live/'+room+'/messages',{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({message:text})});if(r.ok){el('message').value='';refresh()}}function react(x){if(!room)return;fetch(API+'/api/live/'+room+'/reactions',{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({reaction:x})})}function toggleGuests(){el('guestPanel').classList.toggle('show');loadGuests()}async function inviteGuest(){const id=el('guestUser').value.trim();if(!room||!id)return;const r=await fetch(API+'/api/live/'+room+'/guests/invite',{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({user_id:id})});if(r.ok){el('guestUser').value='';loadGuests()}}async function loadGuests(){if(!room||!isHost)return;const r=await fetch(API+'/api/live/'+room+'/guests',{headers:auth()});if(!r.ok)return;const d=await r.json();el('guestList').innerHTML=(d.items||[]).map(g=>'<div class="guest">'+esc(g.guest_id)+' <span>'+esc(g.status)+'</span></div>').join('')}async function checkInvite(){if(!room||isHost)return;const r=await fetch(API+'/api/live/'+room+'/guests',{headers:auth()});if(!r.ok)return;const d=await r.json();const g=(d.items||[]).find(x=>x.status==='invited');if(g&&(!currentInvite||currentInvite.id!==g.id)){currentInvite=g;el('guestToast').classList.add('show')}}async function acceptGuest(){if(!room)return;const r=await fetch(API+'/api/live/'+room+'/guests/accept',{method:'POST',headers:auth()});if(!r.ok)return;currentInvite=null;el('guestToast').classList.remove('show');if(lk)await lk.disconnect();await connectSFU(room,'guest')}async function declineGuest(){if(!room)return;await fetch(API+'/api/live/'+room+'/guests/decline',{method:'POST',headers:auth()});currentInvite=null;el('guestToast').classList.remove('show')}async function endLive(){if(!room||!isHost)return;await fetch(API+'/api/live/'+room+'/end',{method:'POST',headers:auth()});leaveRoom(false);location.reload()}function leaveRoom(send=true){if(send&&!isHost&&room){fetch(API+'/api/live/v2/'+room+'/leave',{method:'POST',headers:auth(),keepalive:true});fetch(API+'/api/live/'+room+'/leave',{method:'POST',headers:auth(),keepalive:true})}clearInterval(poll);clearInterval(presence);clearInterval(guestPoll);try{lk?.disconnect()}catch(e){}room=null;if(el('stage')){el('stage').classList.remove('show');el('home').style.display='block'}}loadRooms();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>REelo Search</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font:15px Inter,system-ui,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:#090909}.head{position:sticky;top:0;background:#090909ee;backdrop-filter:blur(14px);padding:14px 16px;border-bottom:1px solid #222;z-index:3}.top{display:flex;align-items:center;gap:12px}.back{border:0;background:none;color:#fff;font-size:30px}.search{flex:1;background:#1a1a1a;border:1px solid #333;color:#fff;border-radius:12px;padding:12px 14px;outline:none}.search:focus{border-color:#777}.tabs{display:flex;gap:8px;margin-top:12px;overflow:auto}.tabs button{border:1px solid #333;background:#171717;color:#aaa;border-radius:20px;padding:8px 14px;white-space:nowrap}.tabs button.active{background:#fff;color:#000;border-color:#fff}.content{padding:8px 16px 30px}.section-title{font-size:12px;color:#777;text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px}.user{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #222}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#fff,#555);color:#000;display:grid;place-items:center;font-weight:900}.name{font-weight:800}.handle{font-size:12px;color:#888}.video{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #222}.thumb{width:86px;height:112px;border-radius:9px;background:#191919;object-fit:cover;flex:none}.meta{min-width:0}.caption{line-height:1.4;word-break:break-word}.stats{color:#777;font-size:12px;margin-top:8px}.empty{text-align:center;color:#777;padding:70px 20px}.loading{color:#777;text-align:center;padding:35px}.tag{display:inline-block;margin:4px 5px 4px 0;padding:7px 10px;border:1px solid #333;border-radius:18px;color:#ddd;background:#151515}.rank{font-size:11px;color:#666;margin-top:4px}</style></head><body><main class="app"><header class="head"><div class="top"><button class="back" onclick="history.back()">‹</button><input id="q" class="search" placeholder="Search creators, videos, hashtags…" autocomplete="off"></div><div class="tabs"><button class="active" data-filter="all">Top</button><button data-filter="creators">Creators</button><button data-filter="videos">Videos</button><button data-filter="hashtags">Hashtags</button></div></header><section id="content" class="content"><div class="empty">Search REelo</div></section></main><script>const API=window.REELO_API||'http://localhost:8000';const q=document.getElementById('q'),content=document.getElementById('content');let filter='all',timer;const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>{n=Number(n||0);return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n)};const videoUrl=v=>v.filename?.startsWith('http')?v.filename:API+(v.filename?.startsWith('/')?'':'/')+v.filename;function score(v,query){const q=query.toLowerCase().replace(/^#/,'').trim(),u=String(v.username||'').toLowerCase(),d=String(v.display_name||'').toLowerCase(),c=String(v.caption||'').toLowerCase();let s=0;if(u===q)s+=120;else if(u.startsWith(q))s+=90;else if(u.includes(q))s+=55;if(d===q)s+=100;else if(d.startsWith(q))s+=65;else if(d.includes(q))s+=35;const words=q.split(/\s+/).filter(Boolean);words.forEach(w=>{if(c.includes(w))s+=24;if(c.includes('#'+w))s+=35});if(c.includes(q))s+=45;s+=Math.min(20,Math.log10(Number(v.likes||0)+1)*4);s+=Math.min(15,Math.log10(Number(v.views||0)+1)*3);const age=Math.max(0,(Date.now()-Date.parse(String(v.created_at||'').replace(' ','T')+'Z'))/86400000);if(Number.isFinite(age))s+=Math.max(0,12-age*.25);return s}function extractTags(items){const m=new Map();items.forEach(v=>(String(v.caption||'').match(/#[\p{L}\p{N}_]+/gu)||[]).forEach(t=>{const k=t.toLowerCase();m.set(k,(m.get(k)||0)+1)}));return [...m.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0])}function setFilter(x){filter=x;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.filter===x));run(q.value)}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setFilter(b.dataset.filter));q.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>run(q.value),220)});async function run(query){query=query.trim();if(!query){content.innerHTML='<div class="empty">Search creators, videos, hashtags…</div>';return}content.innerHTML='<div class="loading">Searching…</div>';try{const r=await fetch(API+'/api/search?q='+encodeURIComponent(query));if(!r.ok)throw Error();const d=await r.json();const items=(d.items||[]).map(v=>({...v,_score:score(v,query)})).sort((a,b)=>b._score-a._score);const creators=[];const seen=new Set();items.forEach(v=>{if(!seen.has(v.user_id)){seen.add(v.user_id);creators.push(v)}});const wanted=query.replace(/^#/,'').toLowerCase();const tags=extractTags(items).filter(t=>t.includes('#'+wanted));const videos=items.filter(v=>filter!=='hashtags'||String(v.caption||'').toLowerCase().includes('#'+wanted));const creatorHtml=creators.length?'<div class="section-title">Creators</div>'+creators.slice(0,10).map(v=>'<div class="user"><div class="avatar">'+esc((v.username||'u')[0]).toUpperCase()+'</div><div><div class="name">'+esc(v.display_name||v.username)+'</div><div class="handle">@'+esc(v.username)+'</div><div class="rank">Top match</div></div></div>').join(''):'';const videoHtml=videos.length?'<div class="section-title">Videos</div>'+videos.slice(0,30).map(v=>'<article class="video"><video class="thumb" src="'+esc(videoUrl(v))+'" muted playsinline preload="metadata"></video><div class="meta"><div class="name">@'+esc(v.username)+'</div><div class="caption">'+esc(v.caption||'No caption')+'</div><div class="stats">'+fmt(v.likes)+' likes · '+fmt(v.comments)+' comments · '+fmt(v.views)+' views</div></div></article>').join(''):'';const tagHtml=tags.length?'<div class="section-title">Hashtags</div>'+tags.slice(0,20).map(t=>'<span class="tag">'+esc(t)+'</span>').join(''):'';if(filter==='creators')content.innerHTML=creatorHtml||'<div class="empty">No creators found.</div>';else if(filter==='videos')content.innerHTML=videoHtml||'<div class="empty">No videos found.</div>';else if(filter==='hashtags')content.innerHTML=tagHtml||'<div class="empty">No hashtags found.</div>';else content.innerHTML=creatorHtml+tagHtml+videoHtml||'<div class="empty">No results found.</div>'}catch(e){content.innerHTML='<div class="empty">Search is temporarily unavailable.</div>'}}q.focus();</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trust & Safety · REelo Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#111;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:1280px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.brand{display:flex;gap:12px;align-items:center}.mark{width:44px;height:44px;border-radius:14px;background:#111;color:#fff;display:grid;place-items:center;font-weight:800}.top h1{margin:0;font-size:27px}.sub{margin:4px 0 0;color:#777;font-size:13px}.back,button{font:inherit;border:0;border-radius:11px;padding:10px 13px;cursor:pointer}.back,.tab,.ghost{background:#fff;border:1px solid #e2e3e7}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab.active{background:#111;color:#fff;border-color:#111}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid #e6e7eb;border-radius:16px;padding:16px}.stat b{font-size:25px}.stat span{display:block;color:#777;font-size:12px;margin-top:3px}.panel{background:#fff;border:1px solid #e6e7eb;border-radius:18px;overflow:hidden;box-shadow:0 5px 20px #00000008}.row{display:grid;grid-template-columns:1.1fr .55fr .65fr 1.2fr .8fr 1.1fr;gap:12px;padding:15px 18px;border-bottom:1px solid #eee;align-items:center}.head{background:#fafafa;color:#666;font-size:11px;font-weight:750;text-transform:uppercase}.row:last-child{border-bottom:0}.name{font-weight:750}.muted{font-size:11px;color:#777;margin-top:4px}.badge{display:inline-flex;padding:6px 9px;border-radius:99px;font-size:10px;font-weight:750;text-transform:capitalize}.open,.pending{background:#fff4d2;color:#8a5a00}.resolved,.approved,.active{background:#e8f8ee;color:#14743c}.dismissed,.removed,.rejected{background:#eee;color:#666}.critical,.high{background:#ffe8e8;color:#a72b2b}.medium{background:#fff0d8;color:#8a5a00}.low,.warning{background:#eaf2ff;color:#2459a6}.actions{display:flex;gap:6px;flex-wrap:wrap}.primary{background:#111;color:#fff}.danger{background:#ffeaea;color:#a72b2b}.empty,.error{padding:28px}.error{color:#a72b2b;background:#fff1f1}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:10;align-items:center;justify-content:center;padding:20px}.card{width:min(560px,100%);background:#fff;border-radius:20px;padding:23px;box-shadow:0 20px 70px #0004}.card h2{margin:0}.field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px;font:inherit}.field textarea{min-height:100px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.history{max-height:55vh;overflow:auto;display:grid;gap:8px;margin-top:12px}.item{background:#f7f7f8;padding:11px;border-radius:11px;font-size:12px}@media(max-width:950px){.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1.2fr .7fr 1fr 1fr}.row div:nth-child(2),.row div:nth-child(5){display:none}.head div:nth-child(2),.head div:nth-child(5){display:none}}@media(max-width:620px){.wrap{padding:15px}.top h1{font-size:21px}.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr .9fr}.row div:nth-child(3),.row div:nth-child(4){display:none}.head div:nth-child(3),.head div:nth-child(4){display:none}}</style></head><body><main class="wrap"><header class="top"><div class="brand"><div class="mark">R</div><div><h1>Trust & Safety</h1><p class="sub">Reports, strikes and appeals in one review center</p></div></div><button class="back" onclick="location.href='index.html'">← Back</button></header><div class="stats"><div class="stat"><b id="openCount">—</b><span>Open reports</span></div><div class="stat"><b id="strikeCount">—</b><span>Active strikes</span></div><div class="stat"><b id="appealCount">—</b><span>Pending appeals</span></div><div class="stat"><b id="totalCount">—</b><span>Total reports</span></div></div><nav class="tabs"><button class="tab active" data-view="reports">Reports</button><button class="tab" data-view="strikes">Strikes</button><button class="tab" data-view="appeals">Appeals</button><button class="tab" data-view="audit">Audit log</button></nav><section class="panel"><div class="row head" id="head"></div><div id="list">Loading…</div></section></main><div class="modal" id="strikeModal"><div class="card"><h2>Issue creator strike</h2><div class="field"><label>User ID</label><input id="sUser"></div><div class="field"><label>Severity</label><select id="sSeverity"><option>warning</option><option>low</option><option>medium</option><option>high</option><option>critical</option></select></div><div class="field"><label>Reason</label><textarea id="sReason" maxlength="500"></textarea></div><div class="field"><label>Report ID (optional)</label><input id="sReport"></div><div class="modal-actions"><button class="ghost" onclick="closeStrike()">Cancel</button><button class="primary" onclick="issueStrike()">Issue strike</button></div></div></div><div class="modal" id="appealModal"><div class="card"><h2>Appeal decision</h2><div class="field"><label>Decision</label><select id="aStatus"><option value="approved">Approve appeal</option><option value="rejected">Reject appeal</option></select></div><div class="field"><label>Reason</label><textarea id="aReason" maxlength="1000"></textarea></div><div class="modal-actions"><button class="ghost" onclick="closeAppeal()">Cancel</button><button class="primary" onclick="decideAppeal()">Save decision</button></div></div></div><script>const API=window.REELO_API||'http://localhost:8000',token=localStorage.getItem('reelo_token'),H=token?{Authorization:'Bearer '+token}:{};let view='reports',appealId='';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const badge=v=>`<span class="badge ${esc(String(v||''))}">${esc(String(v||'').replace(/_/g,' '))}</span>`;async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{...H,...(o.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='index.html';throw Error('Login required')}if(!r.ok)throw Error(d.detail||'Request failed');return d}async function overview(){const d=await api('/api/trust-safety/admin/overview');document.getElementById('openCount').textContent=d.reports.open;document.getElementById('strikeCount').textContent=Object.values(d.strikes).reduce((a,b)=>a+b,0);document.getElementById('appealCount').textContent=d.appeals.pending||0;document.getElementById('totalCount').textContent=d.reports.total}function heads(){const h=document.getElementById('head');h.innerHTML=view==='reports'?'<div>Report</div><div>Target</div><div>Reason</div><div>Status</div><div>Created</div><div>Actions</div>':view==='strikes'?'<div>User</div><div>Severity</div><div>Target</div><div>Reason</div><div>Status</div><div>Actions</div>':view==='appeals'?'<div>User</div><div>Strike</div><div>Reason</div><div>Status</div><div>Created</div><div>Actions</div>':'<div>Action</div><div>Target</div><div>Admin</div><div>Details</div><div>Created</div><div>—</div>'}async function load(){heads();try{let d;if(view==='reports')d=await api('/api/trust-safety/admin/reports?status=all');else if(view==='strikes')d=await api('/api/trust-safety/admin/strikes?status=all');else if(view==='appeals')d=await api('/api/trust-safety/admin/appeals?status=all');else d=await api('/api/trust-safety/admin/audit');let html='';if(view==='reports')html=d.items.map(x=>`<div class="row"><div><b>${esc(x.id.slice(0,12))}</b><div class="muted">Reporter: ${esc(x.reporter_id)}</div></div><div>${esc(x.target_type)}<div class="muted">${esc(x.target_id)}</div></div><div>${esc(x.reason)}<div class="muted">${esc(x.details||'')}</div></div><div>${badge(x.status)}<div class="muted">Strikes: ${x.strike_count||0}</div></div><div class="muted">${esc(x.created_at)}</div><div class="actions">${x.status==='open'?`<button class="ghost" onclick="closeReport('${esc(x.id)}','resolved')">Resolve</button><button class="ghost" onclick="closeReport('${esc(x.id)}','dismissed')">Dismiss</button>`:''}<button class="danger" onclick="openStrike('${esc(x.reporter_id)}','${esc(x.id)}')">Strike user</button></div></div>`).join('');else if(view==='strikes')html=d.items.map(x=>`<div class="row"><div><b>${esc(x.user_id)}</b><div class="muted">${esc(x.id.slice(0,12))}</div></div><div>${badge(x.severity)}</div><div>${esc(x.target_type||'—')}<div class="muted">${esc(x.target_id||'—')}</div></div><div>${esc(x.reason)}</div><div>${badge(x.status)}</div><div class="actions">${x.status==='active'?`<button class="ghost" onclick="strikeStatus('${esc(x.id)}','removed')">Remove strike</button>`:''}</div></div>`).join('');else if(view==='appeals')html=d.items.map(x=>`<div class="row"><div><b>${esc(x.user_id)}</b><div class="muted">${esc(x.id.slice(0,12))}</div></div><div>${esc(x.strike_id||'—')}</div><div>${esc(x.reason)}<div class="muted">Original: ${esc(x.strike_reason||'—')}</div></div><div>${badge(x.status)}</div><div class="muted">${esc(x.created_at)}</div><div class="actions">${x.status==='pending'?`<button class="primary" onclick="openAppeal('${esc(x.id)}')">Review</button>`:''}</div></div>`).join('');else html=d.items.map(x=>`<div class="row"><div><b>${esc(x.action)}</b></div><div>${esc(x.target_type)}</div><div>${esc(x.admin_id)}</div><div>${esc(x.details||'')}</div><div class="muted">${esc(x.created_at)}</div><div>—</div></div>`).join('');document.getElementById('list').innerHTML=html||'<div class="empty">No records found.</div>'}catch(e){document.getElementById('list').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function closeReport(id,status){if(!confirm(status==='resolved'?'Resolve this report?':'Dismiss this report?'))return;try{await api('/api/trust-safety/admin/reports/'+encodeURIComponent(id)+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});await refresh()}catch(e){alert(e.message)}}function openStrike(user,report){document.getElementById('sUser').value=user;document.getElementById('sReport').value=report;document.getElementById('sReason').value='';document.getElementById('strikeModal').style.display='flex'}function closeStrike(){document.getElementById('strikeModal').style.display='none'}async function issueStrike(){const user=document.getElementById('sUser').value.trim(),reason=document.getElementById('sReason').value.trim();if(!user||reason.length<3)return alert('User ID and reason are required.');try{await api('/api/trust-safety/admin/strikes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:user,severity:document.getElementById('sSeverity').value,reason,report_id:document.getElementById('sReport').value.trim()})});closeStrike();await refresh()}catch(e){alert(e.message)}}async function strikeStatus(id,status){try{await api('/api/trust-safety/admin/strikes/'+encodeURIComponent(id)+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});await refresh()}catch(e){alert(e.message)}}function openAppeal(id){appealId=id;document.getElementById('aReason').value='';document.getElementById('appealModal').style.display='flex'}function closeAppeal(){document.getElementById('appealModal').style.display='none';appealId=''}async function decideAppeal(){const reason=document.getElementById('aReason').value.trim();if(reason.length<3)return alert('Decision reason is required.');try{await api('/api/trust-safety/admin/appeals/'+encodeURIComponent(appealId)+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:document.getElementById('aStatus').value,reason})});closeAppeal();await refresh()}catch(e){alert(e.message)}}async function refresh(){await overview();await load()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;load()});if(!token)location.href='index.html';else refresh();</script></body></html>

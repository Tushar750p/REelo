<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>Activity · REelo</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font:15px Inter,system-ui,sans-serif}.app{max-width:620px;margin:auto;min-height:100vh;background:#090909}.head{position:sticky;top:0;background:#090909eF;backdrop-filter:blur(16px);padding:14px 16px;border-bottom:1px solid #222;display:flex;align-items:center;gap:12px;z-index:3}.head h1{font-size:20px;margin:0;font-weight:850}.back{border:0;background:none;color:#fff;font-size:30px;cursor:pointer}.head-actions{margin-left:auto;display:flex;gap:7px}.head-btn{border:1px solid #333;background:#171717;color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:750;cursor:pointer}.head-btn.active{background:#fff;color:#000}.filters{display:flex;gap:8px;overflow:auto;padding:12px 16px;border-bottom:1px solid #1e1e1e;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{flex:0 0 auto;border:1px solid #303030;background:#141414;color:#aaa;border-radius:999px;padding:8px 13px;font-weight:750;font-size:12px;cursor:pointer}.filter.active{background:#fff;color:#000;border-color:#fff}.list{padding:8px 16px}.item{display:flex;gap:12px;padding:15px 8px;border-bottom:1px solid #202020;cursor:pointer;border-radius:12px;position:relative}.item:hover{background:#111}.item.unread{background:#121212}.avatar{width:46px;height:46px;flex:none;border-radius:50%;background:linear-gradient(135deg,#fff,#555);color:#000;display:grid;place-items:center;font-weight:900}.verification-icon{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;font-size:20px}.body{flex:1;min-width:0}.text{line-height:1.42}.text b{font-weight:850}.time{color:#777;font-size:12px;margin-top:5px}.reason{margin-top:9px;padding:10px 12px;border-radius:10px;background:#171717;border:1px solid #2a2a2a;color:#cfcfcf;font-size:13px;line-height:1.4}.dot{width:7px;height:7px;background:#fff;border-radius:50%;margin:8px 4px 0 0;flex:none}.thumb{width:42px;height:54px;border-radius:7px;background:#222;object-fit:cover;flex:none}.empty{text-align:center;color:#777;padding:80px 20px}.login{text-align:center;padding:100px 25px}.login button{border:0;background:#fff;color:#000;padding:12px 24px;border-radius:10px;font-weight:800;cursor:pointer}.section-label{padding:14px 8px 6px;color:#777;font-size:11px;text-transform:uppercase;letter-spacing:.12em}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800;display:none;z-index:10}@media(min-width:700px){.app{border-left:1px solid #181818;border-right:1px solid #181818}}
</style></head><body><main class="app"><header class="head"><button class="back" onclick="history.back()">‹</button><h1>Activity</h1><div class="head-actions"><button id="refresh" class="head-btn">↻</button><button id="read" class="head-btn">Read all</button></div></header><nav class="filters" aria-label="Activity filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="follow">Followers</button><button class="filter" data-filter="like">Likes</button><button class="filter" data-filter="comment">Comments</button><button class="filter" data-filter="verification">Verification</button></nav><section id="list" class="list"></section></main><div id="toast" class="toast"></div><script>const API=window.REELO_API||'https://reelo-43rv.onrender.com';const token=localStorage.getItem('reelo_token')||'';const list=document.getElementById('list');let verification=null,items=[],activeFilter='all';function headers(){return token?{Authorization:'Bearer '+token}:{}}function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function ago(s){if(!s)return'';const t=Date.parse(String(s).replace(' ','T').replace(/Z?$/,'Z')),m=Math.max(0,Math.floor((Date.now()-t)/60000));return m<1?'now':m<60?m+'m':m<1440?Math.floor(m/60)+'h':Math.floor(m/1440)+'d'}function showToast(x){const t=document.getElementById('toast');t.textContent=x;t.style.display='block';clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.style.display='none',1800)}function verificationMessage(n){if(n.type==='verification_submitted')return '<b>Verification submitted</b><br><span style="color:#aaa">Your creator verification request is now in review.</span>';if(n.type==='verification_approved')return '<b>Creator verification approved ✓</b><br><span style="color:#aaa">Your account is verified and eligible features can now be unlocked.</span>';if(n.type==='verification_rejected'){const reason=verification?.latest_review?.status==='rejected'?verification.latest_review.reason:'';return '<b>Creator verification needs changes</b><br><span style="color:#aaa">Review the feedback and submit again.</span>'+(reason?'<div class="reason"><strong>Review note:</strong> '+esc(reason)+'</div>':'')}return null}function message(n){const v=verificationMessage(n);if(v)return v;const u='@'+esc(n.actor_username||'someone');if(n.type==='follow')return '<b>'+u+'</b> started following you';if(n.type==='like')return '<b>'+u+'</b> liked your video';if(n.type==='comment')return '<b>'+u+'</b> commented on your video';if(n.type==='save')return '<b>'+u+'</b> saved your video';if(n.type==='message')return '<b>'+u+'</b> sent you a message';return '<b>'+u+'</b> interacted with you'}function isVerification(n){return String(n.type||'').startsWith('verification_')}function typeMatch(n){if(activeFilter==='all')return true;if(activeFilter==='verification')return isVerification(n);return n.type===activeFilter}function render(){const filtered=items.filter(typeMatch);if(!filtered.length){list.innerHTML='<div class="empty">You’re all caught up.<br><br>New activity will appear here.</div>';return}let last='';list.innerHTML=filtered.map(n=>{const section=isVerification(n)?'Creator verification':'Social activity';const label=section!==last?'<div class="section-label">'+section+'</div>':'';last=section;const actor=n.actor_username||'u';return label+'<article class="item '+(!n.read?'unread':'')+'" data-id="'+esc(n.id)+'"><div class="avatar '+(isVerification(n)?'verification-icon':'')+'">'+(isVerification(n)?'✓':esc(actor[0].toUpperCase()))+'</div><div class="body"><div class="text">'+message(n)+'</div><div class="time">'+ago(n.created_at)+'</div></div>'+(!n.read?'<div class="dot"></div>':'')+'</article>'}).join('');list.querySelectorAll('.item').forEach(x=>x.onclick=()=>readOne(x.dataset.id))}async function load(){if(!token){list.innerHTML='<div class="login"><h2>Log in to see your activity</h2><p style="color:#777">See likes, comments, new followers and creator updates here.</p><button onclick="location.href=\'index.html?auth=login\'">Log in</button></div>';return}try{const [nr,vr]=await Promise.all([fetch(API+'/api/notifications?limit=100',{headers:headers()}),fetch(API+'/api/creator/verification',{headers:headers()})]);if(nr.status===401){list.innerHTML='<div class="login"><h2>Session expired</h2><button onclick="location.href=\'index.html?auth=login\'">Log in again</button></div>';return}const d=await nr.json();items=d.items||[];verification=vr.ok?await vr.json():null;render()}catch(e){list.innerHTML='<div class="empty">Activity is temporarily unavailable.<br><br><button class="head-btn" onclick="load()">Try again</button></div>'}}async function readOne(id){try{const r=await fetch(API+'/api/notifications/'+encodeURIComponent(id)+'/read',{method:'POST',headers:headers()});if(r.ok){const x=items.find(n=>String(n.id)===String(id));if(x)x.read=true;render()}}catch(e){}}async function markAll(){try{const r=await fetch(API+'/api/notifications/read-all',{method:'POST',headers:headers()});if(r.ok){items.forEach(n=>n.read=true);render();showToast('All activity marked read')}}catch(e){showToast('Could not update activity')}}document.getElementById('read').onclick=markAll;document.getElementById('refresh').onclick=()=>load();document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeFilter=b.dataset.filter;render()});load();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>REelo Activity</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font:15px Inter,system-ui,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:#090909}.head{position:sticky;top:0;background:#090909eF;backdrop-filter:blur(14px);padding:18px 16px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;z-index:2}.head h1{font-size:22px;margin:0}.back{border:0;background:none;color:#fff;font-size:30px}.read{border:1px solid #333;background:#171717;color:#fff;border-radius:9px;padding:8px 10px;font-size:12px}.list{padding:8px 16px}.item{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid #222}.item.unread{background:#101010;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:12px}.avatar{width:44px;height:44px;flex:none;border-radius:50%;background:linear-gradient(135deg,#fff,#555);color:#000;display:grid;place-items:center;font-weight:900}.verification-icon{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;font-size:20px}.body{flex:1}.text{line-height:1.4}.text b{font-weight:800}.time{color:#777;font-size:12px;margin-top:5px}.reason{margin-top:9px;padding:10px 12px;border-radius:10px;background:#171717;border:1px solid #2a2a2a;color:#cfcfcf;font-size:13px;line-height:1.4}.dot{width:7px;height:7px;background:#fff;border-radius:50%;margin-top:7px}.empty{text-align:center;color:#777;padding:80px 20px}.login{text-align:center;padding:100px 25px}.login button{border:0;background:#fff;color:#000;padding:12px 24px;border-radius:10px;font-weight:800}.section-label{padding:12px 0 4px;color:#777;font-size:11px;text-transform:uppercase;letter-spacing:.12em}</style></head><body><main class="app"><header class="head"><button class="back" onclick="history.back()">‹</button><h1>Activity</h1><button class="read" onclick="markAll()">Mark all read</button></header><section id="list" class="list"></section></main><script>const API=window.REELO_API||'http://localhost:8000';const token=localStorage.getItem('reelo_token')||'';const list=document.getElementById('list');let verification=null;function headers(){return token?{Authorization:'Bearer '+token}:{}}function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function ago(s){if(!s)return'';const t=Date.parse(s.replace(' ','T').replace(/Z?$/,'Z')),m=Math.max(0,Math.floor((Date.now()-t)/60000));return m<1?'now':m<60?m+'m':m<1440?Math.floor(m/60)+'h':Math.floor(m/1440)+'d'}function verificationMessage(n){if(n.type==='verification_submitted')return '<b>Verification submitted</b><br><span style="color:#aaa">Your creator verification request is now in review.</span>';if(n.type==='verification_approved')return '<b>Creator verification approved</b><br><span style="color:#aaa">Your account is verified and eligible features can now be unlocked.</span>';if(n.type==='verification_rejected'){const reason=verification?.latest_review?.status==='rejected'?verification.latest_review.reason:'';return '<b>Creator verification needs changes</b><br><span style="color:#aaa">Please review the feedback and submit again.</span>'+(reason?'<div class="reason"><strong>Review note:</strong> '+esc(reason)+'</div>':'')}return null}function message(n){const v=verificationMessage(n);if(v)return v;const u='@'+esc(n.actor_username||'someone');if(n.type==='follow')return '<b>'+u+'</b> started following you';if(n.type==='like')return '<b>'+u+'</b> liked your video';if(n.type==='comment')return '<b>'+u+'</b> commented on your video';return '<b>'+u+'</b> interacted with you'}function isVerification(n){return String(n.type||'').startsWith('verification_')}async function load(){if(!token){list.innerHTML='<div class="login"><h2>Log in to see your activity</h2><p style="color:#777">See likes, comments, verification updates and new followers here.</p><button onclick="location.href=\'index.html\'">Log in</button></div>';return}try{const [nr,vr]=await Promise.all([fetch(API+'/api/notifications?limit=50',{headers:headers()}),fetch(API+'/api/creator/verification',{headers:headers()})]);if(nr.status===401||vr.status===401){list.innerHTML='<div class="login"><h2>Session expired</h2><button onclick="location.href=\'index.html\'">Back to REelo</button></div>';return}const d=await nr.json();verification=vr.ok?await vr.json():null;if(!d.items?.length){list.innerHTML='<div class="empty">You’re all caught up.<br><br>New activity will appear here.</div>';return}let lastSection='';list.innerHTML=d.items.map(n=>{const section=isVerification(n)?'Creator verification':'Social activity';const label=section!==lastSection?'<div class="section-label">'+section+'</div>':'';lastSection=section;return label+'<article class="item '+(!n.read?'unread':'')+'" onclick="readOne(\''+esc(n.id)+'\')"><div class="avatar '+(isVerification(n)?'verification-icon':'')+'">'+(isVerification(n)?'✓':esc((n.actor_username||'u')[0]).toUpperCase())+'</div><div class="body"><div class="text">'+message(n)+'</div><div class="time">'+ago(n.created_at)+'</div></div>'+(!n.read?'<div class="dot"></div>':'')+'</article>'}).join('')}catch(e){list.innerHTML='<div class="empty">Activity is temporarily unavailable.</div>'}}async function readOne(id){try{await fetch(API+'/api/notifications/'+encodeURIComponent(id)+'/read',{method:'POST',headers:headers()});load()}catch(e){}}async function markAll(){try{await fetch(API+'/api/notifications/read-all',{method:'POST',headers:headers()});load()}catch(e){}}load();</script></body></html>

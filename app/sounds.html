<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>REelo Sounds</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:15px Inter,system-ui,sans-serif}.wrap{max-width:520px;min-height:100vh;margin:auto;background:#0b0b0b}.head{position:sticky;top:0;z-index:5;height:64px;background:#0b0b0bf2;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #242424}.back{border:0;background:none;color:#fff;font-size:28px}.head h2{margin:0;font-size:19px}.search{margin:16px;padding:13px 15px;width:calc(100% - 32px);border:1px solid #333;border-radius:14px;background:#171717;color:#fff;outline:0}.list{padding:0 16px}.sound{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid #252525}.disc{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,#eee 0 18%,#444 20% 25%,#111 27% 100%);flex:none}.meta{flex:1;min-width:0}.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{color:#888;font-size:12px;margin-top:5px}.use{border:0;background:#fff;color:#000;border-radius:10px;padding:9px 12px;font-weight:800}.empty{text-align:center;color:#777;padding:60px 10px}.detail{display:none;padding:18px}.detail.show{display:block}.hero{padding:22px;border:1px solid #292929;border-radius:20px;background:#151515;text-align:center}.hero .disc{width:100px;height:100px;margin:auto}.hero h1{margin:16px 0 5px;font-size:22px}.hero p{color:#999}.audio{width:100%;margin-top:15px}.videos{margin-top:18px}.video{padding:14px 0;border-bottom:1px solid #252525}.vtitle{font-weight:800}.vsub{font-size:12px;color:#888;margin-top:5px}</style></head><body><main class="wrap"><header class="head"><button class="back" onclick="history.back()">‹</button><h2>Sounds</h2></header><input id="search" class="search" placeholder="Search sounds or artists…" autocomplete="off"><section id="list" class="list">Loading…</section><section id="detail" class="detail"></section></main><script>const API=window.REELO_API||'http://localhost:8000',token=localStorage.getItem('reelo_token')||'';const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));let timer;async function load(){clearTimeout(timer);timer=setTimeout(async()=>{const q=$('search').value.trim();try{const r=await fetch(API+'/api/sounds?limit=50&q='+encodeURIComponent(q));const d=await r.json();render(d.items||[])}catch(e){$('list').innerHTML='<div class="empty">Sounds are temporarily unavailable.</div>'}},120)}function render(items){$('detail').classList.remove('show');$('detail').innerHTML='';$('list').style.display='block';$('list').innerHTML=items.length?items.map(s=>`<article class="sound"><div class="disc"></div><div class="meta" onclick="openSound('${esc(s.id)}')"><div class="title">${esc(s.title)}</div><div class="sub">${esc(s.artist||'Original sound')} · ${Number(s.video_count||0)} videos</div></div><button class="use" onclick="useSound('${esc(s.id)}')">Use</button></article>`).join(''):'<div class="empty">No sounds found.</div>'}async function openSound(id){const r=await fetch(API+'/api/sounds/'+encodeURIComponent(id));const d=await r.json();if(!r.ok)return alert(d.detail||'Sound not found');$('list').style.display='none';$('detail').classList.add('show');const s=d.sound||{};$('detail').innerHTML=`<div class="hero"><div class="disc"></div><h1>${esc(s.title)}</h1><p>${esc(s.artist||'Original sound')} · ${Number(s.video_count||0)} videos</p><audio class="audio" controls src="${esc(s.audio_url)}"></audio><button class="use" style="margin-top:15px" onclick="useSound('${esc(s.id)}')">Use this sound</button></div><div class="videos"><h3>Videos using this sound</h3>${(d.videos||[]).map(v=>`<div class="video"><div class="vtitle">@${esc(v.username||'creator')}</div><div class="vsub">${esc(v.caption||'Video')} · ${Number(v.views||0)} views</div></div>`).join('')||'<div class="empty">No videos yet.</div>'}</div>`}function useSound(id){location.href='index.html?useSound='+encodeURIComponent(id)}$('search').addEventListener('input',load);load();</script></body></html>

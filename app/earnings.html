<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earnings · REelo</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f8;color:#111;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:28px}.btn{border:0;background:#fff;border:1px solid #e7e7ea;border-radius:12px;padding:10px 14px;cursor:pointer}.hero{background:#111;color:#fff;border-radius:22px;padding:26px;margin-bottom:18px}.small{opacity:.65;font-size:13px}.money{font-size:42px;font-weight:800;margin-top:7px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #e8e8eb;border-radius:18px;padding:20px}.label{color:#777;font-size:13px}.value{font-size:24px;font-weight:750;margin-top:8px}.section{margin-top:24px}.section h2{font-size:18px;margin:0 0 10px}.bar{height:9px;background:#eee;border-radius:10px;overflow:hidden;margin-top:12px}.fill{height:100%;background:#111}.status{font-weight:700;margin-top:12px}.note,.muted{color:#777;font-size:13px;line-height:1.5}.form{display:grid;grid-template-columns:160px 1fr auto;gap:10px;margin-top:14px}.input,.select{border:1px solid #ddd;border-radius:11px;padding:11px;background:#fff;font:inherit}.primary{background:#111;color:#fff;border:0;border-radius:11px;padding:11px 16px;cursor:pointer}.primary:disabled{opacity:.4;cursor:not-allowed}.method{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border:1px solid #eee;border-radius:12px}.method.selected{border-color:#111;box-shadow:0 0 0 1px #111}.method-main{display:flex;align-items:center;gap:10px}.radio{width:18px;height:18px;accent-color:#111}.badge{font-size:11px;padding:5px 8px;border-radius:99px;background:#f0f0f0}.badge.pending{background:#fff7df}.badge.processing{background:#eef4ff}.badge.paid{background:#eaf8ee}.badge.failed,.badge.rejected{background:#fff0f0}.list{display:flex;flex-direction:column;gap:9px;margin-top:14px}.item{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #eee;border-radius:12px}.error{background:#fff1f1;color:#b42318;padding:14px;border-radius:12px}.success{background:#edf9f0;color:#187a35;padding:14px;border-radius:12px;margin-bottom:14px}.empty{padding:18px 0;color:#777}@media(max-width:700px){.wrap{padding:16px}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.money{font-size:34px}.item,.method{align-items:flex-start;gap:12px;flex-direction:column}}</style></head><body><main class="wrap"><header class="top"><h1>Earnings</h1><button class="btn" onclick="location.href='creator-studio.html'">← Creator Studio</button></header><div id="app">Loading…</div></main><script>const API=window.REELO_API||'http://localhost:8000';const token=localStorage.getItem('reelo_token');const headers=token?{Authorization:'Bearer '+token,'Content-Type':'application/json'}:{};let selectedMethod='';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const num=v=>Number(v||0).toLocaleString();const money=v=>'₹'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});async function req(path,opts={}){const r=await fetch(API+path,{...opts,headers:{...headers,...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='index.html';throw Error('Login required')}if(!r.ok)throw Error(d.detail||'Request failed');return d}function statusBadge(s){const x=String(s||'pending').toLowerCase();return `<span class="badge ${esc(x)}">${esc(x)}</span>`}async function load(){if(!token){location.href='index.html';return}try{const[d,m,pr]=await Promise.all([req('/api/monetization/dashboard'),req('/api/payouts/methods'),req('/api/payouts/requests')]);if(!selectedMethod&&m.items.length)selectedMethod=m.items[0].id;const fp=Math.min(100,Number(d.progress.followers||0)/Number(d.requirements.followers||1000)*100),vp=Math.min(100,Number(d.progress.views||0)/Number(d.requirements.views||10000)*100);const available=Number(d.estimated_earnings_cents||0)/100;const canRequest=Boolean(d.eligible&&m.items.length&&Number(d.estimated_earnings_cents||0)>=1000);document.getElementById('app').innerHTML=`<section class="hero"><div class="small">Estimated creator earnings</div><div class="money">${money(d.estimated_earnings)}</div></section><section class="grid"><div class="card"><div class="label">Followers</div><div class="value">${num(d.progress.followers)}</div></div><div class="card"><div class="label">Total views</div><div class="value">${num(d.progress.views)}</div></div><div class="card"><div class="label">Recorded earnings</div><div class="value">${money(d.recorded_earnings)}</div></div></section><section class="section card"><h2>Creator eligibility</h2><div class="label">Followers · ${num(d.progress.followers)} / ${num(d.requirements.followers)}</div><div class="bar"><div class="fill" style="width:${fp}%"></div></div><div class="label" style="display:block;margin-top:16px">Views · ${num(d.progress.views)} / ${num(d.requirements.views)}</div><div class="bar"><div class="fill" style="width:${vp}%"></div></div><div class="status">${d.eligible?'Eligible for monetization':'Keep growing to unlock monetization'}</div></section><section class="section card"><h2>Payout method</h2><div class="muted">Your payout identifier is masked after saving. This page does not display stored credentials.</div><form class="form" id="methodForm"><select class="select" id="kind"><option value="upi">UPI</option><option value="bank">Bank</option></select><input class="input" id="identifier" required minlength="4" maxlength="120" placeholder="UPI ID or bank payout identifier"><button class="primary">Add method</button></form><div class="list">${m.items.map(x=>`<label class="method ${selectedMethod===x.id?'selected':''}"><div class="method-main"><input class="radio" type="radio" name="method" value="${esc(x.id)}" ${selectedMethod===x.id?'checked':''} onchange="selectMethod(this.value)"><div><strong>${esc(x.method_type.toUpperCase())}</strong><div class="muted">${esc(x.identifier_masked)}</div></div></div><span class="muted">Use for payout</span></label>`).join('')||'<div class="empty">No payout method added yet.</div>'}</div></section><section class="section card"><h2>Request payout</h2><div class="label">Available estimated balance</div><div class="value">${money(available)}</div><button class="primary" id="payoutBtn" style="margin-top:14px" ${canRequest?'':'disabled'}>Request payout</button><div class="note" style="margin-top:12px">Minimum payout: ₹10.00. Submitting a request does not transfer money immediately; it creates a pending payout request for processing.</div><div id="message"></div><h3 style="margin-top:22px">Payout history</h3><div class="list">${pr.items.map(x=>`<div class="item"><div><strong>${money(Number(x.amount_cents||0)/100)}</strong><div class="muted">${esc(x.created_at||'')}</div></div>${statusBadge(x.status)}</div>`).join('')||'<div class="empty">No payout requests yet.</div>'}</div></section><section class="section card"><div class="note">${esc(d.note||'Earnings are estimates until a verified revenue and payment provider is connected.')}</div></section>`;document.getElementById('methodForm').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{const out=await req('/api/payouts/methods',{method:'POST',body:JSON.stringify({method_type:document.getElementById('kind').value,identifier:document.getElementById('identifier').value.trim()})});selectedMethod=out.id;await load()}catch(err){alert(err.message)}finally{button.disabled=false}};document.getElementById('payoutBtn').onclick=async()=>{if(!selectedMethod)return;const button=document.getElementById('payoutBtn');button.disabled=true;try{const out=await req('/api/payouts/request?method_id='+encodeURIComponent(selectedMethod),{method:'POST'});document.getElementById('message').innerHTML=`<div class="success">Payout request submitted: ${money(out.amount)}. Status: pending.</div>`;await load()}catch(err){document.getElementById('message').innerHTML='<div class="error">'+esc(err.message)+'</div>';button.disabled=false}}}catch(e){document.getElementById('app').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}function selectMethod(id){selectedMethod=id;document.querySelectorAll('.method').forEach(x=>x.classList.remove('selected'));const r=document.querySelector(`input[name="method"][value="${CSS.escape(id)}"]`);if(r)r.closest('.method').classList.add('selected');const b=document.getElementById('payoutBtn');if(b)b.disabled=false}load();</script></body></html>

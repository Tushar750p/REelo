<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earnings · REelo</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f8;color:#111;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:28px}.btn{border:0;background:#fff;border:1px solid #e7e7ea;border-radius:12px;padding:10px 14px;cursor:pointer}.hero{background:#111;color:#fff;border-radius:22px;padding:26px;margin-bottom:18px}.small{opacity:.65;font-size:13px}.money{font-size:42px;font-weight:800;margin-top:7px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #e8e8eb;border-radius:18px;padding:20px}.label{color:#777;font-size:13px}.value{font-size:24px;font-weight:750;margin-top:8px}.section{margin-top:24px}.section h2{font-size:18px}.bar{height:9px;background:#eee;border-radius:10px;overflow:hidden;margin-top:12px}.fill{height:100%;background:#111}.status{font-weight:700;margin-top:12px}.note,.muted{color:#777;font-size:13px;line-height:1.5}.form{display:grid;grid-template-columns:160px 1fr auto;gap:10px;margin-top:14px}.input,.select{border:1px solid #ddd;border-radius:11px;padding:11px;background:#fff;font:inherit}.primary{background:#111;color:#fff;border:0;border-radius:11px;padding:11px 16px;cursor:pointer}.danger{background:#fff1f1;color:#b42318;padding:12px;border-radius:12px;margin-top:12px}.list{display:flex;flex-direction:column;gap:9px;margin-top:14px}.item{display:flex;justify-content:space-between;padding:12px;border:1px solid #eee;border-radius:12px}.error{background:#fff1f1;color:#b42318;padding:14px;border-radius:12px}@media(max-width:700px){.wrap{padding:16px}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.money{font-size:34px}.item{gap:12px;flex-direction:column}}</style></head><body><main class="wrap"><header class="top"><h1>Earnings</h1><button class="btn" onclick="location.href='creator-studio.html'">← Creator Studio</button></header><div id="app">Loading…</div></main><script>const API=window.REELO_API||'http://localhost:8000';const token=localStorage.getItem('reelo_token');const headers=token?{Authorization:'Bearer '+token,'Content-Type':'application/json'}:{};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const num=v=>Number(v||0).toLocaleString();async function req(path,opts={}){const r=await fetch(API+path,{...opts,headers:{...headers,...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='index.html';throw Error('Login required')}if(!r.ok)throw Error(d.detail||'Request failed');return d}function money(v){return '₹'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}async function load(){if(!token){location.href='index.html';return}try{const[d,m,pr]=await Promise.all([req('/api/monetization/dashboard'),req('/api/payouts/methods'),req('/api/payouts/requests')]);const fp=Math.min(100,d.progress.followers/d.requirements.followers*100),vp=Math.min(100,d.progress.views/d.requirements.views*100);document.getElementById('app').innerHTML=`<section class="hero"><div class="small">Estimated creator earnings</div><div class="money">${money(d.earnings)}</div></section><section class="grid"><div class="card"><div class="label">Followers</div><div class="value">${num(d.progress.followers)}</div></div><div class="card"><div class="label">Total views</div><div class="value">${num(d.progress.views)}</div></div><div class="card"><div class="label">Recorded payouts</div><div class="value">${num(d.payouts)}</div></div></section><section class="section card"><h2>Creator eligibility</h2><div class="label">Followers · ${num(d.progress.followers)} / ${num(d.requirements.followers)}</div><div class="bar"><div class="fill" style="width:${fp}%"></div></div><div class="label" style="display:block;margin-top:16px">Views · ${num(d.progress.views)} / ${num(d.requirements.views)}</div><div class="bar"><div class="fill" style="width:${vp}%"></div></div><div class="status">${d.eligible?'Eligible for monetization':'Keep growing to unlock monetization'}</div></section><section class="section card"><h2>Payout method</h2><div class="muted">Only a masked identifier is shown after saving. Real payment credentials are not stored here.</div><form class="form" id="methodForm"><select class="select" id="kind"><option value="upi">UPI</option><option value="bank">Bank</option></select><input class="input" id="identifier" required minlength="4" maxlength="120" placeholder="UPI ID or bank payout identifier"><button class="primary">Add method</button></form><div class="list">${m.items.map(x=>`<div class="item"><div><strong>${esc(x.method_type.toUpperCase())}</strong><div class="muted">${esc(x.identifier_masked)}</div></div><span class="muted">Saved</span></div>`).join('')||'<div class="muted">No payout method added.</div>'}</div></section><section class="section card"><h2>Request payout</h2><div class="label">Current available balance</div><div class="value">${money(Math.max(0,(d.earnings_cents||0)))}</div><button class="primary" id="payoutBtn" style="margin-top:14px" ${(!d.eligible||!m.items.length||Number(d.earnings_cents||0)<1000)?'disabled':''}>Request payout</button><div class="note" style="margin-top:12px">Minimum payout: ₹10.00. Requests remain pending until a real payment provider is connected.</div><div class="list">${pr.items.map(x=>`<div class="item"><div><strong>${money(Number(x.amount_cents||0)/100)}</strong><div class="muted">${esc(x.created_at||'')}</div></div><span>${esc(x.status)}</span></div>`).join('')||'<div class="muted">No payout requests yet.</div>'}</div></section><section class="section card"><div class="note">${esc(d.note)}</div></section>`;document.getElementById('methodForm').onsubmit=async e=>{e.preventDefault();try{await req('/api/payouts/methods',{method:'POST',body:JSON.stringify({method_type:document.getElementById('kind').value,identifier:document.getElementById('identifier').value})});load()}catch(err){alert(err.message)}};document.getElementById('payoutBtn').onclick=async()=>{if(!m.items.length)return;try{await req('/api/payouts/request?method_id='+encodeURIComponent(m.items[0].id),{method:'POST'});load()}catch(err){alert(err.message)}}}catch(e){document.getElementById('app').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}load();</script></body></html>

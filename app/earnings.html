<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earnings · REelo</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f8;color:#111;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:28px}.btn{border:0;background:#fff;border:1px solid #e7e7ea;border-radius:12px;padding:10px 14px;cursor:pointer}.hero{background:#111;color:#fff;border-radius:22px;padding:26px;margin-bottom:18px}.hero .small{opacity:.65;font-size:13px}.money{font-size:42px;font-weight:800;margin-top:7px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #e8e8eb;border-radius:18px;padding:20px}.label{color:#777;font-size:13px}.value{font-size:24px;font-weight:750;margin-top:8px}.section{margin-top:24px}.section h2{font-size:18px}.bar{height:9px;background:#eee;border-radius:10px;overflow:hidden;margin-top:12px}.fill{height:100%;background:#111}.status{font-weight:700;margin-top:12px}.note{color:#777;font-size:13px;line-height:1.5}.error{background:#fff1f1;color:#b42318;padding:14px;border-radius:12px}@media(max-width:700px){.wrap{padding:16px}.grid{grid-template-columns:1fr}.money{font-size:34px}}</style></head><body><main class="wrap"><header class="top"><h1>Earnings</h1><button class="btn" onclick="location.href='creator-studio.html'">← Creator Studio</button></header><div id="app">Loading…</div></main><script>const API=window.REELO_API||'http://localhost:8000';const token=localStorage.getItem('reelo_token');const headers=token?{Authorization:'Bearer '+token}:{};function num(v){return Number(v||0).toLocaleString()}async function load(){if(!token){location.href='index.html';return}try{const r=await fetch(API+'/api/monetization/dashboard',{headers});if(r.status===401){location.href='index.html';return}if(!r.ok)throw Error('Unable to load earnings');const d=await r.json();const fp=Math.min(100,d.progress.followers/d.requirements.followers*100),vp=Math.min(100,d.progress.views/d.requirements.views*100);document.getElementById('app').innerHTML=`<section class="hero"><div class="small">Estimated creator earnings</div><div class="money">₹${Number(d.earnings||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div></section><section class="grid"><div class="card"><div class="label">Followers</div><div class="value">${num(d.progress.followers)}</div></div><div class="card"><div class="label">Total views</div><div class="value">${num(d.progress.views)}</div></div><div class="card"><div class="label">Recorded payouts</div><div class="value">${num(d.payouts)}</div></div></section><section class="section card"><h2>Creator eligibility</h2><div class="label">Followers · ${num(d.progress.followers)} / ${num(d.requirements.followers)}</div><div class="bar"><div class="fill" style="width:${fp}%"></div></div><div class="label" style="margin-top:16px">Views · ${num(d.progress.views)} / ${num(d.requirements.views)}</div><div class="bar"><div class="fill" style="width:${vp}%"></div></div><div class="status">${d.eligible?'Eligible for monetization':'Keep growing to unlock monetization'}</div></section><section class="section card"><div class="note">${d.note}</div></section>`}catch(e){document.getElementById('app').innerHTML='<div class="error">'+e.message+'</div>'}}load();</script></body></html>

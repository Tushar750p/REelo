<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile · REelo</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif}.page{max-width:760px;margin:auto;min-height:100vh}.top{height:58px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #222;position:sticky;top:0;background:#050505eF;backdrop-filter:blur(14px);z-index:5}.back{border:0;background:none;color:#fff;font-size:27px}.title{margin:auto;font-weight:800}.spacer{width:34px}.profile{padding:24px 20px 18px}.identity{display:flex;gap:18px;align-items:center}.avatar{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#333,#111);font-size:30px;font-weight:900;border:2px solid #333}.name{font-size:21px;font-weight:850}.handle{color:#aaa;margin-top:3px}.bio{color:#ddd;line-height:1.45;margin:14px 0 0;white-space:pre-wrap}.stats{display:flex;gap:28px;margin-top:20px}.stat{text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:#999}.follow{margin-top:18px;width:100%;border:0;border-radius:12px;padding:12px;font-weight:800;background:#fff;color:#000}.follow.on{background:#242424;color:#fff;border:1px solid #444}.tabs{display:flex;border-top:1px solid #222;border-bottom:1px solid #222}.tab{flex:1;padding:14px;text-align:center;color:#aaa;font-weight:700}.tab.active{color:#fff;border-bottom:2px solid #fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.tile{aspect-ratio:9/14;background:#151515;position:relative;overflow:hidden}.tile video{width:100%;height:100%;object-fit:cover}.meta{position:absolute;left:7px;bottom:6px;font-size:11px;text-shadow:0 1px 4px #000}.state{padding:60px 20px;text-align:center;color:#888}@media(min-width:700px){.grid{gap:5px}.profile{padding:30px 30px}}
</style></head><body><main class="page"><header class="top"><button class="back" onclick="history.back()">‹</button><div class="title" id="handle">Profile</div><div class="spacer"></div></header><section class="profile" id="profile"><div class="state">Loading profile…</div></section><nav class="tabs"><div class="tab active">Videos</div></nav><section class="grid" id="grid"></section></main><script>(async()=>{const API=window.REELO_API||'http://localhost:8000',token=localStorage.getItem('reelo_token')||'',headers=token?{'Authorization':'Bearer '+token}:{},params=new URLSearchParams(location.search),name=(params.get('username')||'').replace(/^@/,'').trim();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>{n=Number(n)||0;return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n)};try{if(!name)throw Error('Missing username');const r=await fetch(API+'/api/profiles/'+encodeURIComponent(name),{headers});const d=await r.json();if(!r.ok)throw Error(d.detail||'Profile not found');const u=d.user;document.title='@'+u.username+' · REelo';document.getElementById('handle').textContent='@'+u.username;const initial=(u.display_name||u.username).slice(0,1).toUpperCase();document.getElementById('profile').innerHTML='<div class="identity"><div class="avatar">'+esc(initial)+'</div><div><div class="name">'+esc(u.display_name)+'</div><div class="handle">@'+esc(u.username)+'</div></div></div><div class="stats"><div class="stat"><b>'+fmt(u.followers)+'</b><span>Followers</span></div><div class="stat"><b>'+fmt(u.following)+'</b><span>Following</span></div><div class="stat"><b>'+d.videos.length+'</b><span>Videos</span></div></div><div class="bio">'+esc(u.bio||'')+'</div>'+(d.is_me?'':'<button id="follow" class="follow '+(d.followed?'on':'')+'">'+(d.followed?'Following':'Follow')+'</button>');document.getElementById('grid').innerHTML=d.videos.length?d.videos.map(v=>'<article class="tile"><video src="'+esc(v.filename.startsWith('http')?v.filename:API+'/media/'+v.filename)+'" muted playsinline preload="metadata"></video><div class="meta">♥ '+fmt(v.likes)+' · ▶ '+fmt(v.views)+'</div></article>').join(''):'<div class="state" style="grid-column:1/-1">No videos yet</div>';const fb=document.getElementById('follow');fb?.addEventListener('click',async()=>{fb.disabled=true;try{const x=await fetch(API+'/api/users/'+encodeURIComponent(u.id)+'/follow',{method:'POST',headers});const a=await x.json();if(!x.ok)throw Error(a.detail||'Could not update follow');d.followed=a.action==='follow';fb.textContent=d.followed?'Following':'Follow';fb.classList.toggle('on',d.followed);u.followers=Math.max(0,Number(u.followers)+(d.followed?1:-1));document.querySelector('.stat b').textContent=fmt(u.followers)}catch(e){alert(e.message)}finally{fb.disabled=false}})}catch(e){document.getElementById('profile').innerHTML='<div class="state">'+esc(e.message||'Profile unavailable')+'</div>'}})();</script></body></html>

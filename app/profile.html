<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Profile · REelo</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif}.page{max-width:760px;margin:auto;min-height:100vh;background:#080808}.top{height:58px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #222;position:sticky;top:0;background:#080808eF;backdrop-filter:blur(16px);z-index:5}.back{border:0;background:none;color:#fff;font-size:28px;cursor:pointer}.title{font-weight:800;font-size:18px}.tophandle{margin-left:auto;color:#999;font-size:13px}.profile{padding:26px 20px 22px}.identity{display:flex;gap:18px;align-items:center}.avatar{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#333,#111);font-size:30px;font-weight:900;border:2px solid #333}.name{font-size:22px;font-weight:850;margin:0}.handle{color:#aaa;margin-top:4px}.bio{color:#ddd;line-height:1.45;margin:16px 0 0;white-space:pre-wrap}.stats{display:flex;gap:30px;margin-top:22px}.stat{text-align:center;min-width:62px}.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:#999}.follow{margin-top:18px;width:100%;border:0;border-radius:11px;padding:12px;font-weight:800;background:#fff;color:#000;cursor:pointer}.follow.on{background:#242424;color:#fff;border:1px solid #444}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid #222;border-bottom:1px solid #222}.tab{padding:14px;text-align:center;color:#999;font-weight:700;cursor:pointer}.tab.active{color:#fff;border-bottom:2px solid #fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#000}.tile{aspect-ratio:9/14;background:#151515;position:relative;overflow:hidden;cursor:pointer}.tile video{width:100%;height:100%;object-fit:cover}.meta{position:absolute;left:7px;bottom:6px;font-size:11px;text-shadow:0 1px 4px #000}.list{padding:8px 16px}.person{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid #222}.person .avatar{width:48px;height:48px;font-size:16px}.person-info{flex:1}.person-name{font-weight:750}.person-handle{font-size:12px;color:#888;margin-top:2px}.state{padding:65px 20px;text-align:center;color:#888}.error{color:#ff9696}@media(min-width:700px){.profile{padding:30px}.grid{gap:5px}}
</style></head><body><main class="page"><header class="top"><button class="back" onclick="history.back()">‹</button><div class="title">REelo</div><div class="tophandle" id="topHandle"></div></header><section class="profile" id="profile"><div class="state">Loading profile…</div></section><nav class="tabs"><div class="tab active" data-kind="videos">Videos</div><div class="tab" data-kind="followers">Followers</div><div class="tab" data-kind="following">Following</div></nav><section id="content"></section></main><script>
const API=window.REELO_API||location.origin;const params=new URLSearchParams(location.search);const name=(params.get('username')||params.get('u')||'').replace(/^@/,'').trim();let data=null;
const token=()=>localStorage.getItem('reelo_token')||'';const headers=()=>token()?{Authorization:'Bearer '+token()}:{};const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>{n=Number(n)||0;return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n)};const initials=u=>(u.display_name||u.username||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
function renderProfile(){const u=data.user;document.title='@'+u.username+' · REelo';document.getElementById('topHandle').textContent='@'+u.username;document.getElementById('profile').innerHTML='<div class="identity"><div class="avatar">'+esc(initials(u))+'</div><div><h1 class="name">'+esc(u.display_name||u.username)+'</h1><div class="handle">@'+esc(u.username)+'</div></div></div><div class="stats"><div class="stat"><b>'+fmt(u.followers)+'</b><span>Followers</span></div><div class="stat"><b>'+fmt(u.following)+'</b><span>Following</span></div><div class="stat"><b>'+data.videos.length+'</b><span>Videos</span></div></div>'+(u.bio?'<div class="bio">'+esc(u.bio)+'</div>':'')+(data.is_me?'':'<button id="follow" class="follow '+(data.followed?'on':'')+'">'+(data.followed?'Following':'Follow')+'</button>');const b=document.getElementById('follow');if(b)b.onclick=toggleFollow}
function renderVideos(){const c=document.getElementById('content');if(!data.videos.length){c.innerHTML='<div class="state">No videos yet</div>';return}c.innerHTML='<div class="grid">'+data.videos.map(v=>'<article class="tile" data-id="'+esc(v.id)+'"><video src="'+esc(v.filename.startsWith('http')?v.filename:API+'/media/'+encodeURIComponent(v.filename))+'" muted playsinline preload="metadata"></video><div class="meta">♥ '+fmt(v.likes)+' · ▶ '+fmt(v.views)+'</div></article>').join('')+'</div>';c.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{const v=data.videos.find(x=>String(x.id)===t.dataset.id);if(v)location.href='/index.html?video='+encodeURIComponent(v.id)})}
async function renderList(kind){const c=document.getElementById('content');c.innerHTML='<div class="state">Loading…</div>';try{const r=await fetch(API+'/api/profiles/'+encodeURIComponent(name)+'/'+kind,{headers:headers()});const d=await r.json();if(!r.ok)throw Error(d.detail||'Could not load '+kind);c.innerHTML=d.items?.length?'<div class="list">'+d.items.map(u=>'<div class="person"><div class="avatar">'+esc(initials(u))+'</div><div class="person-info"><div class="person-name">'+esc(u.display_name||u.username)+'</div><div class="person-handle">@'+esc(u.username)+'</div></div></div>').join('')+'</div>':'<div class="state">No '+kind+' yet</div>'}catch(e){c.innerHTML='<div class="state error">'+esc(e.message)+'</div>'}}
async function toggleFollow(){const b=document.getElementById('follow');const t=token();if(!t){location.href='/index.html?auth=login';return}b.disabled=true;try{const r=await fetch(API+'/api/users/'+encodeURIComponent(data.user.id)+'/follow',{method:'POST',headers:headers()});const d=await r.json();if(!r.ok)throw Error(d.detail||'Could not update follow');data.followed=d.action==='follow';data.user.followers=Math.max(0,Number(data.user.followers||0)+(data.followed?1:-1));renderProfile()}catch(e){alert(e.message)}finally{b.disabled=false}}
async function load(){if(!name){document.getElementById('profile').innerHTML='<div class="state error">Missing username</div>';return}try{const r=await fetch(API+'/api/profiles/'+encodeURIComponent(name),{headers:headers()});const d=await r.json();if(!r.ok)throw Error(d.detail||'Profile not found');data=d;renderProfile();renderVideos()}catch(e){document.getElementById('profile').innerHTML='<div class="state error">'+esc(e.message||'Profile unavailable')+'</div>'}}
document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));tab.classList.add('active');tab.dataset.kind==='videos'?renderVideos():renderList(tab.dataset.kind)});load();
</script></body></html>

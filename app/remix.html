<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REelo Remix</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:620px;margin:auto;min-height:100vh;background:#111}.head{height:64px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #292929}.back{border:0;background:none;color:#fff;font-size:25px}.head b{font-size:19px}.card{margin:18px;padding:18px;border:1px solid #303030;border-radius:18px;background:#181818}.card h2{margin:0 0 6px}.muted{color:#999}.tabs{display:flex;gap:8px;margin:18px}.tabs button{flex:1;padding:12px;border:1px solid #333;background:#1b1b1b;color:#fff;border-radius:12px}.tabs button.active{background:#fff;color:#000}.field{margin:14px 0}.field label{display:block;color:#aaa;font-size:13px;margin-bottom:6px}.field input{width:100%;padding:12px;border-radius:12px;border:1px solid #333;background:#0e0e0e;color:#fff}.primary{width:100%;padding:13px;border:0;border-radius:13px;font-weight:800}.source{padding:12px;background:#0d0d0d;border-radius:13px;word-break:break-all}</style></head><body><main class="wrap"><header class="head"><button class="back" onclick="history.back()">‹</button><b>Create with this video</b></header><section class="card"><h2 id="title">Duet / Remix</h2><div class="muted">Create your own response or collaboration.</div><div class="field"><label>Source video ID</label><input id="vid" placeholder="Video ID"></div><div class="source" id="source">Choose a mode below.</div></section><div class="tabs"><button class="active" data-kind="duet">Duet</button><button data-kind="remix">Remix</button><button data-kind="reply">Reply</button></div><section class="card"><div class="field"><label>Your media URL</label><input id="media" placeholder="Uploaded video URL"></div><div class="field"><label>Caption</label><input id="caption" maxlength="2200" placeholder="Add a caption…"></div><button class="primary" onclick="publish()">Publish</button></section></main><script>const API=window.REELO_API||'http://localhost:8000';const token=localStorage.getItem('reelo_token')||'';let kind='duet';document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-kind]').forEach(x=>x.classList.remove('active'));b.classList.add('active');kind=b.dataset.kind;document.querySelector('#title').textContent=kind==='reply'?'Reply with Video':kind==='duet'?'Create a Duet':'Create a Remix'});const q=new URLSearchParams(location.search);if(q.get('video'))document.querySelector('#vid').value=q.get('video');async function publish(){if(!token)return alert('Please log in first');const vid=document.querySelector('#vid').value.trim(),media=document.querySelector('#media').value.trim(),caption=document.querySelector('#caption').value.trim();if(!vid||!media)return alert('Video ID and media URL are required');const r=await fetch(API+'/api/remix/'+encodeURIComponent(vid),{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({media_url:media,caption,kind})});const d=await r.json().catch(()=>({}));if(r.ok){alert('Published successfully');location.href='index.html'}else alert(d.detail||'Could not publish')}</script></body></html>

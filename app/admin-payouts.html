<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payout Control Center · REelo</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#111;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:28px}.btn,.action{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e7e7ea;border-radius:16px;padding:18px}.label{font-size:12px;color:#777}.value{font-size:25px;font-weight:800;margin-top:6px}.table{margin-top:18px;background:#fff;border:1px solid #e7e7ea;border-radius:16px;overflow:hidden}.row{display:grid;grid-template-columns:1.2fr 1fr 110px 130px 250px;gap:12px;padding:15px 18px;border-bottom:1px solid #eee;align-items:center}.row:last-child{border-bottom:0}.head{font-size:12px;color:#777;background:#fafafa}.pill{font-size:11px;font-weight:700;padding:5px 8px;border-radius:99px;background:#eee}.pending{background:#fff7df}.processing{background:#eef4ff}.paid{background:#eaf8ee}.rejected,.failed{background:#fff0f0}.actions{display:flex;gap:7px;flex-wrap:wrap}.action.primary{background:#111;color:#fff;border-color:#111}.action:disabled{opacity:.4;cursor:not-allowed}.error{margin-top:14px;background:#fff0f0;color:#a51d2d;padding:12px;border-radius:10px}.empty{padding:25px;text-align:center;color:#777}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.table{overflow:auto}.row{min-width:760px}.wrap{padding:16px}}</style></head><body><main class="wrap"><header class="top"><h1>Payout Control Center</h1><button class="btn" onclick="location.href='creator-studio.html'">Creator Studio</button></header><section class="stats" id="stats"></section><div id="msg"></div><section class="table"><div class="row head"><div>Request</div><div>Creator</div><div>Amount</div><div>Status</div><div>Actions</div></div><div id="list"><div class="empty">Loading…</div></div></section></main><script>const API=window.REELO_API||'http://localhost:8000';const token=localStorage.getItem('reelo_token');const H=token?{Authorization:'Bearer '+token,'Content-Type':'application/json'}:{};const money=v=>'₹'+(Number(v||0)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function req(url,opts={}){const r=await fetch(API+url,{...opts,headers:{...H,...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401)throw Error('Login required');if(!r.ok)throw Error(d.detail||'Request failed');return d}function actions(x){if(x.status==='pending')return `<button class="action primary" onclick="setStatus('${esc(x.id)}','processing')">Start processing</button><button class="action" onclick="setStatus('${esc(x.id)}','rejected')">Reject</button>`;if(x.status==='processing')return `<button class="action primary" onclick="setStatus('${esc(x.id)}','paid')">Mark paid</button><button class="action" onclick="setStatus('${esc(x.id)}','rejected')">Reject</button>`;return '<span class="label">No further action</span>'}async function load(){try{const d=await req('/api/admin/payouts');const items=d.items||[];const count=s=>items.filter(x=>x.status===s).length;const sum=s=>items.filter(x=>x.status===s).reduce((a,x)=>a+Number(x.amount_cents||0),0);document.getElementById('stats').innerHTML=`<div class="card"><div class="label">Pending</div><div class="value">${count('pending')}</div></div><div class="card"><div class="label">Processing</div><div class="value">${count('processing')}</div></div><div class="card"><div class="label">Pending value</div><div class="value">${money(sum('pending'))}</div></div><div class="card"><div class="label">Paid value</div><div class="value">${money(sum('paid'))}</div></div>`;document.getElementById('list').innerHTML=items.map(x=>`<div class="row"><div><strong>#${esc(x.id).slice(0,10)}</strong><div class="label">${esc(x.created_at||'')}</div></div><div>${esc(x.user_id)}<div class="label">Method: ${esc(x.method_id).slice(0,10)}</div></div><div><strong>${money(x.amount_cents)}</strong></div><div><span class="pill ${esc(x.status)}">${esc(x.status)}</span></div><div class="actions">${actions(x)}</div></div>`).join('')||'<div class="empty">No payout requests.</div>'}catch(e){document.getElementById('list').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}async function setStatus(id,status){if(!confirm('Change payout status to '+status+'?'))return;try{await req('/api/admin/payouts/'+encodeURIComponent(id)+'/status?status='+encodeURIComponent(status),{method:'POST'});document.getElementById('msg').innerHTML='<div class="card">Payout status updated.</div>';await load()}catch(e){document.getElementById('msg').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}if(!token){location.href='index.html'}else load();</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REelo Coins</title><style>body{margin:0;background:#0b0b0b;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:720px;margin:auto;padding:24px}.card{background:#151515;border:1px solid #292929;border-radius:18px;padding:18px;margin:12px 0}.balance{font-size:34px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pkg{padding:16px;border:1px solid #333;border-radius:14px;background:#191919;color:#fff;cursor:pointer}.pkg b{display:block;font-size:20px}.pkg small{color:#aaa}.note{color:#aaa;font-size:12px;line-height:1.5}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>🪙 REelo Coins</h1><div class="card"><div class="balance" id="balance">0 🪙</div><div class="note">Your virtual LIVE-gifting balance</div></div><div class="card"><h2>Get Coins</h2><div class="grid" id="packages"></div><p class="note">Demo top-up is enabled for development. No real-money charge is made. Production purchases must be connected to a verified payment provider before launch.</p></div></div><script>(async()=>{const API=window.REELO_API||location.origin,token=localStorage.getItem('reelo_token')||'',H=()=>token?{Authorization:'Bearer '+token}:{};async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{...H(),...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Request failed');return d}async function load(){const d=await api('/api/coins/wallet');balance.textContent=d.balance+' 🪙';const p=await api('/api/coins/packages');packages.innerHTML=p.items.map(x=>`<button class="pkg" data-id="${x.id}"><b>${x.coins.toLocaleString()} 🪙</b><small>${x.label}</small></button>`).join('');packages.querySelectorAll('button').forEach(b=>b.onclick=async()=>{try{const d=await api('/api/coins/topup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({package_id:b.dataset.id})});balance.textContent=d.balance+' 🪙';alert('Coins added successfully.')}catch(e){alert(e.message)}})}load().catch(e=>alert(e.message))})();</script></body></html>

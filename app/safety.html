<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>REelo Safety Center</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font:15px Inter,system-ui,sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;background:#090909}.head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:16px;background:#090909ed;backdrop-filter:blur(16px);border-bottom:1px solid #242424}.back{border:0;background:none;color:#fff;font-size:30px}.head h1{font-size:21px;margin:0}.content{padding:18px}.hero{padding:18px;border:1px solid #292929;border-radius:18px;background:linear-gradient(145deg,#171717,#0f0f0f)}.hero h2{margin:0 0 7px;font-size:20px}.muted{color:#999;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.stat{padding:14px;border:1px solid #292929;border-radius:13px;background:#121212}.stat b{display:block;font-size:22px}.stat span{color:#888;font-size:12px}.card{margin-top:14px;padding:16px;border:1px solid #292929;border-radius:16px;background:#111}.card h3{margin:0 0 12px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#242424;color:#ddd;font-size:11px;font-weight:800}.badge.warn{background:#3b2d13;color:#ffd98a}.badge.danger{background:#3d1717;color:#ffb0b0}.strike{padding:13px 0;border-bottom:1px solid #252525}.strike:last-child{border-bottom:0}.row{display:flex;justify-content:space-between;gap:12px}.reason{color:#ccc;margin-top:7px;line-height:1.4}.meta{font-size:11px;color:#777;margin-top:7px}.appeal{margin-top:12px;padding:13px;border-radius:12px;background:#171717;border:1px solid #2a2a2a}.field{width:100%;margin-top:9px;border:1px solid #333;background:#191919;color:#fff;border-radius:10px;padding:11px;outline:0}.primary{width:100%;margin-top:10px;border:0;border-radius:10px;padding:11px;background:#fff;color:#000;font-weight:800}.secondary{width:100%;margin-top:9px;border:1px solid #333;border-radius:10px;padding:11px;background:#171717;color:#fff;font-weight:700}.empty{text-align:center;color:#777;padding:25px}.toast{position:fixed;left:16px;right:16px;bottom:20px;max-width:528px;margin:auto;background:#222;border:1px solid #333;padding:12px;border-radius:12px;display:none;z-index:20}.help{font-size:12px;color:#777;line-height:1.5}@media(min-width:700px){.app{box-shadow:0 0 0 1px #222;min-height:100vh}}</style></head><body><main class="app"><header class="head"><button class="back" onclick="history.back()">‹</button><h1>Safety Center</h1></header><section class="content" id="content"><div class="empty">Loading your safety status…</div></section></main><div id="toast" class="toast"></div><script>const API=window.REELO_API||'http://localhost:8000',token=localStorage.getItem('reelo_token')||'';const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function headers(json=false){const h=token?{Authorization:'Bearer '+token}:{};if(json)h['Content-Type']='application/json';return h}function date(s){if(!s)return'—';const d=new Date(s);return isNaN(d)?s:d.toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}function badge(action){if(action==='suspend')return'<span class="badge danger">Suspended</span>';if(action==='restriction')return'<span class="badge warn">Restricted</span>';if(action==='monetization_hold')return'<span class="badge warn">Monetization hold</span>';return'<span class="badge">Warning</span>'}function statusBadge(s){return s==='pending'?'<span class="badge warn">Pending</span>':s==='approved'?'<span class="badge">Approved</span>':'<span class="badge danger">Rejected</span>'}function appealForm(s){return '<div class="appeal"><b>Appeal this strike</b><textarea class="field" id="appeal-'+esc(s.id)+'" maxlength="1000" placeholder="Explain why this action should be reviewed…"></textarea><button class="primary" onclick="appeal(\''+esc(s.id)+'\')">Submit appeal</button></div>'}function render(d){const r=d.restriction;let html='';html+='<div class="hero"><h2>'+ (r&&r.active ? 'Your account has an active safety action' : 'Your account is in good standing')+'</h2><div class="muted">'+(r&&r.active?'Some actions may be temporarily unavailable. You can review the reason and appeal eligible strikes below.':'Keep sharing responsibly. If REelo takes action on your account, the details will appear here.')+'</div>';if(r&&r.active)html+='<div style="margin-top:12px">'+badge(r.action)+' <span class="muted">until '+date(r.expires_at)+'</span></div>';html+='</div>';html+='<div class="grid"><div class="stat"><b>'+esc(d.active_strikes||0)+'</b><span>Active strikes</span></div><div class="stat"><b>'+esc(d.strikes?.length||0)+'</b><span>Total history</span></div></div>';html+='<div class="card"><h3>Current enforcement</h3>';html+=r&&r.active?'<div class="reason"><b>'+esc(r.action)+'</b><br>'+esc(r.reason||'Safety policy enforcement')+'</div><div class="meta">Expires: '+date(r.expires_at)+'</div>':'<div class="muted">No active restrictions or monetization holds.</div>';html+='</div>';html+='<div class="card"><h3>Strike history</h3>';if(!d.strikes?.length)html+='<div class="empty">No strikes on your account.</div>';else d.strikes.forEach(s=>{html+='<div class="strike"><div class="row"><b>'+esc(s.severity||'warning')+'</b>'+badge(s.action)+'</div><div class="reason">'+esc(s.reason)+'</div><div class="meta">'+(s.status==='active'?'Active':'Resolved')+' · '+date(s.created_at)+(s.expires_at?' · expires '+date(s.expires_at):'')+'</div>';const can=s.status==='active'&&!d.appeals?.some(a=>a.strike_id===s.id&&a.status==='pending');if(can)html+=appealForm(s);html+='</div>'});html+='</div>';html+='<div class="card"><h3>Appeals</h3>';if(!d.appeals?.length)html+='<div class="empty">No appeals submitted.</div>';else d.appeals.forEach(a=>{html+='<div class="strike"><div class="row"><b>Appeal</b>'+statusBadge(a.status)+'</div><div class="reason">'+esc(a.reason)+'</div><div class="meta">Submitted '+date(a.created_at)+(a.admin_reason?' · Review: '+esc(a.admin_reason):'')+'</div></div>'});html+='</div><p class="help">Appeals are reviewed by REelo Trust & Safety. Keep your explanation factual and include relevant context. Do not submit passwords, payment credentials, or identity-document numbers.</p>';$('content').innerHTML=html}async function load(){if(!token){$('content').innerHTML='<div class="empty"><h2>Login required</h2><p>Log in to view your safety status and appeals.</p><button class="primary" onclick="location.href=\'index.html\'">Back to REelo</button></div>';return}try{const r=await fetch(API+'/api/trust-safety/me',{headers:headers()});if(r.status===401){$('content').innerHTML='<div class="empty"><h2>Session expired</h2><button class="primary" onclick="location.href=\'index.html\'">Back to REelo</button></div>';return}if(!r.ok)throw Error();render(await r.json())}catch(e){$('content').innerHTML='<div class="empty">Safety Center is temporarily unavailable.</div>'}}async function appeal(id){const reason=($('appeal-'+id)?.value||'').trim();if(reason.length<5){toast('Please explain your appeal.');return}try{const r=await fetch(API+'/api/trust-safety/appeals',{method:'POST',headers:headers(true),body:JSON.stringify({strike_id:id,reason})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Unable to submit appeal');toast('Appeal submitted.');load()}catch(e){toast(e.message||'Unable to submit appeal')}}load();</script></main></body></html>

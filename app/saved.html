<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved · REelo</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:15px Inter,system-ui,sans-serif}.shell{max-width:760px;margin:auto;min-height:100vh;background:#080808}.head{position:sticky;top:0;z-index:5;background:#080808ee;padding:14px 16px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #222}.back{border:0;background:none;color:#fff;font-size:28px}.head h1{font-size:20px;margin:0;flex:1}.new{border:1px solid #333;background:#fff;color:#000;border-radius:10px;padding:9px 12px;font-weight:800}.tabs{display:flex;gap:8px;padding:14px 16px;overflow:auto}.tab{border:1px solid #292929;background:#151515;color:#aaa;border-radius:20px;padding:8px 13px;white-space:nowrap}.tab.active{background:#fff;color:#000}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.tile{aspect-ratio:9/14;background:#151515;position:relative;overflow:hidden}.tile video{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:auto 0 0;padding:30px 8px 8px;background:linear-gradient(transparent,#000b)}.meta{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{text-align:center;color:#777;padding:80px 25px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.card{width:100%;max-width:760px;margin:auto;background:#121212;border:1px solid #2a2a2a;border-radius:22px 22px 0 0;padding:20px}.input{width:100%;padding:13px;border:1px solid #333;border-radius:11px;background:#1b1b1b;color:#fff;outline:0;margin-top:9px}.primary,.secondary{width:100%;padding:12px;border-radius:10px;font-weight:800;margin-top:10px}.primary{border:0;background:#fff;color:#000}.secondary{border:1px solid #333;background:#181818;color:#fff}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="shell"><header class="head"><button class="back" onclick="location.href='index.html'">‹</button><h1>Saved</h1><button class="new" onclick="openNew()">+ Collection</button></header><div id="tabs" class="tabs"></div><section id="grid" class="grid"></section><div id="empty" class="empty" style="display:none">Nothing saved yet.</div></main><div id="modal" class="modal" onclick="if(event.target===this)closeNew()"><div class="card"><h2>New collection</h2><input id="name" class="input" maxlength="60" placeholder="Collection name"><input id="desc" class="input" maxlength="180" placeholder="Description (optional)"><button class="primary" onclick="createCollection()">Create collection</button><button class="secondary" onclick="closeNew()">Cancel</button></div></div><script>const API=window.REELO_API||location.origin;const token=localStorage.getItem('reelo_token')||'';const el=id=>document.getElementById(id);const headers=()=>token?{Authorization:'Bearer '+token}:{};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>{n=Number(n||0);return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n)};const videoUrl=v=>v.filename?.startsWith('http')?v.filename:API+(v.filename?.startsWith('/')?'':'/')+v.filename;async function load(){if(!token){location.href='index.html';return}try{const [s,c]=await Promise.all([fetch(API+'/api/saves',{headers:headers()}),fetch(API+'/api/saves/collections',{headers:headers()})]);if(s.status===401){location.href='index.html';return}const sd=await s.json(),cd=await c.json();el('tabs').innerHTML='<button class="tab active" data-id="saved" onclick="showSaved()">🔖 Saved · '+fmt(sd.total)+'</button>'+(cd.items||[]).map(x=>'<button class="tab" data-id="'+esc(x.id)+'" onclick="showCollection(\''+esc(x.id)+'\')">'+esc(x.name)+' · '+x.items+'</button>').join('');render(sd.items||[])}catch(e){el('empty').textContent='Saved videos are unavailable right now.';el('empty').style.display='block'}}function render(items){el('grid').innerHTML=(items||[]).map(v=>'<article class="tile"><video src="'+esc(videoUrl(v))+'" muted loop playsinline preload="metadata"></video><div class="shade"><div class="meta">@'+esc(v.username||'user')+' · '+fmt(v.likes)+' likes</div></div></article>').join('');el('empty').style.display=items.length?'none':'block';document.querySelectorAll('.tile video').forEach(v=>{v.addEventListener('mouseenter',()=>v.play().catch(()=>{}));v.addEventListener('mouseleave',()=>v.pause())})}async function showSaved(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.id==='saved'));const r=await fetch(API+'/api/saves',{headers:headers()});const d=await r.json();render(d.items||[])}async function showCollection(id){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.id===id));const r=await fetch(API+'/api/saves/collections/'+encodeURIComponent(id),{headers:headers()});const d=await r.json();render(d.items||[])}function openNew(){el('modal').classList.add('show');el('name').focus()}function closeNew(){el('modal').classList.remove('show');el('name').value='';el('desc').value=''}async function createCollection(){const name=el('name').value.trim();if(!name)return;const r=await fetch(API+'/api/saves/collections',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({name,description:el('desc').value.trim(),is_private:true})});if(!r.ok){const d=await r.json();alert(d.detail||'Could not create collection');return}closeNew();load()}load();</script></body></html>

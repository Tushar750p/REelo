<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REelo Messages</title><style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:760px;margin:auto;min-height:100vh;background:#101010}.head,.chathead{height:64px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #292929;gap:14px;position:sticky;top:0;background:#101010;z-index:2}.back{border:0;background:none;color:#fff;font-size:28px;cursor:pointer}.head b{font-size:20px}.badge{margin-left:auto;border:1px solid #333;border-radius:999px;padding:5px 10px;color:#bbb;font-size:12px}.list{padding:8px}.row{display:flex;gap:13px;padding:14px;border-radius:15px;cursor:pointer;align-items:center}.row:hover{background:#1a1a1a}.avatar{width:48px;height:48px;flex:0 0 48px;border-radius:50%;background:#303030;display:grid;place-items:center;font-weight:800}.meta{min-width:0;flex:1}.top{display:flex;align-items:center;gap:8px}.name{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pin{font-size:11px;color:#aaa}.preview{color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.unread{background:#fff;color:#000;border-radius:999px;min-width:22px;height:22px;padding:0 7px;display:grid;place-items:center;font-size:12px;font-weight:800}.chat{display:none;position:fixed;inset:0;background:#101010;max-width:760px;margin:auto;z-index:5}.chat.show{display:flex;flex-direction:column}.chathead{position:static}.chatinfo{min-width:0}.chatname{font-weight:750}.chatuser{font-size:11px;color:#888;margin-top:2px}.presence{font-size:10px;color:#8f8;margin-top:2px}.msgs{flex:1;overflow:auto;padding:18px}.bubble{max-width:76%;padding:10px 13px;border-radius:18px;margin:7px 0;line-height:1.35;word-break:break-word}.mine{margin-left:auto;background:#fff;color:#000;border-bottom-right-radius:5px}.theirs{background:#252525;border-bottom-left-radius:5px}.time{font-size:10px;opacity:.55;margin-top:4px}.state{font-size:10px;opacity:.5;text-align:right}.reactions{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.rx{font-size:11px;border:1px solid #444;border-radius:10px;padding:2px 6px;cursor:pointer}.reactbar{display:none;gap:3px;margin-top:4px}.bubble:hover .reactbar{display:flex}.reactbtn{border:0;background:#181818;border-radius:10px;padding:3px 5px;cursor:pointer}.typing{height:20px;padding:0 18px;color:#888;font-size:12px}.composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #292929}.composer input{flex:1;border:1px solid #333;background:#1b1b1b;color:#fff;border-radius:24px;padding:12px 15px;outline:none}.composer button{border:0;border-radius:50%;width:44px;background:#fff;color:#000;font-size:18px;cursor:pointer}.tools{margin-left:auto;display:flex;gap:3px}.tool{border:0;background:#181818;color:#aaa;border-radius:10px;padding:7px 9px;cursor:pointer}.empty{padding:42px 20px;text-align:center;color:#888}.loadmore{display:block;margin:8px auto 16px;background:#181818;color:#aaa;border:1px solid #2b2b2b;border-radius:20px;padding:8px 14px;cursor:pointer}
</style></head><body><main class="wrap"><header class="head"><button class="back" onclick="history.back()">‹</button><b>Messages</b><span id="totalBadge" class="badge">0 unread</span></header><section id="list" class="list"><div class="empty">Loading…</div></section></main><section id="chat" class="chat"><header class="chathead"><button class="back" onclick="closeChat()">‹</button><div class="avatar" id="chatAvatar">@</div><div class="chatinfo"><div id="chatName" class="chatname">Chat</div><div id="chatUser" class="chatuser"></div><div id="presence" class="presence">offline</div></div><div class="tools"><button class="tool" id="pinBtn">Pin</button><button class="tool" id="muteBtn">Mute</button></div></header><section id="msgs" class="msgs"></section><div id="typing" class="typing"></div><form id="composer" class="composer"><input id="body" maxlength="2000" placeholder="Message…" autocomplete="off"><button>➤</button></form></section><script>
(function(){const API=window.REELO_API||'http://localhost:8000';const token=localStorage.getItem('reelo_token')||'';let me=null,current=null,offset=0,typingTimer=null;const $=id=>document.getElementById(id);const headers=()=>({'Authorization':'Bearer '+token,'Content-Type':'application/json'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function initials(n){return esc(String(n||'@').replace(/^@/,'').slice(0,1).toUpperCase())}function ago(x){const d=Date.parse(String(x||'').replace(' ','T')+'Z');if(!d)return '';const s=Math.max(0,(Date.now()-d)/1000);return s<60?'now':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':new Date(d).toLocaleDateString()}function empty(t){$('list').innerHTML='<div class="empty">'+t+'</div>'}
async function load(){if(!token){empty('Log in to use messages.');return}try{const m=await fetch(API+'/api/me',{headers:headers()});if(!m.ok)throw Error();me=(await m.json()).user;offset=0;await loadPage(true)}catch(e){empty('Could not load messages.')}}async function loadPage(reset){const r=await fetch(API+'/api/messages?limit=50&offset='+offset,{headers:headers()});if(!r.ok)throw Error();const d=await r.json();$('totalBadge').textContent=(d.unread_count||0)+' unread';const html=d.items.map(x=>`<div class="row" onclick="openChat('${esc(x.conversation_id)}','${esc(x.user_id)}','${esc(x.username)}','${esc(x.display_name||x.username)}',${x.pinned?'true':'false'},${x.muted?'true':'false'})"><div class="avatar">${initials(x.username)}</div><div class="meta"><div class="top"><div class="name">${esc(x.display_name||x.username)}</div>${x.pinned?'<span class="pin">📌</span>':''}</div><div class="preview">${x.last_message?esc(x.last_message):'Start a conversation'}</div></div>${x.unread_count?`<span class="unread">${x.unread_count>99?'99+':x.unread_count}</span>`:''}</div>`).join('');if(reset)$('list').innerHTML=html||'<div class="empty">No conversations yet.<br>Open a creator profile to start a chat.</div>';else $('list').insertAdjacentHTML('beforeend',html);if(d.has_more){if(!$('loadMore'))$('list').insertAdjacentHTML('beforeend','<button id="loadMore" class="loadmore">Load more</button>');$('loadMore').onclick=async()=>{offset+=50;await loadPage(false)}}else if($('loadMore'))$('loadMore').remove()}
window.openChat=async function(cid,uid,username,name,pinned,muted){current={cid,uid,username,name,pinned,muted};$('chatName').textContent=name||username;$('chatUser').textContent='@'+username;$('chatAvatar').textContent=initials(username);$('pinBtn').textContent=pinned?'Unpin':'Pin';$('muteBtn').textContent=muted?'Unmute':'Mute';$('chat').classList.add('show');await loadMessages();await pollTyping();};
async function loadMessages(){if(!current)return;const r=await fetch(API+'/api/messages/'+encodeURIComponent(current.cid)+'/messages?limit=50',{headers:headers()});if(!r.ok)return;const d=await r.json();$('msgs').innerHTML=d.items.map(x=>`<div class="bubble ${x.sender_id===me.id?'mine':'theirs'}"><div>${esc(x.body)}</div><div class="time">${ago(x.created_at)}</div>${x.sender_id===me.id?`<div class="state">${x.read_at?'Read':x.delivered_at?'Delivered':'Sent'}</div>`:''}${x.reactions?.length?`<div class="reactions">${x.reactions.map(r=>`<span class="rx">${esc(r.reaction)} ${r.count}</span>`).join('')}</div>`:''}<div class="reactbar">${['❤️','😂','🔥','👍','😮','😢','👏'].map(e=>`<button class="reactbtn" onclick="reactMessage('${x.id}','${e}');event.stopPropagation()">${e}</button>`).join('')}</div></div>`).join('');$('msgs').scrollTop=$('msgs').scrollHeight;fetch(API+'/api/messages/'+encodeURIComponent(current.cid)+'/read',{method:'POST',headers:headers()}).catch(()=>{})}
window.reactMessage=async function(mid,reaction){if(!current)return;const r=await fetch(API+'/api/messages/message/'+encodeURIComponent(mid)+'/reaction',{method:'PUT',headers:headers(),body:JSON.stringify({reaction})});if(r.ok)await loadMessages()};
async function setting(field,value){if(!current)return;const r=await fetch(API+'/api/messages/'+encodeURIComponent(current.cid),{method:'PATCH',headers:headers(),body:JSON.stringify({[field]:value})});if(r.ok){const d=await r.json();current[field]=d.settings[field];if(field==='pinned')$('pinBtn').textContent=current.pinned?'Unpin':'Pin';if(field==='muted')$('muteBtn').textContent=current.muted?'Unmute':'Mute';load()}}
$('pinBtn').onclick=()=>setting('pinned',!current?.pinned);$('muteBtn').onclick=()=>setting('muted',!current?.muted);
async function sendTyping(active){if(!current)return;fetch(API+'/api/messages/'+encodeURIComponent(current.cid)+'/typing',{method:'POST',headers:headers(),body:JSON.stringify({typing:active})}).catch(()=>{})}async function pollTyping(){if(!current)return;try{const r=await fetch(API+'/api/messages/'+encodeURIComponent(current.cid)+'/typing',{headers:headers()});if(r.ok){const d=await r.json();$('typing').textContent=d.typing?'Typing…':'';$('presence').textContent=d.typing?'active':'online'}}catch(e){}}window.closeChat=function(){if(current)sendTyping(false);$('chat').classList.remove('show');current=null;$('typing').textContent='';load()};$('body').addEventListener('input',()=>{sendTyping(true);clearTimeout(typingTimer);typingTimer=setTimeout(()=>sendTyping(false),1800)});$('composer').addEventListener('submit',async e=>{e.preventDefault();const input=$('body'),body=input.value.trim();if(!body||!current)return;input.value='';sendTyping(false);const r=await fetch(API+'/api/messages/'+encodeURIComponent(current.uid),{method:'POST',headers:headers(),body:JSON.stringify({body})});if(r.ok){const d=await r.json();current.cid=d.conversation_id;await loadMessages()}else input.value=body});load();setInterval(()=>{if(current){loadMessages();pollTyping()}else load()},5000)})();
</script></body></html>

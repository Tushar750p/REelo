<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REelo Messages</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:720px;margin:auto;min-height:100vh;background:#111}.head{height:64px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #292929;gap:14px}.back{border:0;background:none;color:#fff;font-size:25px}.head b{font-size:20px}.list{padding:8px}.row{display:flex;gap:13px;padding:14px;border-radius:15px;cursor:pointer}.row:hover{background:#1b1b1b}.avatar{width:48px;height:48px;border-radius:50%;background:#303030;display:grid;place-items:center;font-weight:800}.meta{min-width:0;flex:1}.name{font-weight:750}.preview{color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.unread{background:#fff;color:#000;border-radius:999px;min-width:22px;height:22px;padding:0 7px;display:grid;place-items:center;font-size:12px;font-weight:800}.chat{display:none;position:fixed;inset:0;background:#111;max-width:720px;margin:auto}.chat.show{display:flex;flex-direction:column}.chathead{height:64px;border-bottom:1px solid #292929;display:flex;align-items:center;gap:12px;padding:0 16px}.msgs{flex:1;overflow:auto;padding:18px}.bubble{max-width:76%;padding:10px 13px;border-radius:18px;margin:7px 0;line-height:1.35}.mine{margin-left:auto;background:#fff;color:#000;border-bottom-right-radius:5px}.theirs{background:#252525;border-bottom-left-radius:5px}.time{font-size:10px;opacity:.55;margin-top:4px}.composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #292929}.composer input{flex:1;border:1px solid #333;background:#1b1b1b;color:#fff;border-radius:24px;padding:12px 15px;outline:none}.composer button{border:0;border-radius:50%;width:44px;background:#fff;color:#000;font-size:18px}</style></head><body><main class="wrap"><header class="head"><button class="back" onclick="history.back()">‹</button><b>Messages</b></header><section id="list" class="list"><div style="padding:30px;color:#999">Loading…</div></section></main><section id="chat" class="chat"><header class="chathead"><button class="back" onclick="closeChat()">‹</button><div class="avatar" id="chatAvatar">@</div><b id="chatName">Chat</b></header><section id="msgs" class="msgs"></section><form id="composer" class="composer"><input id="body" maxlength="2000" placeholder="Message…" autocomplete="off"><button>➤</button></form></section><script>(function(){const API=window.REELO_API||'http://localhost:8000';const token=localStorage.getItem('reelo_token')||'';let me=null,current=null;const $=id=>document.getElementById(id);const headers=()=>({'Authorization':'Bearer '+token,'Content-Type':'application/json'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function initials(n){return esc(String(n||'@').replace(/^@/, '').slice(0,1).toUpperCase())}function ago(x){const d=Date.parse(String(x||'').replace(' ','T')+'Z');if(!d)return '';const s=Math.max(0,(Date.now()-d)/1000);return s<60?'now':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':new Date(d).toLocaleDateString()}async function load(){if(!token){$('list').innerHTML='<div style="padding:30px;color:#aaa">Log in to use messages.</div>';return}try{const m=await fetch(API+'/api/me',{headers:headers()});if(!m.ok)throw Error();me=(await m.json()).user;const r=await fetch(API+'/api/messages',{headers:headers()});if(!r.ok)throw Error();const d=await r.json();$('list').innerHTML=d.items.length?d.items.map(x=>`<div class="row" onclick="openChat('${esc(x.conversation_id)}','${esc(x.user_id)}','${esc(x.username)}','${esc(x.display_name||x.username)}')"><div class="avatar">${initials(x.username)}</div><div class="meta"><div class="name">${esc(x.display_name||x.username)}</div><div class="preview">${esc(x.last_message||'Start a conversation')}</div></div>${x.unread?`<span class="unread">${x.unread>99?'99+':x.unread}</span>`:''}</div>`).join(''):'<div style="padding:40px 20px;text-align:center;color:#888">No conversations yet.<br>Open a creator profile to start a chat.</div>'}catch(e){$('list').innerHTML='<div style="padding:30px;color:#aaa">Could not load messages.</div>'}}window.openChat=async function(cid,uid,username,name){current={cid,uid,username,name};$('chatName').textContent=name||username;$('chatAvatar').textContent=initials(username);$('chat').classList.add('show');await loadMessages();};async function loadMessages(){const r=await fetch(API+'/api/messages/'+encodeURIComponent(current.cid)+'/messages',{headers:headers()});if(!r.ok)return;const d=await r.json();$('msgs').innerHTML=d.items.map(x=>`<div class="bubble ${x.sender_id===me.id?'mine':'theirs'}">${esc(x.body)}<div class="time">${ago(x.created_at)}</div></div>`).join('');$('msgs').scrollTop=$('msgs').scrollHeight;fetch(API+'/api/messages/'+encodeURIComponent(current.cid)+'/read',{method:'POST',headers:headers()}).catch(()=>{})}window.closeChat=function(){$('chat').classList.remove('show');current=null;load()};$('composer').addEventListener('submit',async e=>{e.preventDefault();const input=$('body'),body=input.value.trim();if(!body||!current)return;input.value='';const r=await fetch(API+'/api/messages/'+encodeURIComponent(current.uid),{method:'POST',headers:headers(),body:JSON.stringify({body})});if(r.ok){const d=await r.json();current.cid=d.conversation_id;await loadMessages()}else input.value=body});load();})();</script></body></html>

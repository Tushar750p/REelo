<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages · REelo</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:760px;margin:auto;min-height:100vh;background:#0b0b0b}.head{height:64px;display:flex;align-items:center;padding:0 16px;gap:12px;border-bottom:1px solid #252525;position:sticky;top:0;background:#0b0b0bee;backdrop-filter:blur(18px);z-index:3}.back{border:0;background:none;color:#fff;font-size:28px;cursor:pointer}.title{font-size:20px;font-weight:850}.search{margin:12px;border:1px solid #292929;background:#171717;border-radius:13px;padding:11px 14px;color:#fff;width:calc(100% - 24px);outline:none;font:inherit}.row{display:flex;align-items:center;gap:13px;padding:14px 16px;cursor:pointer}.row:hover{background:#151515}.avatar{width:52px;height:52px;flex:0 0 52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#3a3a3a,#151515);font-weight:900}.meta{min-width:0;flex:1}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{color:#999;font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:11px;color:#777}.unread{background:#fff;color:#000;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:11px;font-weight:900}.empty{text-align:center;color:#777;padding:60px 20px;line-height:1.6}.chat{display:none;position:fixed;inset:0;max-width:760px;margin:auto;background:#0b0b0b;z-index:10;flex-direction:column}.chat.show{display:flex}.chathead{height:64px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid #252525;background:#0b0b0bee;backdrop-filter:blur(18px)}.chathead .avatar{width:40px;height:40px;flex-basis:40px}.chatinfo{min-width:0}.chatname{font-weight:800}.handle{font-size:11px;color:#888;margin-top:2px}.tools{margin-left:auto}.tool{border:0;background:#181818;color:#fff;border-radius:10px;padding:8px 11px;cursor:pointer}.msgs{flex:1;overflow:auto;padding:18px 14px}.bubble{max-width:78%;padding:10px 13px;border-radius:18px;background:#222;margin:7px 0;line-height:1.4;word-break:break-word}.mine{margin-left:auto;background:#fff;color:#000;border-bottom-right-radius:5px}.theirs{border-bottom-left-radius:5px}.stamp{font-size:10px;opacity:.5;margin-top:4px}.composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #252525}.input{flex:1;border:1px solid #333;background:#171717;color:#fff;border-radius:24px;padding:12px 15px;outline:none;font:inherit}.send{width:44px;border:0;border-radius:50%;background:#fff;color:#000;font-weight:900;cursor:pointer}.request{margin:auto;max-width:430px;padding:28px;text-align:center;border:1px solid #292929;border-radius:22px;background:#111}.request h3{margin:0 0 8px}.request p{color:#999;line-height:1.5}.primary{border:0;border-radius:22px;background:#fff;color:#000;padding:11px 18px;font-weight:800;cursor:pointer}.notice{color:#ff9b9b;text-align:center;font-size:12px;padding:7px}.typing{height:20px;padding:0 16px;color:#888;font-size:11px}@media(min-width:700px){.chat{border-left:1px solid #252525;border-right:1px solid #252525}}
</style></head><body><main class="wrap"><header class="head"><button class="back" onclick="history.back()">‹</button><div class="title">Messages</div></header><input id="search" class="search" placeholder="Search messages" autocomplete="off"><section id="list"></section></main><section id="chat" class="chat"><header class="chathead"><button class="back" onclick="closeChat()">‹</button><div class="avatar" id="chatAvatar">?</div><div class="chatinfo"><div class="chatname" id="chatName">Chat</div><div class="handle" id="chatHandle"></div></div><div class="tools"><button class="tool" onclick="closeChat()">×</button></div></header><section id="msgs" class="msgs"></section><div id="typing" class="typing"></div><div id="notice" class="notice"></div><form id="composer" class="composer"><input id="input" class="input" maxlength="2000" placeholder="Message…" autocomplete="off"><button class="send">➤</button></form></section><script>
const API=window.REELO_API||'https://reelo-43rv.onrender.com',token=localStorage.getItem('reelo_token')||'';let items=[],current=null,typingTimer;const $=id=>document.getElementById(id),H=()=>({Authorization:'Bearer '+token,'Content-Type':'application/json'}),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])),initial=s=>(String(s||'?').replace(/^@/,'')[0]||'?').toUpperCase(),ago=x=>{const d=Date.parse(String(x||'').replace(' ','T')+'Z');if(!d)return '';const sec=(Date.now()-d)/1000;return sec<60?'now':sec<3600?Math.floor(sec/60)+'m':sec<86400?Math.floor(sec/3600)+'h':new Date(d).toLocaleDateString()};
async function load(){if(!token){$('list').innerHTML='<div class="empty">Log in to use Messages.<br><br><button class="primary" onclick="location.href=\'/index.html?auth=login\'">Log in</button></div>';return}try{const r=await fetch(API+'/api/messages?limit=100',{headers:H()}),d=await r.json();if(!r.ok)throw Error(d.detail||'Could not load messages');items=d.items||[];render(items)}catch(e){$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function render(arr){$('list').innerHTML=arr.length?arr.map(x=>'<div class="row" data-id="'+esc(x.user_id)+'"><div class="avatar">'+initial(x.username)+'</div><div class="meta"><div class="name">'+esc(x.display_name||x.username)+'</div><div class="preview">'+esc(x.last_message||'Start a conversation')+'</div></div><div><div class="time">'+ago(x.last_message_at)+'</div>'+(x.unread_count?'<div class="unread">'+(x.unread_count>99?'99+':x.unread_count)+'</div>':'')+'</div></div>').join(''):'<div class="empty">No conversations yet.<br>Open a creator profile and tap Message.</div>';document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{const x=items.find(v=>String(v.user_id)===r.dataset.id);if(x)openChat(x)})}
async function openChat(x){current=x;$('chatName').textContent=x.display_name||x.username;$('chatHandle').textContent='@'+x.username;$('chatAvatar').textContent=initial(x.username);$('chat').classList.add('show');$('notice').textContent='';if(!x.conversation_id){await requestCard();return}$('composer').style.display='flex';await loadMessages()}
async function requestCard(){const r=await fetch(API+'/api/message-requests?kind=sent&limit=100',{headers:H()}),d=await r.json().catch(()=>({items:[]}));const pending=(d.items||[]).find(v=>String(v.user_id)===String(current.user_id));$('msgs').innerHTML='<div class="request"><h3>'+(pending?'Request pending':'Start a conversation')+'</h3><p>'+(pending?'Your message request is waiting for a response.':'Your first message will be sent as a message request.')+'</p>'+(!pending?'<button class="primary" onclick="sendRequest()">Send message</button>':'')+'</div>';$('composer').style.display='none'}
async function sendRequest(){const body=prompt('Write your message:','Hi! 👋');if(!body?.trim())return;const r=await fetch(API+'/api/messages/'+encodeURIComponent(current.user_id),{method:'POST',headers:H(),body:JSON.stringify({body:body.trim()})}),d=await r.json();if(!r.ok){$('notice').textContent=d.detail||'Could not send request';return}current.conversation_id=d.conversation_id||null;if(current.conversation_id){$('composer').style.display='flex';await loadMessages()}else await requestCard();load()}
async function loadMessages(){if(!current?.conversation_id)return;const r=await fetch(API+'/api/messages/'+encodeURIComponent(current.conversation_id)+'/messages?limit=100',{headers:H()}),d=await r.json().catch(()=>({items:[]}));if(!r.ok){$('notice').textContent=d.detail||'Could not load chat';return}const me=localStorage.getItem('reelo_user_id')||'';$('msgs').innerHTML=d.items?.length?d.items.map(m=>'<div class="bubble '+(String(m.sender_id)===String(me)?'mine':'theirs')+'">'+esc(m.body)+'<div class="stamp">'+new Date(String(m.created_at).replace(' ','T')+'Z').toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</div></div>').join(''):'<div class="empty">Say hello 👋</div>';$('msgs').scrollTop=$('msgs').scrollHeight;fetch(API+'/api/messages/'+encodeURIComponent(current.conversation_id)+'/read',{method:'POST',headers:H()}).catch(()=>{})}
$('composer').onsubmit=async e=>{e.preventDefault();const body=$('input').value.trim();if(!body||!current)return;const r=await fetch(API+'/api/messages/'+encodeURIComponent(current.user_id),{method:'POST',headers:H(),body:JSON.stringify({body})}),d=await r.json();if(!r.ok){$('notice').textContent=d.detail||'Message could not be sent';return}$('input').value='';current.conversation_id=d.conversation_id||current.conversation_id;await loadMessages()};$('search').oninput=e=>{const q=e.target.value.toLowerCase().trim();render(q?items.filter(x=>(x.username+' '+(x.display_name||'')+' '+(x.last_message||'')).toLowerCase().includes(q)):items)};function closeChat(){$('chat').classList.remove('show');current=null;$('composer').style.display='flex';load()}window.closeChat=closeChat;load();setInterval(()=>{if(current?.conversation_id)loadMessages();else load()},7000);
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>REelo Replay</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font:14px Inter,system-ui,sans-serif}.wrap{max-width:760px;margin:auto;min-height:100vh;background:#101010}.top{height:60px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #292929}.back{border:0;background:none;color:#fff;font-size:25px;margin-right:12px}.content{padding:18px}.video{width:100%;max-height:72vh;background:#000;border-radius:14px}.card{margin-top:14px;background:#171717;border:1px solid #292929;border-radius:14px;padding:14px}.muted{color:#999}.error{color:#ff8f8f}.spinner{padding:35px;text-align:center;color:#aaa}</style></head><body><main class="wrap"><header class="top"><button class="back" onclick="history.back()">‹</button><b>REelo Replay</b></header><section class="content"><div id="state" class="spinner">Loading replay…</div><div id="player" style="display:none"><video id="video" class="video" controls playsinline preload="metadata"></video><div class="card"><b id="title">LIVE Replay</b><div id="meta" class="muted" style="margin-top:7px"></div></div></div></section></main><script>const API=window.REELO_API||'http://localhost:8000';const p=new URLSearchParams(location.search),room=encodeURIComponent(p.get('room')||'');const $=id=>document.getElementById(id);function fmt(n){if(!n)return '';n=Number(n);return n<60?`${n}s`:`${Math.floor(n/60)}m ${n%60}s`}async function load(){if(!room){$('state').textContent='Replay room is missing.';return}try{const r=await fetch(`${API}/api/live/v2/${room}/replay`),d=await r.json();if(!r.ok)throw Error(d.detail||'Unable to load replay');const x=d.replay;if(!x){$('state').textContent='No replay is available for this LIVE.';return}if(x.status==='processing'||x.status==='recording'){ $('state').textContent='Replay is still processing. Please try again shortly.';setTimeout(load,5000);return}if(x.status==='failed'){$('state').innerHTML='<span class="error">Replay processing failed.</span>';return}if(x.status!=='ready'||!x.media_url){$('state').textContent='Replay is not ready yet.';return}$('state').style.display='none';$('player').style.display='block';$('video').src=x.media_url;$('meta').textContent=[x.duration_seconds?fmt(x.duration_seconds):'',x.bytes?`${Math.round(x.bytes/1048576)} MB`:''].filter(Boolean).join(' · ')||'Recorded LIVE replay';}catch(e){$('state').textContent=e.message||'Replay unavailable.'}}load();</script></body></html>

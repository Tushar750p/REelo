<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report · REelo</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font:15px Inter,system-ui,sans-serif;min-height:100vh}.wrap{max-width:520px;margin:auto;padding:24px 18px}.top{display:flex;align-items:center;gap:14px;margin-bottom:28px}.back{border:0;background:#191919;color:#fff;border-radius:50%;width:40px;height:40px;font-size:24px}.top h1{font-size:22px;margin:0}.card{background:#121212;border:1px solid #292929;border-radius:18px;padding:18px}.sub{color:#999;line-height:1.45;margin:6px 0 20px}.reason{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid #292929;background:#181818;color:#fff;padding:15px;border-radius:12px;margin:9px 0;text-align:left;cursor:pointer}.reason:hover{background:#202020}.reason span:last-child{color:#777}.other{display:none;margin-top:10px}.other.show{display:block}.other textarea{width:100%;min-height:90px;resize:vertical;background:#181818;color:#fff;border:1px solid #333;border-radius:12px;padding:12px;outline:none}.submit{width:100%;margin-top:18px;border:0;border-radius:12px;padding:13px;background:#fff;color:#000;font-weight:800;cursor:pointer}.submit:disabled{opacity:.5;cursor:not-allowed}.notice{display:none;text-align:center;padding:28px 10px}.notice.show{display:block}.check{font-size:42px}.muted{color:#888;font-size:13px}.error{color:#ff8f8f;margin-top:12px;display:none}.error.show{display:block}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="history.length>1?history.back():location.href='index.html'">‹</button><h1>Report</h1></div><section id="form" class="card"><p class="sub">Help keep REelo safe. Choose the reason that best describes the issue.</p><div id="reasons"></div><div id="other" class="other"><textarea id="details" maxlength="500" placeholder="Tell us a little more (optional)…"></textarea></div><button id="submit" class="submit" disabled onclick="submitReport()">Submit report</button><div id="error" class="error"></div><p class="muted">Reports are private and reviewed by REelo moderation.</p></section><section id="done" class="card notice"><div class="check">✓</div><h2>Report submitted</h2><p class="sub">Thanks for helping keep the community safe. We’ll review the report.</p><button class="submit" onclick="history.length>1?history.back():location.href='index.html'">Done</button></section></main><script>const API=window.REELO_API||'http://localhost:8000';const token=localStorage.getItem('reelo_token')||'';const params=new URLSearchParams(location.search);const targetType=(params.get('target_type')||'video').toLowerCase();const targetId=params.get('target_id')||params.get('video_id')||'';let selected='';const reasons=[['spam','Spam'],['harassment','Harassment or bullying'],['unsafe','Unsafe or harmful content'],['nudity','Nudity or sexual content'],['copyright','Copyright issue'],['other','Something else']];function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('reasons').innerHTML=reasons.map(([v,t])=>`<button class="reason" data-reason="${esc(v)}" onclick="choose('${v}')"><span>${esc(t)}</span><span>›</span></button>`).join('')}function choose(v){selected=v;document.querySelectorAll('.reason').forEach(b=>b.style.borderColor=b.dataset.reason===v?'#fff':'#292929');document.getElementById('other').classList.toggle('show',v==='other');document.getElementById('submit').disabled=!targetId}async function submitReport(){if(!token)return fail('Please log in to report content.');if(!targetId)return fail('This report link is missing its target.');const btn=document.getElementById('submit');btn.disabled=true;btn.textContent='Submitting…';try{const body={target_type:targetType,target_id:targetId,reason:selected,details:document.getElementById('details').value.trim()};const r=await fetch(API+'/api/moderation/reports',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Could not submit report');document.getElementById('form').style.display='none';document.getElementById('done').classList.add('show')}catch(e){fail(e.message||'Could not submit report');btn.disabled=false;btn.textContent='Submit report'}}function fail(msg){const e=document.getElementById('error');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3500)}render();</script></body></html>

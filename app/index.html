flex-end}.auth.show{display:flex}.auth-card{width:100%;background:#101010;border:1px solid #2b2b2b;border-radius:24px 24px 0 0;padding:24px 20px calc(22px + env(safe-area-inset-bottom))}.auth-title{font-size:26px;margin:0 0 5px}.auth-sub{color:#999}.auth-card label{display:block;color:#bbb;font-size:12px;font-weight:700;margin:12px 0 7px}.close{position:absolute;right:18px;top:15px;border:0;background:#222;color:#fff;width:34px;height:34px;border-radius:50%}.switch{border:0;background:none;color:#fff;margin-top:15px;width:100%}.profile-card{text-align:center;padding:25px 0}.stats{display:flex;justify-content:center;gap:32px;margin:20px}.stats b{display:block;font-size:18px}.stats span{font-size:12px;color:#999}.edit-form{display:none;text-align:left}.edit-form.show{display:block}.comments{position:absolute;inset:0;background:#0008;z-index:80;display:none;align-items:flex-end}.comments.show{display:flex}.comment-box{width:100%;height:70%;background:#111;border-radius:22px 22px 0 0;display:flex;flex-direction:column}.comment-head{padding:17px 18px;border-bottom:1px solid #292929;display:flex;align-items:center;justify-content:space-between}.comment-head b{font-size:16px}.comment-list{flex:1;overflow:auto;padding:8px 18px}.comment{display:flex;gap:10px;padding:12px 0;align-items:flex-start}.comment .mini{width:34px;height:34px;flex:none;border-radius:50%;background:#ddd;color:#111;display:grid;place-items:center;font-weight:800}.comment-body{flex:1;min-width:0}.comment-top{display:flex;align-items:center;gap:8px}.comment-menu{margin-left:auto;border:0;background:none;color:#777;font-size:20px;padding:0 2px;cursor:pointer}.comment-body b{font-size:13px}.comment-body p{margin:4px 0;color:#ddd;line-height:1.35;word-break:break-word}.comment-time{font-size:11px;color:#777}.comment-form{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #292929}.comment-form input{flex:1;border:1px solid #333;background:#202020;color:#fff;border-radius:20px;padding:11px 14px;outline:0}.comment-form button{border:0;background:#fff;color:#000;border-radius:20px;padding:0 16px;font-weight:800}.empty{color:#777;text-align:center;padding:40px 0}.loading{opacity:.6}.report-sheet{position:absolute;inset:0;background:#0008;z-index:90;display:none;align-items:flex-end}.report-sheet.show{display:flex}.report-card{width:100%;background:#111;border:1px solid #2b2b2b;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:78%;overflow:auto}.report-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.report-head b{font-size:18px}.report-reason{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;background:#181818;color:#fff;border:1px solid #2b2b2b;border-radius:12px;padding:14px;margin-top:8px}.report-reason span{color:#999}.report-detail{margin-top:12px;display:none}.report-detail.show{display:block}.report-detail textarea{min-height:90px;resize:vertical}.report-note{color:#888;font-size:12px;line-height:1.4;margin:12px 2px}.danger{color:#ffb4b4!important}@media(min-width:700px){.shell{box-shadow:0 0 0 1px #222,0 20px 70px #000}}</style></head><body><div class="shell"><div id="toast" class="toast"></div><header class="header"><div class="brand">REelo</div><div class="tabs"><button id="forBtn" class="active" onclick="setTab('For You')">For You</button><button id="followingBtn" onclick="setTab('Following')">Following</button></div><button class="search-btn" onclick="location.href='search.html'">⌕</button></header><main id="feed" class="feed"></main><button class="plus" onclick="toggleUpload()">＋</button><nav class="bottom"><button onclick="closePanels()"><span class="icon">⌂</span>Home</button><button onclick="location.href='search.html'"><span class="icon">⌕</span>Discover</button><button onclick="toggleUpload()"><span class="icon">◎</span>Create</button><button onclick="location.href='activity.html'"><span class="icon">♡</span>Activity</button><button onclick="openPanel('profilePanel')"><span class="icon">◉</span>Profile</button></nav><section id="searchPanel" class="panel"><div class="panel-head"><button class="back" onclick="closePanels()">‹</button><h2>Discover</h2></div><input id="searchInput" class="searchbox" placeholder="Search creators, videos, hashtags…" oninput="search(this.value)"><div id="results"></div></section><section id="profilePanel" class="panel"><div class="panel-head"><button class="back" onclick="closePanels()">‹</button><h2>Profile</h2></div><div class="profile-card"><div id="profileAvatar" class="avatar" style="margin:auto;width:72px;height:72px;font-size:25px">R</div><h2 id="profileName">Guest</h2><div id="profileUsername" style="color:#999">Login to personalize your profile</div><p id="profileBio">Create. Watch. Connect.</p><div class="stats"><div><b id="followers">0</b><span>Followers</span></div><div><b id="following">0</b><span>Following</span></div></div><div id="profileActions"></div><div id="editForm" class="edit-form"><label>Display name</label><input id="editName" class="field" maxlength="80"><label>Bio</label><textarea id="editBio" class="field" rows="3" maxlength="160"></textarea><button class="primary" style="margin-top:15px" onclick="saveProfile()">Save changes</button><button class="secondary" style="margin-top:9px" onclick="toggleEdit()">Cancel</button></div></div></section><div id="uploadSheet" class="upload-sheet"><b>Create a video</b><input id="videoFile" type="file" accept="video/*"><input id="caption" type="text" placeholder="Write a caption…"><button class="primary" onclick="submitUpload()">Post video</button></div><div id="auth" class="auth"><div class="auth-card"><button class="close" onclick="closeAuth()">×</button><h2 id="authTitle" class="auth-title">Welcome back</h2><p id="authSub" class="auth-sub">Log in to like, follow, comment and post.</p><label>Username</label><input id="authUser" class="field" autocomplete="username" placeholder="username"><div id="displayWrap" style="display:none"><label>Display name</label><input id="authDisplay" class="field" autocomplete="name" placeholder="Your name"></div><label>Password</label><input id="authPass" class="field" type="password" placeholder="••••••••"><button class="primary" style="margin-top:18px" onclick="submitAuth()">Continue</button><button id="authSwitch" class="switch" onclick="switchAuth()">New here? Create an account</button></div></div><section id="comments" class="comments"><div class="comment-box"><div class="comment-head"><b id="commentTitle">Comments</b><button class="back" onclick="closeComments()">×</button></div><div id="commentList" class="comment-list"></div><form class="comment-form" onsubmit="postComment(event)"><input id="commentInput" maxlength="500" placeholder="Add a comment…" autocomplete="off"><button id="commentSend">Post</button></form></div></section><section id="reportSheet" class="report-sheet" onclick="if(event.target===this)closeReport()"><div class="report-card"><div class="report-head"><b>Report</b><button class="back" onclick="closeReport()">×</button></div><div id="reportReasons"></div><div id="reportDetail" class="report-detail"><textarea id="reportDetails" class="field" maxlength="500" placeholder="Tell us more (optional)…"></textarea></div><p class="report-note">Reports are private. REelo will review the content and take action when needed.</p></div></section></div><script>const API=window.REELO_API||'http://localhost:8000';let token=localStorage.getItem('reelo_token')||'',me=null,authMode='login',feedItems=[],commentVideoId=null,commentOffset=0,commentTotal=0,currentTab='For You',reportVideoId=null,reportCommentId=null,reportTargetType='video',reportReason=null;const demo=[{id:'demo-1',user_id:'demo-user',username:'reelo_creator',display_name:'REelo Creator',caption:'Build your vibe. Share your story. 🚀',filename:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',likes:12400,comments:321,views:85000,liked:0},{id:'demo-2',user_id:'demo-user',username:'futuredaily',display_name:'Future Daily',caption:'Create something people remember.',filename:'https://www.w3schools.com/html/mov_bbb.mp4',likes:8700,comments:142,views:54000,liked:0}];const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])}function fmt(n){n=Number(n||0);return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n)}function headers(json=false){const h={};if(token)h.Authorization='Bearer '+token;if(json)h['Content-Type']='application/json';return h}function videoUrl(v){return v.filename?.startsWith('http')?v.filename:API+(v.filename?.startsWith('/')?'':'/')+v.filename}async function loadMe(){if(!token)return;try{const r=await fetch(API+'/api/me',{headers:headers()});if(!r.ok)throw Error();me=(await r.json()).user;renderProfile()}catch(e){logout(false)}}async function loadFeed(){const mode=currentTab==='Following'?'following':'for_you';if(mode==='following'&&!token){feedItems=[];render();return}try{const r=await fetch(API+'/api/feed?mode='+mode,{headers:headers()});if(!r.ok)throw Error();const d=await r.json();feedItems=d.items?.length?d.items:mode==='for_you'?demo:[]}catch(e){feedItems=mode==='for_you'?demo:[]}render()}function render(){const el=$('feed');if(!feedItems.length){el.innerHTML=`<div class="empty" style="padding-top:42vh">${currentTab==='Following'?'Follow creators to build your Following feed.':'No videos available right now.'}</div>`;return}el.innerHTML=feedItems.map(v=>`<article class="video-card" data-id="${esc(v.id)}"><video src="${esc(videoUrl(v))}" loop playsinline muted preload="metadata"></video><div class="gradient"></div><div class="info"><div class="creator"><div class="avatar">${esc((v.username||'r')[0]).toUpperCase()}</div><span class="handle">@${esc(v.username||'creator')}</span>${me&&me.id!==v.user_id?`<button class="follow" onclick="follow('${esc(v.user_id)}')">Follow</button>`:''}</div><div class="caption">${esc(v.caption)}</div><div class="sound">♫ Original sound · REelo</div></div><div class="actions"><button class="act" onclick="likeVideo('${esc(v.id)}',this)">${v.liked?'♥':'♡'}<small>${fmt(v.likes)}</small></button><button class="act" onclick="openComments('${esc(v.id)}')">💬<small>${fmt(v.comments)}</small></button><button class="act" onclick="shareVideo('${esc(v.id)}')">↗<small>Share</small></button><button class="act" onclick="saveVideo(this)">🔖<small>Save</small></button><button class="act more" aria-label="More options" onclick="openReport('${esc(v.id)}')">⋯</button></div><div style="position:absolute;inset:0;z-index:2" ondblclick="likeVideo('${esc(v.id)}',this)"></div></article>`).join('');observeVideos()}function observeVideos(){document.querySelectorAll('.video-card').forEach(card=>{const v=card.querySelector('video');new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){v.play().catch(()=>{});sendWatch(card.dataset.id,'view')}else v.pause()}),{threshold:.72}).observe(card)})}async function likeVideo(id,btn){if(!token){openAuth('login');return}try{const r=await fetch(API+`/api/videos/${id}/like`,{method:'POST',headers:headers()});if(!r.ok)throw Error();const d=await r.json();btn.innerHTML=(d.liked?'♥':'♡')+`<small>${fmt(d.likes)}</small>`}catch(e){toast('Like failed — try again')}}async function follow(id){if(!token){openAuth('login');return}try{const r=await fetch(API+`/api/users/${id}/follow`,{method:'POST',headers:headers()});if(!r.ok)throw Error();const d=await r.json();toast(d.action==='follow'?'Following creator':'Unfollowed creator');await loadMe();await loadFeed()}catch(e){toast('Could not update follow')}}async function openComments(id){if(!token){openAuth('login');return}commentVideoId=id;commentOffset=0;commentTotal=0;$('comments').classList.add('show');$('commentList').innerHTML='<div class="empty loading">Loading comments…</div>';$('commentInput').focus();await loadComments(true)}async function loadComments(reset=false){if(reset){commentOffset=0;$('commentList').innerHTML=''}try{const r=await fetch(API+`/api/videos/${encodeURIComponent(commentVideoId)}/comments?limit=30&offset=${commentOffset}`,{headers:headers()});if(!r.ok)throw Error();const d=await r.json();commentTotal=d.total;const html=d.items.map(c=>`<div class="comment"><div class="mini">${esc((c.username||'u')[0]).toUpperCase()}</div><div class="comment-body"><div class="comment-top"><b>@${esc(c.username)}</b><button class="comment-menu" aria-label="Report comment" onclick="openCommentReport('${esc(c.id)}')">⋯</button></div><p>${esc(c.body)}</p><span class="comment-time">${timeAgo(c.created_at)}</span></div></div>`).join('');if(reset)$('commentList').innerHTML=html||'<div class="empty">No comments yet. Be the first.</div>';else $('commentList').insertAdjacentHTML('beforeend',html);commentOffset+=d.items.length;$('commentTitle').textContent=`${fmt(commentTotal)} comments`}catch(e){$('commentList').innerHTML='<div class="empty">Comments unavailable. Try again.</div>'}}function timeAgo(s){if(!s)return'';const t=Date.parse(s.replace(' ','T')+'Z');if(Number.isNaN(t))return'';const m=Math.max(0,Math.floor((Date.now()-t)/60000));return m<1?'now':m<60?m+'m':m<1440?Math.floor(m/60)+'h':Math.floor(m/1440)+'d'}async function postComment(e){e.preventDefault();if(!token)return openAuth('login');const input=$('commentInput'),body=input.value.trim();if(!body)return;const btn=$('commentSend');btn.disabled=true;btn.textContent='…';try{const r=await fetch(API+`/api/videos/${encodeURIComponent(commentVideoId)}/comments`,{method:'POST',headers:headers(true),body:JSON.stringify({body})});if(!r.ok){const d=await r.json();throw Error(d.detail||'Comment failed')}input.value='';await loadComments(true);toast('Comment posted')}catch(e){toast(e.message||'Comment failed')}finally{btn.disabled=false;btn.textContent='Post'}}$('commentList').addEventListener('scroll',()=>{const x=$('commentList');if(x.scrollTop+x.clientHeight>=x.scrollHeight-80&&commentOffset<commentTotal)loadComments(false)});function closeComments(){$('comments').classList.remove('show');commentVideoId=null}function shareVideo(id){navigator.clipboard?.writeText(location.href+'#video='+id);toast('Video link copied')}function saveVideo(btn){btn.innerHTML='🔖<small>Saved</small>';toast('Saved to your collection')}async function sendWatch(id,action){try{await fetch(API+`/api/events/watch?video_id=${encodeURIComponent(id)}&action=${action}`,{method:'POST',headers:headers()})}catch(e){}}function setTab(t){currentTab=t;$('forBtn').classList.toggle('active',t==='For You');$('followingBtn').classList.toggle('active',t==='Following');loadFeed()}function openPanel(id){closePanels();$(id).classList.add('show');if(id==='profilePanel')renderProfile();if(id==='searchPanel')setTimeout(()=>$('searchInput').focus(),50)}function closePanels(){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('show'));$('uploadSheet').classList.remove('show')}function toggleUpload(){if(!token){openAuth('login');return}$('uploadSheet').classList.toggle('show')}async function submitUpload(){const f=$('videoFile').files[0];if(!f)return toast('Select a video first');if(f.size>100*1024*1024)return toast('Video must be 100 MB or smaller');const fd=new FormData();fd.append('file',f);fd.append('caption',$('caption').value);try{const r=await fetch(API+'/api/videos/upload',{method:'POST',headers:headers(),body:fd});if(!r.ok){const d=await r.json();throw Error(d.detail||'Upload failed')}toast('Video posted');$('uploadSheet').classList.remove('show');$('videoFile').value='';$('caption').value='';loadFeed()}catch(e){toast(e.message||'Upload failed')}}let searchTimer;function search(q){clearTimeout(searchTimer);if(!q.trim())return $('results').innerHTML='';searchTimer=setTimeout(async()=>{try{const r=await fetch(API+'/api/search?q='+encodeURIComponent(q));const d=await r.json();$('results').innerHTML=d.items.length?d.items.map(v=>`<div class="result"><b>@${esc(v.username)}</b>${esc(v.caption)}</div>`).join(''):'<div class="result">No results found.</div>'}catch(e){$('results').innerHTML='<div class="result">Search unavailable.</div>'}},250)}function renderProfile(){if(!me){$('profileName').textContent='Guest';$('profileUsername').textContent='Login to personalize your profile';$('profileBio').textContent='Create. Watch. Connect.';$('followers').textContent='0';$('following').textContent='0';$('profileActions').innerHTML='<button class="primary" onclick="openAuth(\'login\')">Log in</button>';return}$('profileName').textContent=me.display_name;$('profileUsername').textContent='@'+me.username;$('profileBio').textContent=me.bio||'No bio yet.';$('followers').textContent=fmt(me.followers);$('following').textContent=fmt(me.following);$('profileAvatar').textContent=(me.display_name||me.username)[0].toUpperCase();$('editName').value=me.display_name;$('editBio').value=me.bio||'';$('profileActions').innerHTML='<button class="primary" onclick="toggleEdit()">Edit profile</button><button class="secondary" style="margin-top:9px" onclick="logout()">Log out</button>'}function toggleEdit(){if(!me)return;$('editForm').classList.toggle('show');$('profileActions').style.display=$('editForm').classList.contains('show')?'none':'block'}async function saveProfile(){try{const r=await fetch(API+'/api/me',{method:'PATCH',headers:headers(true),body:JSON.stringify({display_name:$('editName').value,bio:$('editBio').value})});if(!r.ok){const d=await r.json();throw Error(d.detail||'Could not save')}me=(await r.json()).user;toggleEdit();renderProfile();toast('Profile updated')}catch(e){toast(e.message||'Profile update failed')}}function openAuth(mode='login'){$('auth').classList.add('show');authMode=mode;$('authTitle').textContent=mode==='login'?'Welcome back':'Create your REelo account';$('authSub').textContent=mode==='login'?'Log in to like, follow, comment and post.':'Join REelo and start sharing your world.';$('displayWrap').style.display=mode==='register'?'block':'none';$('authSwitch').textContent=mode==='login'?'New here? Create an account':'Already have an account? Log in';$('authUser').focus()}function closeAuth(){$('auth').classList.remove('show')}function switchAuth(){openAuth(authMode==='login'?'register':'login')}async function submitAuth(){const username=$('authUser').value.trim(),password=$('authPass').value,display_name=$('authDisplay').value.trim();if(!username||!password)return toast('Enter username and password');try{const r=await fetch(API+'/api/auth/'+(authMode==='login'?'login':'register'),{method:'POST',headers:headers(true),body:JSON.stringify({username,password,display_name:display_name||undefined})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Authentication failed');token=d.token;localStorage.setItem('reelo_token',token);me=d.user;closeAuth();renderProfile();loadFeed();toast(authMode==='login'?'Welcome back!':'Account created successfully')}catch(e){toast(e.message||'Authentication failed')}}function logout(show=true){token='';me=null;localStorage.removeItem('reelo_token');closePanels();renderProfile();if(show)toast('You have been logged out')}const reportReasons=[['spam','Spam or misleading content'],['harassment','Harassment or bullying'],['unsafe','Unsafe or harmful content'],['nudity','Nudity or sexual content'],['copyright','Copyright infringement'],['other','Something else']];function openReport(id){if(!token){openAuth('login');return}reportTargetType='video';reportVideoId=id;reportCommentId=null;reportReason=null;openReportSheet()}function openCommentReport(id){if(!token){openAuth('login');return}reportTargetType='comment';reportCommentId=id;reportVideoId=null;reportReason=null;openReportSheet()}function openReportSheet(){$('reportDetails').value='';$('reportDetail').classList.remove('show');$('reportReasons').innerHTML=reportReasons.map(([value,label])=>`<button class="report-reason" onclick="selectReportReason('${value}')"><span>${label}</span><span>›</span></button>`).join('');$('reportSheet').classList.add('show')}function selectReportReason(reason){reportReason=reason;$('reportReasons').innerHTML=`<button class="report-reason" onclick="submitReport()"><span>Submit report</span><span>✓</span></button><button class="report-reason" onclick="${reportTargetType==='comment'?`openCommentReport('${esc(reportCommentId)}')`:`openReport('${esc(reportVideoId)}')`}"><span>Change reason</span><span>‹</span></button>`;$('reportDetail').classList.toggle('show',reason==='other');if(reason!=='other')submitReport()}async function submitReport(){const targetId=reportTargetType==='comment'?reportCommentId:reportVideoId;if(!targetId||!reportReason)return;const body={target_type:reportTargetType,target_id:targetId,reason:reportReason};const details=$('reportDetails').value.trim();if(details)body.details=details;try{const r=await fetch(API+'/api/moderation/reports',{method:'POST',headers:headers(true),body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.detail||'Could not submit report');closeReport();toast('Report submitted. Thank you.')}catch(e){toast(e.message||'Report failed')}}function closeReport(){reportVideoId=null;reportCommentId=null;reportTargetType='video';reportReason=null;$('reportSheet').classList.remove('show')}renderProfile();loadMe().finally(loadFeed);</script></body></html>

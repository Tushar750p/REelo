<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>REelo</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font:15px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}.shell{height:100dvh;max-width:520px;margin:auto;background:#000;position:relative;overflow:hidden}.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.video-card{height:100dvh;min-height:620px;position:relative;scroll-snap-align:start;background:#111;overflow:hidden}.video-card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}.gradient{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),transparent 28%,transparent 55%,rgba(0,0,0,.82) 100%);pointer-events:none}.header{position:absolute;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;z-index:5;display:flex;align-items:center;justify-content:space-between}.brand{font-size:25px;font-weight:900;letter-spacing:-1.2px}.tabs{display:flex;gap:22px;align-items:center}.tabs button{border:0;background:none;color:#aaa;font-weight:700;padding:7px 0}.tabs button.active{color:#fff;border-bottom:2px solid #fff}.search-btn{border:0;background:rgba(0,0,0,.35);color:#fff;border-radius:50%;width:40px;height:40px;font-size:20px}.info{position:absolute;left:17px;right:92px;bottom:88px;z-index:4}.creator{display:flex;align-items:center;gap:9px}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#fff,#555);display:grid;place-items:center;color:#000;font-weight:900}.handle{font-weight:800}.follow{margin-left:4px;background:#fff;color:#000;border:0;border-radius:7px;padding:5px 10px;font-weight:800;font-size:12px}.caption{margin:10px 0 8px;line-height:1.4;font-weight:500}.sound{display:flex;align-items:center;gap:8px;font-size:13px}.actions{position:absolute;right:13px;bottom:88px;z-index:4;display:flex;flex-direction:column;align-items:center;gap:15px}.act{border:0;background:none;color:#fff;text-shadow:0 1px 5px #000;padding:0;cursor:pointer;font-size:29px;display:flex;flex-direction:column;align-items:center;gap:2px}.act small{font-size:11px;font-weight:700}.plus{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);z-index:8;width:52px;height:36px;border-radius:10px;border:0;background:#fff;color:#000;font-size:27px;font-weight:400;box-shadow:0 0 0 2px #000}.bottom{position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(transparent,rgba(0,0,0,.94));z-index:7;display:flex;align-items:flex-end;justify-content:space-around;padding:0 4px 9px}.bottom button{border:0;background:none;color:#aaa;font-size:10px;line-height:1.35}.bottom button.active{color:#fff}.bottom .icon{font-size:22px;display:block}.panel{position:absolute;inset:0;background:#080808;z-index:20;display:none;padding:calc(18px + env(safe-area-inset-top)) 16px 20px;overflow:auto}.panel.show{display:block}.panel-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}.back{border:0;background:none;color:#fff;font-size:26px}.panel h2{margin:0;font-size:22px}.searchbox,.field{width:100%;padding:14px 16px;border:1px solid #333;border-radius:12px;background:#171717;color:#fff;outline:none}.result{padding:14px 0;border-bottom:1px solid #252525}.result b{display:block;margin-bottom:4px}.upload-sheet{position:absolute;left:12px;right:12px;bottom:76px;background:#171717;border:1px solid #333;border-radius:18px;padding:18px;z-index:30;display:none}.upload-sheet.show{display:block}.upload-sheet input{width:100%;margin:12px 0;background:#222;color:#fff;padding:10px;border-radius:9px;border:1px solid #333}.primary{width:100%;border:0;border-radius:10px;padding:12px;background:#fff;color:#000;font-weight:800;cursor:pointer}.secondary{width:100%;border:1px solid #444;border-radius:10px;padding:11px;background:#171717;color:#fff;font-weight:700;cursor:pointer}.toast{position:absolute;top:75px;left:16px;right:16px;background:#222;border:1px solid #333;padding:12px 14px;border-radius:12px;z-index:40;display:none}.heart{animation:pop .18s ease}@keyframes pop{50%{transform:scale(1.35)}}.auth{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);z-index:60;display:none;align-items:flex-end}.auth.show{display:flex}.auth-card{width:100%;background:#101010;border:1px solid #2b2b2b;border-radius:24px 24px 0 0;padding:24px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.5)}.auth-title{font-size:26px;font-weight:900;margin:0 0 5px}.auth-sub{color:#999;margin:0 0 20px}.auth-card label{display:block;color:#bbb;font-size:12px;font-weight:700;margin:12px 0 7px}.auth-card .field{padding:12px 13px}.auth-actions{display:flex;gap:10px;margin-top:18px}.auth-actions button{flex:1}.switch{border:0;background:none;color:#fff;margin-top:15px;width:100%;font-size:13px}.close{position:absolute;right:18px;top:15px;border:0;background:#222;color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px}.profile-card{text-align:center;padding:25px 0}.stats{display:flex;justify-content:center;gap:32px;margin:20px 0}.stats b{display:block;font-size:18px}.stats span{font-size:12px;color:#999}.edit-form{display:none;text-align:left}.edit-form.show{display:block}.edit-form label{display:block;color:#aaa;font-size:12px;font-weight:700;margin:13px 0 7px}@media(min-width:700px){.shell{box-shadow:0 0 0 1px #222,0 20px 70px #000}.bottom{border-radius:0}}</style></head><body><div class="shell"><div id="toast" class="toast"></div><header class="header"><div class="brand">REelo</div><div class="tabs"><button id="forBtn" class="active" onclick="setTab('For You')">For You</button><button id="followingBtn" onclick="setTab('Following')">Following</button></div><button class="search-btn" onclick="openPanel('searchPanel')">⌕</button></header><main id="feed" class="feed"></main><button class="plus" onclick="toggleUpload()">＋</button><nav class="bottom"><button class="active" onclick="closePanels()"><span class="icon">⌂</span>Home</button><button onclick="openPanel('searchPanel')"><span class="icon">⌕</span>Discover</button><button onclick="toggleUpload()"><span class="icon">◎</span>Create</button><button onclick="openAuth('login')"><span class="icon">♡</span>Activity</button><button onclick="openPanel('profilePanel')"><span class="icon">◉</span>Profile</button></nav><section id="searchPanel" class="panel"><div class="panel-head"><button class="back" onclick="closePanels()">‹</button><h2>Discover</h2></div><input id="searchInput" class="searchbox" placeholder="Search creators, videos, hashtags…" oninput="search(this.value)"><div id="results"></div></section><section id="profilePanel" class="panel"><div class="panel-head"><button class="back" onclick="closePanels()">‹</button><h2>Profile</h2></div><div class="profile-card"><div id="profileAvatar" class="avatar" style="margin:auto;width:72px;height:72px;font-size:25px">R</div><h2 id="profileName" style="margin:12px 0 4px">REelo Creator</h2><div id="profileUsername" style="color:#999">@reelo_creator</div><p id="profileBio">Create. Watch. Connect.</p><div class="stats"><div><b id="followers">0</b><span>Followers</span></div><div><b id="following">0</b><span>Following</span></div></div><div id="profileActions"><button class="primary" onclick="toggleEdit()">Edit profile</button><button class="secondary" style="margin-top:9px" onclick="logout()">Log out</button></div><div id="editForm" class="edit-form"><label>Display name</label><input id="editName" class="field" maxlength="80"><label>Bio</label><textarea id="editBio" class="field" rows="3" maxlength="160"></textarea><button class="primary" style="margin-top:15px" onclick="saveProfile()">Save changes</button><button class="secondary" style="margin-top:9px" onclick="toggleEdit()">Cancel</button></div></div></section><div id="uploadSheet" class="upload-sheet"><b>Create a video</b><input id="videoFile" type="file" accept="video/*"><input id="caption" type="text" placeholder="Write a caption…"><button class="primary" onclick="submitUpload()">Post video</button></div><div id="auth" class="auth"><div class="auth-card"><button class="close" onclick="closeAuth()">×</button><h2 id="authTitle" class="auth-title">Welcome back</h2><p id="authSub" class="auth-sub">Log in to like, follow, comment and post.</p><label>Username</label><input id="authUser" class="field" autocomplete="username" placeholder="username"><div id="displayWrap" style="display:none"><label>Display name</label><input id="authDisplay" class="field" autocomplete="name" placeholder="Your name"></div><label>Password</label><input id="authPass" class="field" type="password" autocomplete="current-password" placeholder="••••••••"><div class="auth-actions"><button class="primary" onclick="submitAuth()">Continue</button></div><button id="authSwitch" class="switch" onclick="switchAuth()">New here? Create an account</button></div></div></div><script>const API=window.REELO_API||'http://localhost:8000';let token=localStorage.getItem('reelo_token')||'',me=null,tab='For You',authMode='login',feedItems=[];const demo=[{id:'demo-1',user_id:'demo-user',username:'reelo_creator',display_name:'REelo Creator',caption:'Build your vibe. Share your story. 🚀',filename:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',likes:12400,comments:321,views:85000,liked:0},{id:'demo-2',user_id:'demo-user',username:'futuredaily',display_name:'Future Daily',caption:'Create something people remember.',filename:'https://www.w3schools.com/html/mov_bbb.mp4',likes:8700,comments:142,views:54000,liked:0}];function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function videoUrl(v){return v.filename?.startsWith('http')?v.filename:API+(v.filename?.startsWith('/')?'':'/')+v.filename}function headers(json=false){const h={};if(token)h.Authorization='Bearer '+token;if(json)h['Content-Type']='application/json';return h}async function loadMe(){if(!token)return;try{const r=await fetch(API+'/api/me',{headers:headers()});if(!r.ok)throw Error();me=(await r.json()).user;renderProfile()}catch(e){token='';localStorage.removeItem('reelo_token')}}async function loadFeed(){try{const r=await fetch(API+'/api/feed',{headers:headers()});if(!r.ok)throw Error();const d=await r.json();feedItems=d.items?.length?d.items:demo}catch(e){feedItems=demo}render()}function render(){const el=document.getElementById('feed');el.innerHTML=feedItems.map(v=>`<article class="video-card" data-id="${esc(v.id)}"><video src="${esc(videoUrl(v))}" loop playsinline muted preload="metadata"></video><div class="gradient"></div><div class="info"><div class="creator"><div class="avatar">${esc((v.username||'r')[0]).toUpperCase()}</div><span class="handle">@${esc(v.username||'creator')}</span>${me&&me.id!==v.user_id?`<button class="follow" onclick="follow('${esc(v.user_id)}')">Follow</button>`:''}</div><div class="caption">${esc(v.caption)}</div><div class="sound">♫ Original sound · REelo</div></div><div class="actions"><button class="act ${v.liked?'heart':''}" onclick="likeVideo('${esc(v.id)}',this)">${v.liked?'♥':'♡'}<small>${fmt(v.likes)}</small></button><button class="act" onclick="comments('${esc(v.id)}')">💬<small>${fmt(v.comments)}</small></button><button class="act" onclick="shareVideo('${esc(v.id)}')">↗<small>Share</small></button><button class="act" onclick="saveVideo(this)">🔖<small>Save</small></button></div><div class="tap" style="position:absolute;inset:0;z-index:2" ondblclick="likeVideo('${esc(v.id)}',this)"></div></article>`).join('');observeVideos()}function fmt(n){n=Number(n||0);return n>=1000000?(n/1e6).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'K':String(n)}function observeVideos(){document.querySelectorAll('.video-card').forEach(card=>{const v=card.querySelector('video');new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){v.play().catch(()=>{});sendWatch(card.dataset.id,'view')}else v.pause()}),{threshold:.72}).observe(card)})}async function likeVideo(id,btn){if(!token){openAuth('login');return}try{const r=await fetch(API+`/api/videos/${id}/like`,{method:'POST',headers:headers()});if(!r.ok)throw Error();const d=await r.json();btn.innerHTML=(d.liked?'♥':'♡')+`<small>${fmt(d.likes)}</small>`;btn.classList.toggle('heart',d.liked)}catch(e){toast('Like failed — try again')}}async function follow(id){if(!token){openAuth('login');return}const r=await fetch(API+`/api/users/${id}/follow`,{method:'POST',headers:headers()});toast(r.ok?'Following updated':'Could not update follow');if(r.ok)loadMe()}function comments(id){if(!token){openAuth('login');return}const text=prompt('Write a comment');if(!text)return;fetch(API+`/api/videos/${id}/comments`,{method:'POST',headers:headers(true),body:JSON.stringify({body:text})}).then(r=>toast(r.ok?'Comment posted':'Comment failed'))}function shareVideo(id){navigator.clipboard?.writeText(location.href+'#video='+id);toast('Video link copied')}function saveVideo(btn){btn.innerHTML='🔖<small>Saved</small>';toast('Saved to your collection')}async function sendWatch(id,action){try{await fetch(API+`/api/events/watch?video_id=${encodeURIComponent(id)}&action=${action}`,{method:'POST',headers:headers()})}catch(e){}}function setTab(t){tab=t;document.getElementById('forBtn').classList.toggle('active',t==='For You');document.getElementById('followingBtn').classList.toggle('active',t==='Following');toast(t==='Following'?'Following feed is ready for connected creators':'For You feed selected')}function openPanel(id){closePanels();document.getElementById(id).classList.add('show');if(id==='profilePanel')renderProfile();if(id==='searchPanel')setTimeout(()=>searchInput.focus(),50)}function closePanels(){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('show'));document.getElementById('uploadSheet').classList.remove('show')}function toggleUpload(){if(!token){openAuth('login');return}document.getElementById('uploadSheet').classList.toggle('show')}async function submitUpload(){const f=document.getElementById('videoFile').files[0];if(!f){toast('Select a video first');return}const fd=new FormData();fd.append('file',f);fd.append('caption',document.getElementById('caption').value);try{const r=await fetch(API+'/api/videos/upload',{method:'POST',headers:headers(),body:fd});toast(r.ok?'Video posted':'Upload failed');if(r.ok){toggleUpload();loadFeed()}}catch(e){toast('Upload failed — check connection')}}let searchTimer;function search(q){clearTimeout(searchTimer);if(!q.trim()){results.innerHTML='';return}searchTimer=setTimeout(async()=>{try{const r=await fetch(API+'/api/search?q='+encodeURIComponent(q));const d=await r.json();results.innerHTML=d.items.length?d.items.map(v=>`<div class="result"><b>@${esc(v.username)}</b>${esc(v.caption)}</div>`).join(''):'<div class="result">No results found.</div>'}catch(e){results.innerHTML='<div class="result">Search unavailable.</div>'}},250)}function renderProfile(){if(!me){profileName.textContent='Guest';profileUsername.textContent='Login to personalize your profile';profileBio.textContent='Create. Watch. Connect.';followers.textContent='0';following.textContent='0';profileActions.innerHTML='<button class="primary" onclick="openAuth(\'login\')">Log in</button>';return}profileName.textContent=me.display_name;profileUsername.textContent='@'+me.username;profileBio.textContent=me.bio||'No bio yet.';followers.textContent=fmt(me.followers);following.textContent=fmt(me.following);profileAvatar.textContent=(me.display_name||me.username)[0].toUpperCase();editName.value=me.display_name;editBio.value=me.bio||'';profileActions.innerHTML='<button class="primary" onclick="toggleEdit()">Edit profile</button><button class="secondary" style="margin-top:9px" onclick="logout()">Log out</button>'}function toggleEdit(){if(!me)return;editForm.classList.toggle('show');profileActions.style.display=editForm.classList.contains('show')?'none':'block'}async function saveProfile(){try{const r=await fetch(API+'/api/me',{method:'PATCH',headers:headers(true),body:JSON.stringify({display_name:editName.value,bio:editBio.value})});if(!r.ok){const d=await r.json();throw Error(d.detail||'Could not save')}me=(await r.json()).user;toggleEdit();renderProfile();toast('Profile updated')}catch(e){toast(e.message||'Profile update failed')}}function openAuth(mode='login'){authMode=mode;auth.classList.add('show');authTitle.textContent=mode==='login'?'Welcome back':'Create your REelo account';authSub.textContent=mode==='login'?'Log in to like, follow, comment and post.':'Join REelo and start sharing your world.';displayWrap.style.display=mode==='register'?'block':'none';authDisplay.value='';authUser.focus();authSwitch.textContent=mode==='login'?'New here? Create an account':'Already have an account? Log in'}function closeAuth(){auth.classList.remove('show')}function switchAuth(){openAuth(authMode==='login'?'register':'login')}async function submitAuth(){const username=authUser.value.trim(),password=authPass.value,display_name=authDisplay.value.trim();if(!username||!password){toast('Enter username and password');return}try{const r=await fetch(API+'/api/auth/'+(authMode==='login'?'login':'register'),{method:'POST',headers:headers(true),body:JSON.stringify({username,password,display_name:display_name||undefined})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Authentication failed');token=d.token;localStorage.setItem('reelo_token',token);me=d.user;closeAuth();renderProfile();loadFeed();toast(authMode==='login'?'Welcome back!':'Account created successfully')}catch(e){toast(e.message||'Authentication failed')}}function logout(){token='';me=null;localStorage.removeItem('reelo_token');closePanels();renderProfile();loadFeed();toast('You have been logged out')}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',2200)}loadMe().finally(loadFeed);</script></body></html>

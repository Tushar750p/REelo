<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000"><title>REelo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font:15px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.shell{height:100dvh;max-width:520px;margin:auto;background:#000;position:relative;overflow:hidden}.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.video-card{height:100dvh;min-height:620px;position:relative;scroll-snap-align:start;background:#111;overflow:hidden}.video-card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}.gradient{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),transparent 28%,transparent 55%,rgba(0,0,0,.82) 100%);pointer-events:none}.header{position:absolute;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;z-index:5;display:flex;align-items:center;justify-content:space-between}.brand{font-size:25px;font-weight:900;letter-spacing:-1.2px}.tabs{display:flex;gap:22px;align-items:center}.tabs button{border:0;background:none;color:#aaa;font-weight:700;padding:7px 0}.tabs button.active{color:#fff;border-bottom:2px solid #fff}.search-btn{border:0;background:rgba(0,0,0,.35);color:#fff;border-radius:50%;width:40px;height:40px;font-size:20px}.info{position:absolute;left:17px;right:92px;bottom:88px;z-index:4}.creator{display:flex;align-items:center;gap:9px}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#fff,#555);display:grid;place-items:center;color:#000;font-weight:900}.handle{font-weight:800}.follow{margin-left:4px;background:#fff;color:#000;border:0;border-radius:7px;padding:5px 10px;font-weight:800;font-size:12px}.caption{margin:10px 0 8px;line-height:1.4;font-weight:500}.sound{display:flex;align-items:center;gap:8px;font-size:13px}.actions{position:absolute;right:13px;bottom:88px;z-index:4;display:flex;flex-direction:column;align-items:center;gap:15px}.act{border:0;background:none;color:#fff;text-shadow:0 1px 5px #000;padding:0;cursor:pointer;font-size:29px;display:flex;flex-direction:column;align-items:center;gap:2px}.act small{font-size:11px;font-weight:700}.plus{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);z-index:8;width:52px;height:36px;border-radius:10px;border:0;background:#fff;color:#000;font-size:27px;font-weight:400;box-shadow:0 0 0 2px #000}.bottom{position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(transparent,rgba(0,0,0,.94));z-index:7;display:flex;align-items:flex-end;justify-content:space-around;padding:0 4px 9px}.bottom button{border:0;background:none;color:#aaa;font-size:10px;line-height:1.35}.bottom button.active{color:#fff}.bottom .icon{font-size:22px;display:block}.panel{position:absolute;inset:0;background:#080808;z-index:20;display:none;padding:calc(18px + env(safe-area-inset-top)) 16px 20px;overflow:auto}.panel.show{display:block}.panel-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}.back{border:0;background:none;color:#fff;font-size:26px}.panel h2{margin:0;font-size:22px}.searchbox{width:100%;padding:14px 16px;border:1px solid #333;border-radius:12px;background:#171717;color:#fff;outline:none}.result{padding:14px 0;border-bottom:1px solid #252525}.result b{display:block;margin-bottom:4px}.upload-sheet{position:absolute;left:12px;right:12px;bottom:76px;background:#171717;border:1px solid #333;border-radius:18px;padding:18px;z-index:30;display:none}.upload-sheet.show{display:block}.upload-sheet input{width:100%;margin:12px 0;background:#222;color:#fff;padding:10px;border-radius:9px;border:1px solid #333}.primary{width:100%;border:0;border-radius:10px;padding:12px;background:#fff;color:#000;font-weight:800}.toast{position:absolute;top:75px;left:16px;right:16px;background:#222;border:1px solid #333;padding:12px 14px;border-radius:12px;z-index:40;display:none}.heart{animation:pop .18s ease}@keyframes pop{50%{transform:scale(1.35)}}
@media(min-width:700px){.shell{box-shadow:0 0 0 1px #222,0 20px 70px #000}.bottom{border-radius:0}}
</style></head>
<body><div class="shell">
<div id="toast" class="toast"></div>
<header class="header"><div class="brand">REelo</div><div class="tabs"><button id="forBtn" class="active" onclick="setTab('For You')">For You</button><button onclick="setTab('Following')">Following</button></div><button class="search-btn" onclick="openPanel('searchPanel')">⌕</button></header>
<main id="feed" class="feed"></main>
<button class="plus" onclick="toggleUpload()">＋</button>
<nav class="bottom"><button class="active" onclick="closePanels()"><span class="icon">⌂</span>Home</button><button onclick="openPanel('searchPanel')"><span class="icon">⌕</span>Discover</button><button onclick="toggleUpload()"><span class="icon">◎</span>Create</button><button onclick="toast('Activity will connect to notifications API')"><span class="icon">♡</span>Activity</button><button onclick="openPanel('profilePanel')"><span class="icon">◉</span>Profile</button></nav>
<section id="searchPanel" class="panel"><div class="panel-head"><button class="back" onclick="closePanels()">‹</button><h2>Discover</h2></div><input id="searchInput" class="searchbox" placeholder="Search creators, videos, hashtags…" oninput="search(this.value)"><div id="results"></div></section>
<section id="profilePanel" class="panel"><div class="panel-head"><button class="back" onclick="closePanels()">‹</button><h2>Profile</h2></div><div style="text-align:center;padding:30px 0"><div class="avatar" style="margin:auto;width:72px;height:72px;font-size:25px">R</div><h2 style="margin:12px 0 4px">REelo Creator</h2><div style="color:#999">@reelo_creator</div><p>Create. Watch. Connect.</p><button class="primary" onclick="toast('Profile editing is next')">Edit profile</button></div></section>
<div id="uploadSheet" class="upload-sheet"><b>Create a video</b><input id="videoFile" type="file" accept="video/*"><input id="caption" type="text" placeholder="Write a caption…"><button class="primary" onclick="submitUpload()">Post video</button></div>
</div>
<script>
const API=window.REELO_API||'http://localhost:8000';
let token=localStorage.getItem('reelo_token')||'';let tab='For You';let feedItems=[];
const demo=[{id:'demo-1',username:'reelo_creator',display_name:'REelo Creator',caption:'Build your vibe. Share your story. 🚀',filename:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',likes:12400,comments:321,views:85000,liked:0},{id:'demo-2',username:'futuredaily',display_name:'Future Daily',caption:'Create something people remember.',filename:'https://www.w3schools.com/html/mov_bbb.mp4',likes:8700,comments:142,views:54000,liked:0}];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function videoUrl(v){return v.filename?.startsWith('http')?v.filename:API+(v.filename?.startsWith('/')?'':'/')+v.filename}
async function loadFeed(){try{const r=await fetch(API+'/api/feed',{headers:token?{Authorization:'Bearer '+token}:{}});if(!r.ok)throw Error();const d=await r.json();feedItems=d.items?.length?d.items:demo}catch(e){feedItems=demo}render()}
function render(){const el=document.getElementById('feed');el.innerHTML=feedItems.map((v,i)=>`<article class="video-card" data-id="${esc(v.id)}"><video src="${esc(videoUrl(v))}" loop playsinline muted preload="metadata"></video><div class="gradient"></div><div class="info"><div class="creator"><div class="avatar">${esc((v.username||'r')[0]).toUpperCase()}</div><span class="handle">@${esc(v.username||'creator')}</span><button class="follow" onclick="follow('${esc(v.user_id||'demo-user')}')">Follow</button></div><div class="caption">${esc(v.caption)}</div><div class="sound">♫ Original sound · REelo</div></div><div class="actions"><button class="act ${v.liked?'heart':''}" onclick="likeVideo('${esc(v.id)}',this)">${v.liked?'♥':'♡'}<small>${fmt(v.likes)}</small></button><button class="act" onclick="comments('${esc(v.id)}')">💬<small>${fmt(v.comments)}</small></button><button class="act" onclick="shareVideo('${esc(v.id)}')">↗<small>Share</small></button><button class="act" onclick="saveVideo(this)">🔖<small>Save</small></button></div><div class="tap" style="position:absolute;inset:0;z-index:2" ondblclick="likeVideo('${esc(v.id)}',this)"></div></article>`).join('');observeVideos()}
function fmt(n){n=Number(n||0);return n>=1000000?(n/1e6).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'K':String(n)}
function observeVideos(){document.querySelectorAll('.video-card').forEach(card=>{const v=card.querySelector('video');new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){v.play().catch(()=>{});sendWatch(card.dataset.id,'view')}else v.pause()}),{threshold:.72}).observe(card)})}
async function likeVideo(id,btn){try{const r=await fetch(API+`/api/videos/${id}/like`,{method:'POST',headers:token?{Authorization:'Bearer '+token}:{}});if(!r.ok)throw Error();const d=await r.json();btn.innerHTML=(d.liked?'♥':'♡')+`<small>${fmt(d.likes)}</small>`;btn.classList.toggle('heart',d.liked)}catch(e){toast(token?'Like failed — try again':'Login is required for server likes')}}
async function follow(id){if(!token){toast('Login required to follow creators');return}const r=await fetch(API+`/api/users/${id}/follow`,{method:'POST',headers:{Authorization:'Bearer '+token}});toast(r.ok?'Following updated':'Could not update follow')}
function comments(id){const text=prompt('Write a comment');if(!text)return;if(!token){toast('Login required to comment');return}fetch(API+`/api/videos/${id}/comments`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({body:text})}).then(r=>toast(r.ok?'Comment posted':'Comment failed'))}
function shareVideo(id){const url=location.href+'#video='+id;navigator.clipboard?.writeText(url);toast('Video link copied')}
function saveVideo(btn){btn.innerHTML='🔖<small>Saved</small>';toast('Saved to your collection')}
async function sendWatch(id,action){try{await fetch(API+`/api/events/watch?video_id=${encodeURIComponent(id)}&action=${action}`,{method:'POST',headers:token?{Authorization:'Bearer '+token}:{}})}catch(e){}}
function setTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.textContent===t));toast(t+' feed selected')}
function openPanel(id){closePanels();document.getElementById(id).classList.add('show');if(id==='searchPanel')setTimeout(()=>searchInput.focus(),50)}
function closePanels(){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('show'));document.getElementById('uploadSheet').classList.remove('show')}
function toggleUpload(){document.getElementById('uploadSheet').classList.toggle('show')}
async function submitUpload(){const f=document.getElementById('videoFile').files[0];if(!f){toast('Select a video first');return}if(!token){toast('Login required to post videos');return}const fd=new FormData();fd.append('file',f);fd.append('caption',document.getElementById('caption').value);const r=await fetch(API+'/api/videos/upload',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});toast(r.ok?'Video posted':'Upload failed');if(r.ok){toggleUpload();loadFeed()}}
let searchTimer;function search(q){clearTimeout(searchTimer);if(!q.trim()){results.innerHTML='';return}searchTimer=setTimeout(async()=>{try{const r=await fetch(API+'/api/search?q='+encodeURIComponent(q));const d=await r.json();results.innerHTML=d.items.length?d.items.map(v=>`<div class="result"><b>@${esc(v.username)}</b>${esc(v.caption)}</div>`).join(''):'<div class="result">No results found.</div>'}catch(e){results.innerHTML='<div class="result">Search unavailable.</div>'}},250)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',2200)}
loadFeed();
</script></body></html>

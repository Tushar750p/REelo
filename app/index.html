<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REelo — AI Short Video</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font:15px Inter,system-ui,sans-serif}button,input{font:inherit}.app{max-width:480px;margin:auto;height:100vh;position:relative;background:#111;overflow:hidden}.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory}.card{height:100vh;min-height:620px;position:relative;scroll-snap-align:start;background:linear-gradient(135deg,#171717,#050505);display:flex;align-items:center;justify-content:center}.card video{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.8))}.top{position:absolute;top:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;z-index:3}.logo{font-size:25px;font-weight:900}.ai{font-size:12px;border:1px solid #ffffff44;border-radius:20px;padding:7px 10px;background:#0008}.info{position:absolute;left:18px;right:82px;bottom:90px;z-index:3}.user{font-weight:800;font-size:17px}.caption{margin:8px 0}.tags{opacity:.8}.actions{position:absolute;right:14px;bottom:100px;z-index:3;display:grid;gap:16px}.action{border:0;background:#0008;color:#fff;width:50px;height:50px;border-radius:50%;font-size:22px;cursor:pointer}.action small{display:block;font-size:10px}.nav{position:absolute;bottom:0;left:0;right:0;height:64px;background:#050505ee;display:flex;justify-content:space-around;align-items:center;z-index:5}.nav button{background:none;border:0;color:#bbb;font-size:12px}.nav b{color:#fff}.upload{font-size:25px!important}.toast{position:absolute;top:65px;left:20px;right:20px;background:#222;padding:12px;border-radius:12px;display:none;z-index:10}.search{display:none;position:absolute;inset:0;background:#0d0d0d;z-index:9;padding:70px 18px}.search input{width:100%;padding:14px;border-radius:12px;border:1px solid #444;background:#181818;color:#fff}</style></head>
<body><div class="app"><div class="toast" id="toast"></div><div class="search" id="search"><input id="q" placeholder="Search videos, creators, hashtags…"><p>🤖 AI Search ready</p></div><div class="top"><div class="logo">REelo</div><div class="ai">✦ AI-powered</div></div><main class="feed" id="feed"></main><nav class="nav"><button onclick="home()">⌂<br><b>Home</b></button><button onclick="showSearch()">⌕<br>Search</button><button class="upload" onclick="upload()">＋</button><button onclick="toast('Notifications coming next')">♡<br>Activity</button><button onclick="toast('Profile coming next')">◉<br>Profile</button></nav></div>
<script>const videos=[{u:'@reelo_creator',c:'Build your vibe. Share your story. 🚀',t:'#REelo #AI #creator',src:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',likes:12400,comments:321},{u:'@futuredaily',c:'AI is changing how we create.',t:'#technology #future',src:'https://www.w3schools.com/html/mov_bbb.mp4',likes:8700,comments:142}];
function render(){feed.innerHTML=videos.map((v,i)=>`<section class="card"><video src="${v.src}" loop playsinline muted></video><div class="shade"></div><div class="info"><div class="user">${v.u} <button onclick="toast('Following '+v.u)" style="border:0;border-radius:12px">Follow</button></div><div class="caption">${v.c}</div><div class="tags">${v.t}</div></div><div class="actions"><button class="action" onclick="like(this)">♡<small>${v.likes}</small></button><button class="action" onclick="toast('Comments UI connected next')">💬<small>${v.comments}</small></button><button class="action" onclick="share()">↗<small>Share</small></button><button class="action" onclick="toast('AI: video analyzed for topic, safety and recommendations')">✦<small>AI</small></button></div></section>`).join('');document.querySelectorAll('video').forEach(x=>new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?x.play().catch(()=>{}):x.pause()),{threshold:.7}).observe(x))}function like(b){b.innerHTML='♥<small>Liked</small>'}function share(){navigator.clipboard?.writeText(location.href);toast('Link copied')}function upload(){const i=document.createElement('input');i.type='file';i.accept='video/*';i.onchange=()=>toast('Video selected. Backend upload pipeline is ready for the next build.');i.click()}function showSearch(){search.style.display='block';q.focus()}function home(){search.style.display='none'}function toast(x){toastEl.textContent=x;toastEl.style.display='block';setTimeout(()=>toastEl.style.display='none',2200)}const toastEl=document.getElementById('toast');render();</script></body></html>

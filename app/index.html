<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REelo — AI Short Video</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Arial,sans-serif;background:#050505;color:#fff}body{overflow:hidden}.app{height:100%;position:relative;background:#050505}.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory}.card{height:100vh;position:relative;scroll-snap-align:start;display:flex;align-items:flex-end;background:linear-gradient(180deg,#111,#050505)}.video-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.8}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),transparent 42%,rgba(0,0,0,.82))}.content{position:relative;z-index:2;padding:24px 24px 88px;max-width:700px}.handle{font-weight:800;font-size:17px}.caption{font-size:15px;line-height:1.45;margin:10px 0}.tags{color:#ddd;font-size:14px}.actions{position:absolute;right:18px;bottom:92px;z-index:3;display:flex;flex-direction:column;gap:18px;align-items:center}.action{width:52px;height:52px;border-radius:50%;border:1px solid #ffffff30;background:#ffffff14;color:#fff;display:grid;place-items:center;font-size:22px;cursor:pointer;backdrop-filter:blur(8px)}.count{font-size:12px;color:#eee;margin-top:-12px}.topbar{position:absolute;top:0;left:0;right:0;z-index:10;height:64px;display:flex;align-items:center;justify-content:center;pointer-events:none}.logo{font-weight:900;font-size:28px;letter-spacing:-1px}.ai{position:absolute;right:18px;pointer-events:auto;border:1px solid #ffffff25;background:#111a;color:#fff;padding:9px 13px;border-radius:999px;font-weight:700}.bottom{position:absolute;bottom:0;left:0;right:0;height:62px;background:#090909ee;backdrop-filter:blur(14px);z-index:10;display:flex;align-items:center;justify-content:space-around}.nav{border:0;background:none;color:#aaa;font-size:12px;display:flex;flex-direction:column;gap:3px;align-items:center}.nav.active{color:#fff}.upload{width:46px;height:32px;border-radius:10px;background:#fff;color:#000;font-size:24px;line-height:28px;border:0}.empty{height:100vh;display:grid;place-items:center;color:#aaa}input{display:none}
  </style>
</head>
<body>
<div class="app">
  <div class="topbar"><div class="logo">REelo</div><button class="ai" id="aiBtn">✨ AI</button></div>
  <main class="feed" id="feed"></main>
  <nav class="bottom">
    <button class="nav active">⌂<span>For You</span></button>
    <button class="nav">🔎<span>Discover</span></button>
    <button class="upload" id="uploadBtn">＋</button>
    <button class="nav">♡<span>Activity</span></button>
    <button class="nav">◉<span>Profile</span></button>
  </nav>
  <input id="file" type="file" accept="video/*" />
</div>
<script>
const demos=[
 {u:'@reelo.creator',c:'Build. Create. Go viral. Your AI-powered short-video journey starts here.','#':'#AI #REelo #Creators',v:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4'},
 {u:'@travel.reelo',c:'A new world is one swipe away 🌍','#':'#Travel #Explore #ForYou',v:'https://storage.googleapis.com/coverr-main/mp4/Mt_Baker.mp4'},
 {u:'@future.tech',c:'The future of social video is intelligent.','#':'#AI #Tech #Future',v:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm'}
];
function card(x,i){return `<section class="card"><video class="video-bg" src="${x.v}" playsinline loop muted autoplay></video><div class="shade"></div><div class="content"><div class="handle">${x.u}</div><div class="caption">${x.c}</div><div class="tags">${x['#']}</div></div><div class="actions"><button class="action like">♡</button><span class="count">${(12+i*7)}K</span><button class="action">💬</button><span class="count">${82+i*41}</span><button class="action">↗</button><span class="count">Share</span></div></section>`}
document.getElementById('feed').innerHTML=demos.map(card).join('');
document.querySelectorAll('video').forEach(v=>{v.addEventListener('click',()=>v.paused?v.play():v.pause())});
document.querySelectorAll('.like').forEach(b=>b.addEventListener('click',()=>{b.textContent=b.textContent==='♡'?'♥':'♡'}));
document.getElementById('uploadBtn').onclick=()=>document.getElementById('file').click();
document.getElementById('aiBtn').onclick=()=>alert('REelo AI: personalized recommendations, captions, hashtags and moderation are planned for the next build.');
document.getElementById('file').onchange=e=>{const f=e.target.files[0]; if(!f)return; const url=URL.createObjectURL(f); const wrap=document.createElement('section'); wrap.className='card'; wrap.innerHTML=`<video class="video-bg" src="${url}" playsinline loop autoplay controls></video><div class="shade"></div><div class="content"><div class="handle">@you</div><div class="caption">Your new REelo video 🎬</div><div class="tags">#NewPost #REelo</div></div>`; document.getElementById('feed').prepend(wrap); wrap.scrollIntoView({behavior:'smooth'});};
</script>
</body>
</html>

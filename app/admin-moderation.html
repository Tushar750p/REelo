<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REelo · Moderation</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#fff;font:14px Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.brand{font-size:25px;font-weight:900}.muted{color:#888}.btn{border:1px solid #333;background:#171717;color:#fff;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}.btn.primary{background:#fff;color:#000;border-color:#fff}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.filters button.active{background:#fff;color:#000}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{background:#121212;border:1px solid #262626;border-radius:14px;padding:16px}.stat b{font-size:24px;display:block;margin-top:5px}.list{display:grid;gap:10px}.item{background:#111;border:1px solid #262626;border-radius:14px;padding:16px}.row{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.tag{font-size:11px;border:1px solid #333;border-radius:999px;padding:5px 8px;color:#aaa}.reason{font-weight:800;margin:8px 0}.details{color:#bbb;line-height:1.45;white-space:pre-wrap}.meta{color:#777;font-size:12px;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.empty{padding:50px;text-align:center;color:#777;background:#111;border-radius:14px}@media(max-width:650px){.stats{grid-template-columns:1fr}.row{flex-direction:column}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><header class="top"><div><div class="brand">REelo Moderation</div><div class="muted">Private report review console</div></div><button class="btn" onclick="location.href='index.html'">Back to REelo</button></header><section class="stats"><div class="stat"><span class="muted">Open reports</span><b id="openCount">—</b></div><div class="stat"><span class="muted">Resolved</span><b id="resolvedCount">—</b></div><div class="stat"><span class="muted">Total loaded</span><b id="totalCount">—</b></div></section><div class="filters"><button class="btn active" data-status="open" onclick="setFilter('open',this)">Open</button><button class="btn" data-status="all" onclick="setFilter('all',this)">All</button><button class="btn" data-status="resolved" onclick="setFilter('resolved',this)">Resolved</button><button class="btn" onclick="loadReports()">Refresh</button></div><section id="list" class="list"><div class="empty">Loading reports…</div></section></main><script>const API=window.REELO_API||'http://localhost:8000';const token=localStorage.getItem('reelo_token')||'';let filter='open';const $=id=>document.getElementById(id);function headers(){return token?{Authorization:'Bearer '+token}:{}}function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function setFilter(v,b){filter=v;document.querySelectorAll('.filters button[data-status]').forEach(x=>x.classList.remove('active'));b.classList.add('active');loadReports()}async function loadReports(){if(!token){$('list').innerHTML='<div class="empty">Admin login required.</div>';return}try{const r=await fetch(API+'/api/admin/moderation/reports?limit=100&status='+filter,{headers:headers()});const d=await r.json();if(!r.ok)throw Error(d.detail||'Could not load reports');const items=d.items||[];$('openCount').textContent=d.stats?.open??'—';$('resolvedCount').textContent=d.stats?.resolved??'—';$('totalCount').textContent=d.stats?.total??items.length;$('list').innerHTML=items.length?items.map(x=>`<article class="item"><div class="row"><div><span class="tag">${esc(x.target_type)}</span><div class="reason">${esc(x.reason)}</div></div><span class="tag">${esc(x.status)}</span></div><div class="details">${esc(x.details||'No additional details')}</div><div class="meta">Report ${esc(x.id)} · Reporter ${esc(x.reporter_id)} · Target ${esc(x.target_id)} · ${esc(x.created_at)}</div>${x.status==='open'?`<div class="actions"><button class="btn primary" onclick="resolveReport('${esc(x.id)}','resolved')">Resolve</button><button class="btn" onclick="resolveReport('${esc(x.id)}','dismissed')">Dismiss</button></div>`:''}</article>`).join(''):'<div class="empty">No reports found.</div>'}catch(e){$('list').innerHTML=`<div class="empty">${esc(e.message||'Unable to load reports')}</div>`}}async function resolveReport(id,status){try{const r=await fetch(API+`/api/admin/moderation/reports/${encodeURIComponent(id)}/status`,{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({status})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Could not update report');loadReports()}catch(e){alert(e.message||'Could not update report')}}loadReports()</script></body></html>

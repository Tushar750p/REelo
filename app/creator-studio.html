<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Studio · REelo</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f7f7f8;color:#111}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.top h1{margin:0;font-size:28px}.back{border:0;background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e8e8eb;border-radius:18px;padding:20px}.label{color:#777;font-size:13px}.value{font-size:28px;font-weight:750;margin-top:8px}.section{margin-top:28px}.section h2{font-size:18px}.table{background:#fff;border:1px solid #e8e8eb;border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:1.5fr .7fr .7fr .7fr;gap:12px;padding:14px 18px;border-bottom:1px solid #eee}.head{font-weight:700;background:#fafafa}.muted{color:#777}.error{background:#fff1f1;color:#b42318;padding:14px;border-radius:12px}@media(max-width:700px){.wrap{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr .6fr .6fr .6fr;font-size:13px}.value{font-size:22px}}</style></head><body><main class="wrap"><header class="top"><h1>Creator Studio</h1><button class="back" onclick="location.href='index.html'">← Back</button></header><div id="app">Loading…</div></main><script>const API=window.REELO_API||'http://localhost:8000';const token=localStorage.getItem('reelo_token');const headers=token?{Authorization:'Bearer '+token}:{ };function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function num(v){return Number(v||0).toLocaleString()}async function load(){if(!token){location.href='index.html';return}try{const r=await fetch(API+'/api/creator/dashboard',{headers});if(r.status===401){location.href='index.html';return}if(!r.ok)throw Error('Unable to load creator data');const d=await r.json();document.getElementById('app').innerHTML=`<section class="cards"><div class="card"><div class="label">Videos</div><div class="value">${num(d.totals.videos)}</div></div><div class="card"><div class="label">Views</div><div class="value">${num(d.totals.views)}</div></div><div class="card"><div class="label">Likes</div><div class="value">${num(d.totals.likes)}</div></div><div class="card"><div class="label">Comments</div><div class="value">${num(d.totals.comments)}</div></div></section><section class="section"><h2>Your videos</h2><div class="table"><div class="row head"><div>Video</div><div>Views</div><div>Likes</div><div>Comments</div></div>${d.videos.map(v=>`<div class="row"><div><strong>${esc(v.caption||'Untitled')}</strong><div class="muted">${esc(v.created_at||'')}</div></div><div>${num(v.views)}</div><div>${num(v.likes)}</div><div>${num(v.comments)}</div></div>`).join('')||'<div class="row"><div class="muted">No videos yet.</div></div>'}</div></section>`}catch(e){document.getElementById('app').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}load();</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Studio · REelo</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f7f7f8;color:#111}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.top h1{margin:0;font-size:28px}.back{border:0;background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#fff;border:1px solid #e8e8eb;border-radius:18px;padding:20px}.label{color:#777;font-size:13px}.value{font-size:28px;font-weight:750;margin-top:8px}.section{margin-top:28px}.section h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.chart{height:230px;position:relative}.chart svg{width:100%;height:100%;overflow:visible}.axis{font-size:11px;fill:#888}.line{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.toplist{display:flex;flex-direction:column;gap:10px}.topitem{display:flex;justify-content:space-between;gap:12px;padding:12px;border:1px solid #eee;border-radius:12px}.topitem strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}.stats{color:#777;font-size:12px;margin-top:4px}.money{display:grid;grid-template-columns:1fr 1fr;gap:14px}..money .big{font-size:32px;font-weight:800;margin-top:6px}.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:#111;border-radius:99px}.note{font-size:12px;color:#777;margin-top:12px}.table{background:#fff;border:1px solid #e8e8eb;border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:1.5fr .7fr .7fr .7fr .8fr;gap:12px;padding:14px 18px;border-bottom:1px solid #eee}.head{font-weight:700;background:#fafafa}.muted{color:#777}.error{background:#fff1f1;color:#b42318;padding:14px;border-radius:12px}@media(max-width:800px){.wrap{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}.grid,.money{grid-template-columns:1fr}.row{grid-template-columns:1.4fr .7fr .7fr .7fr .8fr;font-size:12px}.value{font-size:22px}}@media(max-width:520px){.cards{gap:8px}.card,.panel{padding:14px}.row{grid-template-columns:1.5fr .7fr .7fr .7fr}.row div:last-child{display:none}.head div:last-child{display:none}.top h1{font-size:23px}}</style></head><body><main class="wrap"><header class="top"><h1>Creator Studio</h1><button class="back" onclick="location.href='index.html'">← Back</button></header><div id="app">Loading…</div></main><script>const API=window.REELO_API||'http://localhost:8000';const token=localStorage.getItem('reelo_token');const headers=token?{Authorization:'Bearer '+token}:{};function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function num(v){return Number(v||0).toLocaleString()}function money(v){return '₹'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}function pct(v){return `${Number(v||0).toFixed(2)}%`}function makeChart(items,key,label){if(!items.length)return '<div class="muted">No analytics data yet.</div>';const vals=items.map(x=>Number(x[key]||0));const max=Math.max(...vals,1),w=720,h=190,p=20;const points=vals.map((v,i)=>`${p+i*(w-p*2)/Math.max(vals.length-1,1)},${h-p-(v/max)*(h-p*2)}`).join(' ');return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}"><polyline class="line" points="${points}"/><text class="axis" x="20" y="180">${esc(items[0].day||'')}</text><text class="axis" x="${w-20}" y="180" text-anchor="end">${esc(items[items.length-1].day||'')}</text><text class="axis" x="20" y="18">${esc(num(max))}</text></svg></div>`}async function get(path){const r=await fetch(API+path,{headers});if(r.status===401){location.href='index.html';throw Error('Login required')}if(!r.ok)throw Error('Unable to load creator data');return r.json()}async function load(){if(!token){location.href='index.html';return}try{const[d,a,m]=await Promise.all([get('/api/creator/dashboard'),get('/api/creator/analytics'),get('/api/monetization/dashboard')]);const totalViews=Number(d.totals.views||0),totalEng=Number(d.totals.likes||0)+Number(d.totals.comments||0),overallRate=totalViews?(totalEng/totalViews)*100:0;const followerReq=m.requirements?.followers||1000,viewReq=m.requirements?.views||10000;const fp=Math.min(100,Number(m.progress?.followers||0)/followerReq*100),vp=Math.min(100,Number(m.progress?.views||0)/viewReq*100);document.getElementById('app').innerHTML=`<section class="cards"><div class="card"><div class="label">Videos</div><div class="value">${num(d.totals.videos)}</div></div><div class="card"><div class="label">Views</div><div class="value">${num(d.totals.views)}</div></div><div class="card"><div class="label">Likes</div><div class="value">${num(d.totals.likes)}</div></div><div class="card"><div class="label">Engagement rate</div><div class="value">${pct(overallRate)}</div></div></section><section class="section"><div class="grid"><div class="panel"><h2>Views · last 30 days</h2>${makeChart(a.items,'views','Views over time')}</div><div class="panel"><h2>Follower growth</h2>${a.followers?.length?makeChart(a.followers.map(x=>({day:x.day,growth:x.followers})),'growth','Followers over time'):'<div class="muted">Follower history will appear as your audience grows.</div>'}</div></div></section><section class="section"><div class="panel"><h2>Earnings</h2><div class="money"><div><div class="label">Estimated earnings</div><div class="big">${money(m.earnings)}</div><div class="note">${esc(m.note||'Estimated revenue')}</div></div><div><div class="label">Monetization status</div><div class="big">${m.eligible?'Eligible':'Not eligible yet'}</div><div class="note">${num(m.progress?.followers)} / ${num(followerReq)} followers · ${num(m.progress?.views)} / ${num(viewReq)} views</div><div class="progress"><i style="width:${Math.min(fp,vp)}%"></i></div></div></div></div></section><section class="section"><div class="panel"><h2>Top-performing videos</h2><div class="toplist">${(a.top_videos||[]).map(v=>`<div class="topitem"><div><strong>${esc(v.caption||'Untitled')}</strong><div class="stats">${num(v.views)} views · ${num(v.likes)} likes · ${num(v.comments)} comments</div></div><strong>${v.views?pct(((Number(v.likes||0)+Number(v.comments||0))/Number(v.views))*100):'0.00%'}</strong></div>`).join('')||'<div class="muted">No videos yet.</div>'}</div></div></section><section class="section"><h2>Your videos</h2><div class="table"><div class="row head"><div>Video</div><div>Views</div><div>Likes</div><div>Comments</div><div>Engagement</div></div>${d.videos.map(v=>`<div class="row"><div><strong>${esc(v.caption||'Untitled')}</strong><div class="muted">${esc(v.created_at||'')}</div></div><div>${num(v.views)}</div><div>${num(v.likes)}</div><div>${num(v.comments)}</div><div>${pct(v.engagement_rate)}</div></div>`).join('')||'<div class="row"><div class="muted">No videos yet.</div></div>'}</div></section>`}catch(e){document.getElementById('app').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}load();</script></body></html>

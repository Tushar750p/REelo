<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REelo Stories</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:720px;margin:auto;min-height:100vh;background:#111}.head{height:64px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #292929}.back{border:0;background:none;color:#fff;font-size:25px}.head b{font-size:20px}.create{margin:14px;padding:16px;border:1px solid #303030;border-radius:18px;background:#181818}.create input{width:100%;padding:12px;border-radius:12px;border:1px solid #333;background:#101010;color:#fff;margin:6px 0}.create button{margin-top:8px;padding:11px 16px;border:0;border-radius:12px;font-weight:800}.stories{display:flex;gap:14px;padding:14px;overflow:auto}.story{flex:0 0 76px;text-align:center;cursor:pointer}.ring{width:68px;height:68px;margin:auto;border-radius:50%;padding:3px;background:linear-gradient(135deg,#fff,#777);}.ring div{width:100%;height:100%;border-radius:50%;background:#222;display:grid;place-items:center;font-weight:900;border:2px solid #111}.story small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:7px;color:#ccc}.viewer{display:none;position:fixed;inset:0;background:#000;z-index:10}.viewer.show{display:flex;align-items:center;justify-content:center}.viewer img,.viewer video{max-width:100%;max-height:100%;object-fit:contain}.close{position:absolute;right:16px;top:14px;border:0;background:#0008;color:#fff;border-radius:50%;width:42px;height:42px;font-size:24px;z-index:2}.vmeta{position:absolute;top:16px;left:16px;background:#0008;padding:9px 12px;border-radius:15px;z-index:2}.vcap{position:absolute;bottom:30px;left:16px;right:16px;background:#0009;padding:12px;border-radius:14px}</style></head><body><main class="wrap"><header class="head"><button class="back" onclick="history.back()">‹</button><b>Stories</b></header><section class="create"><b>Share a story</b><input id="media" placeholder="Media URL (image/video)"><input id="caption" maxlength="500" placeholder="Caption"><button onclick="createStory()">Post story</button></section><section id="stories" class="stories"><span style="color:#888">Loading…</span></section></main><section id="viewer" class="viewer"><button class="close" onclick="closeViewer()">×</button><div id="vmeta" class="vmeta"></div><div id="mediaBox"></div><div id="vcap" class="vcap"></div></section><script>(function(){const API=window.REELO_API||'http://localhost:8000';const token=localStorage.getItem('reelo_token')||'';let items=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const h=()=>({'Authorization':'Bearer '+token,'Content-Type':'application/json'});window.createStory=async function(){const media=$('media').value.trim(),caption=$('caption').value.trim();if(!token){alert('Please log in first');return}if(!media){alert('Add a media URL');return}const r=await fetch(API+'/api/stories',{method:'POST',headers:h(),body:JSON.stringify({media_url:media,caption})});if(r.ok){$('media').value='';$('caption').value='';load()}else{const d=await r.json().catch(()=>({}));alert(d.detail||'Could not post story')}};async function load(){if(!token){$('stories').innerHTML='<span style="color:#888">Log in to view stories.</span>';return}const r=await fetch(API+'/api/stories',{headers:h()});if(!r.ok){$('stories').innerHTML='<span style="color:#888">Could not load stories.</span>';return}items=(await r.json()).items||[];const by=new Map();items.forEach(x=>{if(!by.has(x.user_id))by.set(x.user_id,x)});$('stories').innerHTML=by.size?[...by.values()].map(x=>`<div class="story" onclick="openStory('${esc(x.user_id)}')"><div class="ring"><div>${esc((x.username||'@').slice(0,1).toUpperCase())}</div></div><small>@${esc(x.username)}</small></div>`).join(''):'<span style="color:#888">No active stories yet.</span>'}window.openStory=function(uid){const x=items.find(s=>String(s.user_id)===String(uid));if(!x)return;const url=x.media_url;const box=$('mediaBox');box.innerHTML=/\.(mp4|webm|mov|m4v)(\?|$)/i.test(url)?`<video src="${esc(url)}" autoplay controls playsinline></video>`:`<img src="${esc(url)}" alt="Story">`;$('vmeta').textContent='@'+x.username;$('vcap').textContent=x.caption||'';$('viewer').classList.add('show');fetch(API+'/api/stories/'+encodeURIComponent(x.id)+'/view',{method:'POST',headers:h()}).catch(()=>{})};window.closeViewer=function(){$('viewer').classList.remove('show');$('mediaBox').innerHTML=''};load()})();</script></body></html>

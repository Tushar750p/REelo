<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytics · REelo</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f6f8;color:#111}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:28px}.actions{display:flex;gap:8px}.btn,.range{border:1px solid #ddd;background:#fff;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}.range.active{background:#111;color:#fff;border-color:#111}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e7e7eb;border-radius:18px;padding:18px}.label,.muted{color:#777;font-size:12px}.value{font-size:27px;font-weight:800;margin-top:7px}.section{margin-top:16px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}.panel h2{font-size:17px;margin:0 0 14px}.chart{height:230px}.chart svg{width:100%;height:100%}.line{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.axis{font-size:11px;fill:#888}.ret{display:grid;grid-template-columns:1fr 70px;gap:10px;align-items:center;margin:12px 0}.track{height:9px;background:#eee;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:#111}.table .r{display:grid;grid-template-columns:1.5fr .65fr .7fr .65fr .65fr;gap:8px;padding:12px 0;border-bottom:1px solid #eee;font-size:13px}.table .head{font-weight:700;color:#777;font-size:11px}.note{margin-top:10px;padding:11px;background:#fafafa;border-radius:11px;color:#666;font-size:12px;line-height:1.5}.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.insight{border:1px solid #eee;border-radius:14px;padding:14px}.insight .tag{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#777;font-weight:800}.insight h3{font-size:14px;margin:7px 0}.insight p{font-size:12px;color:#666;line-height:1.5;margin:0}.windows{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.window{background:#fafafa;border-radius:12px;padding:11px}.window strong{display:block;font-size:13px}.window span{font-size:11px;color:#777}.quality{margin-top:10px;font-size:11px;color:#777}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:12px;border:1px solid #eee;border-radius:12px}.metric strong{display:block;font-size:18px;margin-top:4px}.up{font-weight:700}.heat{display:grid;grid-template-columns:48px repeat(24,minmax(22px,1fr));gap:3px;overflow:auto}.heat .cell{height:22px;border-radius:4px;background:#eee;min-width:22px}.heat .cell[data-v="1"]{background:#d9d9d9}.heat .cell[data-v="2"]{background:#aaa}.heat .cell[data-v="3"]{background:#666}.heat .cell[data-v="4"]{background:#111}.heat .day{font-size:10px;color:#777;display:flex;align-items:center}.heat-label{font-size:9px;color:#999;text-align:center}.opps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.op{border:1px solid #eee;border-radius:14px;padding:14px}.op strong{font-size:13px}.op p{font-size:12px;color:#666;line-height:1.5}.score{font-weight:800}.bar{height:7px;background:#eee;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#111}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid,.compare{grid-template-columns:1fr}.insights,.windows,.opps{grid-template-columns:1fr}}@media(max-width:600px){.wrap{padding:14px}.cards{gap:8px}.card{padding:13px}.value{font-size:22px}.top{align-items:flex-start;gap:12px;flex-direction:column}.actions{width:100%;justify-content:space-between}.range,.btn{padding:9px 10px;font-size:12px}.table{overflow:auto}.table .r{min-width:650px}}
</style></head><body><main class="wrap"><header class="top"><h1>Creator Analytics</h1><div class="actions"><button class="range" data-days="7">7D</button><button class="range active" data-days="30">30D</button><button class="range" data-days="90">90D</button><button class="btn" onclick="location.href='creator-studio.html'">← Studio</button></div></header><div id="app">Loading analytics…</div></main><script>const API=window.REELO_API||'http://localhost:8000',token=localStorage.getItem('reelo_token');const H={Authorization:'Bearer '+token,'Content-Type':'application/json'};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const n=v=>Number(v||0).toLocaleString();const mins=s=>{s=Number(s||0);return s<60?s.toFixed(1)+'s':(s/60).toFixed(1)+'m'};async function get(p){const r=await fetch(API+p,{headers:H});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='index.html';throw Error('Login required')}if(!r.ok)throw Error(d.detail||'Unable to load analytics');return d}function chart(items,key){if(!items.length)return '<div class="muted">No data yet.</div>';const vals=items.map(x=>Number(x[key]||0)),max=Math.max(...vals,1),w=700,h=190,p=18,pts=vals.map((v,i)=>`${p+i*(w-p*2)/Math.max(vals.length-1,1)},${h-p-(v/max)*(h-p*2)}`).join(' ');return `<div class="chart"><svg viewBox="0 0 ${w} ${h}"><polyline class="line" points="${pts}"/><text class="axis" x="18" y="180">${esc(items[0].day||'')}</text><text class="axis" x="682" y="180" text-anchor="end">${esc(items[items.length-1].day||'')}</text><text class="axis" x="18" y="18">${n(max)}</text></svg></div>`}function retention(items){if(!items.length)return '<div class="muted">No watch-depth data yet.</div>';const max=Math.max(...items.map(x=>Number(x.viewers||0)),1);return items.map(x=>`<div class="ret"><div><div style="font-weight:700;font-size:13px">${esc(x.bucket)}</div><div class="track"><i style="width:${Number(x.viewers||0)/max*100}%"></i></div></div><strong>${n(x.viewers)}</strong></div>`).join('')}function intelligence(d){const cards=(d.insights||[]).map(x=>`<article class="insight"><div class="tag">${esc(x.type||'insight')}</div><h3>${esc(x.title)}</h3><p>${esc(x.detail)}</p>${x.rate!=null?`<div class="quality">Interaction rate: ${Number(x.rate).toFixed(2)}%</div>`:''}${x.views!=null?`<div class="quality">Observed views: ${n(x.views)}</div>`:''}</article>`).join('');const windows=(d.best_posting_windows||[]).slice(0,6).map(x=>`<div class="window"><strong>${esc(x.label)}</strong><span>${n(x.views)} views · ${n(x.interactions)} interactions</span></div>`).join('');return `<section class="section panel"><h2>Creator insights</h2><div class="insights">${cards||'<div class="muted">Post more content to unlock insights.</div>'}</div>${windows?`<h2 style="margin-top:18px">Strongest observed time windows</h2><div class="windows">${windows}</div>`:''}<div class="quality">Based on ${n(d.data_quality?.event_count)} recorded events across ${n(d.data_quality?.video_count)} videos. ${esc(d.note||'')}</div></section>`}function comparison(d){const cur=d.seven_day||{},base=d.thirty_day||{},ch=d.changes_vs_30d_daily_average||{};const labels=[['Views',cur.views,base.views,ch.views],['Interactions',cur.interactions,base.interactions,ch.interactions],['Watch time',cur.watch_seconds,base.watch_seconds,ch.watch_seconds],['Unique viewers',cur.unique_viewers,base.unique_viewers,ch.unique_viewers]];return `<section class="section panel"><h2>7D vs 30D</h2><div class="compare">${labels.map(x=>`<div class="metric"><div class="label">${x[0]}</div><strong>${x[0]==='Watch time'?mins(x[1]):n(x[1])}</strong><div class="quality">30D total: ${x[0]==='Watch time'?mins(x[2]):n(x[2])} · ${x[3]==null?'—':(x[3]>=0?'+':'')+x[3]+'% daily avg</div></div>`).join('')}</div><div class="note">The percentage compares the 7D daily average with the 30D daily average, so the different window lengths are normalized.</div></section>`}function videoTable(d){return `<section class="section panel"><h2>Video performance</h2><div class="table"><div class="r head"><div>Video</div><div>Score</div><div>Views</div><div>Engagement</div><div>Avg watch</div></div>${(d.items||[]).slice(0,15).map(x=>`<div class="r"><div><strong>${esc(x.caption||'Untitled')}</strong><div class="muted">${esc(x.created_at||'')}</div></div><div class="score">${Number(x.performance_score||0).toFixed(0)}/100</div><div>${n(x.views)}</div><div>${Number(x.interaction_rate||0).toFixed(2)}%</div><div>${mins(x.avg_watch_seconds)}</div></div>`).join('')||'<div class="muted">No videos yet.</div>'}</div><div class="note">Performance score is a relative reporting metric based on observed views, like/comment rate and average watch time. It is not a prediction.</div></section>`}function cohorts(d){const total=Math.max(Number(d.total_identified_viewers||0),1);return `<section class="section panel"><h2>Viewer cohorts · 30D</h2><div class="compare"><div class="metric"><div class="label">New viewers</div><strong>${n(d.new_viewers)}</strong><div class="quality">${(d.new_viewers/total*100).toFixed(1)}% of identified viewers</div></div><div class="metric"><div class="label">Returning viewers</div><strong>${n(d.returning_viewers)}</strong><div class="quality">${(d.returning_viewers/total*100).toFixed(1)}% of identified viewers</div></div></div><div class="note">${esc(d.note)}</div></section>`}function themes(d){return `<section class="section panel"><h2>Content themes</h2><div class="windows">${(d.items||[]).slice(0,6).map(x=>`<div class="window"><strong>${esc(x.theme)}</strong><span>${n(x.views)} views · ${Number(x.interaction_rate||0).toFixed(2)}% interaction · ${x.videos} video${x.videos==1?'':'s'}</span></div>`).join('')||'<div class="muted">Not enough caption data yet.</div>'}</div><div class="note">${esc(d.note||'')}</div></section>`}function heatmap(d){const vals=(d.cells||[]).map(x=>x.views),max=Math.max(...vals,1);const level=v=>v<=0?0:v/max>.75?4:v/max>.5?3:v/max>.25?2:1;let html='<div class="heat"><div></div>'+d.hours.map((x,i)=>`<div class="heat-label">${i%3===0?esc(x.replace(':00','')):''}</div>`).join('');for(let day=0;day<7;day++){html+=`<div class="day">${d.days[day]}</div>`;for(let h=0;h<24;h++){const c=d.cells.find(x=>x.weekday===day&&x.hour===h)||{};html+=`<div class="cell" data-v="${level(Number(c.views||0))}" title="${d.days[day]} ${d.hours[h]} · ${n(c.views)} views · ${n(c.interactions)} interactions"></div>`}}return html+'</div><div class="quality">Darker cells indicate more observed views in that weekday/hour bucket.</div>'}function opportunities(d){return `<section class="section panel"><h2>Next content opportunities</h2><div class="opps">${(d.items||[]).map(x=>`<article class="op"><div class="tag">${esc(x.type||'test')}</div><strong>${esc(x.title)}</strong><p>${esc(x.detail)}</p><div class="quality">${esc(x.based_on||'')}</div></article>`).join('')}</div><div class="note">${esc(d.note||'')}</div></section>`}async function load(days=30){if(!token){location.href='index.html';return}document.querySelectorAll('.range').forEach(b=>b.classList.toggle('active',Number(b.dataset.days)===days));try{const[o,v,e,a,r,i,c,p,co,t,h,no]=await Promise.all([get('/api/creator/analytics/overview'),get(`/api/creator/analytics/views?days=${days}`),get(`/api/creator/analytics/engagement?days=${days}`),get('/api/creator/analytics/audience'),get('/api/creator/analytics/retention'),get('/api/creator/analytics/intelligence'),get('/api/creator/analytics/comparison?days=7&compare_days=30'),get('/api/creator/analytics/video-performance'),get('/api/creator/analytics/viewer-cohorts'),get('/api/creator/analytics/content-performance'),get('/api/creator/analytics/posting-heatmap'),get('/api/creator/analytics/next-content')]);const engagementTotal=(e.items||[]).reduce((s,x)=>s+Number(x.likes||0)+Number(x.comments||0)+Number(x.shares||0)+Number(x.saves||0),0);const rangeViews=(v.items||[]).reduce((s,x)=>s+Number(x.views||0),0);const rangeWatch=(v.items||[]).reduce((s,x)=>s+Number(x.watch_seconds||0),0);document.getElementById('app').innerHTML=`<section class="cards"><div class="card"><div class="label">Views · ${days} days</div><div class="value">${n(rangeViews)}</div></div><div class="card"><div class="label">Watch time · ${days} days</div><div class="value">${(rangeWatch/3600).toFixed(1)}h</div></div><div class="card"><div class="label">Avg watch</div><div class="value">${mins(o.average_watch_seconds)}</div></div><div class="card"><div class="label">Unique viewers</div><div class="value">${n(o.unique_viewers)}</div></div></section>${intelligence(i)}${comparison(c)}<section class="section grid"><div class="panel"><h2>Views · ${days} days</h2>${chart(v.items||[],'views')}</div><div class="panel"><h2>Audience growth</h2>${chart(a.follower_history||[],'followers')}<div class="muted">Current followers: ${n(o.follower_total)} · Recent growth: ${o.follower_growth>=0?'+':''}${n(o.follower_growth)}</div></div></section><section class="section grid"><div class="panel"><h2>Engagement · ${days} days</h2>${chart((e.items||[]).map(x=>({...x,total:Number(x.likes||0)+Number(x.comments||0)+Number(x.shares||0)+Number(x.saves||0)})),'total')}<div class="muted">Range interactions: ${n(engagementTotal)} · Overall engagement rate: ${Number(o.engagement_rate||0).toFixed(2)}%</div></div><div class="panel"><h2>Watch depth</h2>${retention(r.items||[])}<div class="note">${esc(r.note||o.retention_note||'')}</div></div></section>${videoTable(p)}${cohorts(co)}${themes(t)}<section class="section panel"><h2>Posting-time heatmap</h2>${heatmap(h)}</section>${opportunities(no)}<section class="section panel"><h2>Top videos by views</h2><div class="table"><div class="r head"><div>Video</div><div>Views</div><div>Likes</div><div>Comments</div><div></div></div>${(o.top_videos||[]).map(x=>`<div class="r"><div><strong>${esc(x.caption||'Untitled')}</strong><div class="muted">${esc(x.created_at||'')}</div></div><div>${n(x.views)}</div><div>${n(x.likes)}</div><div>${n(x.comments)}</div><div></div></div>`).join('')||'<div class="muted">No videos yet.</div>'}</div></section>`}catch(e){document.getElementById('app').innerHTML='<div class="panel">'+esc(e.message)+'</div>'}}document.querySelectorAll('.range').forEach(b=>b.onclick=()=>load(Number(b.dataset.days)));load(30);</script></body></html>

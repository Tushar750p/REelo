<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytics · REelo</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f6f8;color:#111}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:28px}.actions{display:flex;gap:8px}.btn,.range{border:1px solid #ddd;background:#fff;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}.range.active{background:#111;color:#fff}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e7e7eb;border-radius:18px;padding:18px}.label,.muted{color:#777;font-size:12px}.value{font-size:27px;font-weight:800;margin-top:7px}.section{margin-top:16px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}.panel h2{font-size:17px;margin:0 0 14px}.chart{height:230px}.chart svg{width:100%;height:100%}.line{fill:none;stroke:currentColor;stroke-width:3}.axis{font-size:11px;fill:#888}.table{overflow:auto}.table .r{display:grid;grid-template-columns:1.5fr .7fr .7fr .7fr .7fr;gap:8px;padding:12px 0;border-bottom:1px solid #eee;font-size:13px;min-width:650px}.table .head{font-weight:700;color:#777;font-size:11px}.note{margin-top:10px;padding:11px;background:#fafafa;border-radius:11px;color:#666;font-size:12px}.insights,.windows,.opps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.insight,.window,.op{border:1px solid #eee;border-radius:14px;padding:14px}.insight h3{font-size:14px;margin:7px 0}.insight p,.op p{font-size:12px;color:#666;line-height:1.5}.quality{margin-top:8px;font-size:11px;color:#777}.compare{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:12px;border:1px solid #eee;border-radius:12px}.metric strong{display:block;font-size:18px;margin-top:4px}@media(max-width:900px){.cards,.compare{grid-template-columns:repeat(2,1fr)}.grid,.insights,.windows,.opps{grid-template-columns:1fr}}@media(max-width:600px){.wrap{padding:14px}.top{flex-direction:column;align-items:flex-start}.actions{width:100%;justify-content:space-between}.cards{gap:8px}.card{padding:13px}}</style></head><body><main class="wrap"><header class="top"><h1>Creator Analytics</h1><div class="actions"><button class="range" data-days="7">7D</button><button class="range active" data-days="30">30D</button><button class="range" data-days="90">90D</button><button class="btn" onclick="location.href='creator-studio.html'">← Studio</button></div></header><div id="app">Loading analytics…</div></main><script>const API=window.REELO_API||location.origin;const token=localStorage.getItem('reelo_token')||'';const H={Authorization:'Bearer '+token,'Content-Type':'application/json'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=v=>Number(v||0).toLocaleString();const mins=s=>{const x=Number(s||0);return x<60?x.toFixed(1)+'s':(x/60).toFixed(1)+'m'};async function get(path){const r=await fetch(API+path,{headers:H});let d={};try{d=await r.json()}catch(e){}if(r.status===401){location.href='index.html';throw Error('Login required')}if(!r.ok)throw Error(d.detail||'Unable to load analytics');return d}function chart(items,key){if(!items.length)return '<div class="muted">No data yet.</div>';const vals=items.map(x=>Number(x[key]||0)),max=Math.max(...vals,1),w=700,h=190,p=18,step=(w-p*2)/Math.max(vals.length-1,1),pts=vals.map((v,i)=>(p+i*step)+','+(h-p-(v/max)*(h-p*2))).join(' ');return '<div class="chart"><svg viewBox="0 0 700 190"><polyline class="line" points="'+pts+'"></polyline><text class="axis" x="18" y="180">'+esc(items[0].day||'')+'</text><text class="axis" x="682" y="180" text-anchor="end">'+esc(items[items.length-1].day||'')+'</text><text class="axis" x="18" y="18">'+n(max)+'</text></svg></div>'}function cards(items){return (items||[]).slice(0,6).map(x=>'<article class="insight"><b>'+esc(x.type||'insight')+'</b><h3>'+esc(x.title||'Creator insight')+'</h3><p>'+esc(x.detail||'')+'</p></article>').join('')||'<div class="muted">Post more content to unlock insights.</div>'}function comparison(d){const a=d.seven_day||{},b=d.thirty_day||{},c=d.changes_vs_30d_daily_average||{};const rows=[['Views',n(a.views),n(b.views),c.views],['Interactions',n(a.interactions),n(b.interactions),c.interactions],['Watch time',mins(a.watch_seconds),mins(b.watch_seconds),c.watch_seconds],['Unique viewers',n(a.unique_viewers),n(b.unique_viewers),c.unique_viewers]];return '<section class="section panel"><h2>7D vs 30D</h2><div class="compare">'+rows.map(x=>'<div class="metric"><div class="label">'+x[0]+'</div><strong>'+x[1]+'</strong><div class="quality">30D: '+x[2]+' · '+(x[3]==null?'—':(x[3]>=0?'+':'')+x[3]+'%')+'</div></div>').join('')+'</div></section>'}function videoTable(d){const rows=(d.items||[]).slice(0,15).map(x=>'<div class="r"><div><strong>'+esc(x.caption||'Untitled')+'</strong><div class="muted">'+esc(x.created_at||'')+'</div></div><div>'+Number(x.performance_score||0).toFixed(0)+'/100</div><div>'+n(x.views)+'</div><div>'+Number(x.interaction_rate||0).toFixed(2)+'%</div><div>'+mins(x.avg_watch_seconds)+'</div></div>').join('');return '<section class="section panel"><h2>Video performance</h2><div class="table"><div class="r head"><div>Video</div><div>Score</div><div>Views</div><div>Engagement</div><div>Avg watch</div></div>'+rows+'</div></section>'}function retention(d){const items=d.items||[];if(!items.length)return '<div class="muted">No watch-depth data yet.</div>';const max=Math.max(...items.map(x=>Number(x.viewers||0)),1);return items.map(x=>'<div class="quality"><b>'+esc(x.bucket)+'</b> · '+n(x.viewers)+' viewers · '+(Number(x.viewers||0)/max*100).toFixed(0)+'%</div>').join('')}async function load(days){if(!token){location.href='index.html';return}document.querySelectorAll('.range').forEach(b=>b.classList.toggle('active',Number(b.dataset.days)===days));try{const [o,v,e,a,r,i,p]=await Promise.all([get('/api/creator/analytics/overview'),get('/api/creator/analytics/views?days='+days),get('/api/creator/analytics/engagement?days='+days),get('/api/creator/analytics/audience'),get('/api/creator/analytics/retention'),get('/api/creator/analytics/intelligence'),get('/api/creator/analytics/video-performance')]);const views=(v.items||[]).reduce((s,x)=>s+Number(x.views||0),0),watch=(v.items||[]).reduce((s,x)=>s+Number(x.watch_seconds||0),0),interactions=(e.items||[]).reduce((s,x)=>s+Number(x.likes||0)+Number(x.comments||0)+Number(x.shares||0)+Number(x.saves||0),0);el('app').innerHTML='<section class="cards"><div class="card"><div class="label">Views · '+days+' days</div><div class="value">'+n(views)+'</div></div><div class="card"><div class="label">Watch time</div><div class="value">'+(watch/3600).toFixed(1)+'h</div></div><div class="card"><div class="label">Avg watch</div><div class="value">'+mins(o.average_watch_seconds)+'</div></div><div class="card"><div class="label">Unique viewers</div><div class="value">'+n(o.unique_viewers)+'</div></div></section><section class="section panel"><h2>Creator insights</h2><div class="insights">'+cards(i.insights)+'</div></section>'+comparison({seven_day:o.seven_day,thirty_day:o.thirty_day,changes_vs_30d_daily_average:o.changes_vs_30d_daily_average})+'<section class="section grid"><div class="panel"><h2>Views · '+days+' days</h2>'+chart(v.items||[],'views')+'</div><div class="panel"><h2>Audience growth</h2>'+chart(a.follower_history||[],'followers')+'<div class="muted">Followers: '+n(o.follower_total)+' · Growth: '+n(o.follower_growth)+'</div></div></section><section class="section grid"><div class="panel"><h2>Engagement · '+days+' days</h2><div class="value">'+n(interactions)+'</div><div class="muted">Overall engagement rate: '+Number(o.engagement_rate||0).toFixed(2)+'%</div></div><div class="panel"><h2>Watch depth</h2>'+retention(r)+'</div></section>'+videoTable(p)}catch(e){el('app').innerHTML='<section class="panel">'+esc(e.message)+'</section>'}}document.querySelectorAll('.range').forEach(b=>b.onclick=()=>load(Number(b.dataset.days)));load(30);</script></body></html>

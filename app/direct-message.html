<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Message · REelo</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Inter,system-ui,sans-serif}.page{height:100vh;max-width:720px;margin:auto;display:flex;flex-direction:column;background:#0b0b0b}.head{height:64px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #252525}.back{border:0;background:none;color:#fff;font-size:28px;cursor:pointer}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#292929;font-weight:850}.info{min-width:0}.name{font-weight:800}.handle{font-size:12px;color:#888;margin-top:2px}.msgs{flex:1;overflow:auto;padding:18px}.bubble{max-width:78%;padding:11px 14px;border-radius:18px;background:#222;margin:7px 0;line-height:1.4;word-break:break-word}.mine{margin-left:auto;background:#fff;color:#000;border-bottom-right-radius:5px}.theirs{border-bottom-left-radius:5px}.time{font-size:10px;opacity:.5;margin-top:4px}.empty{margin:auto;text-align:center;color:#777;padding:30px}.notice{color:#ff9898;font-size:12px;padding:8px 14px}.composer{display:flex;gap:9px;padding:12px;border-top:1px solid #252525}.input{flex:1;border:1px solid #333;background:#171717;color:#fff;border-radius:22px;padding:12px 15px;outline:none;font:inherit}.send{width:44px;border:0;border-radius:50%;background:#fff;color:#000;font-weight:900;cursor:pointer}.request-card{margin:auto;max-width:460px;text-align:center;padding:28px;border:1px solid #292929;border-radius:22px;background:#111}.request-card h3{margin:0 0 8px}.request-card p{color:#999;line-height:1.5;margin:8px 0 18px}.request-send{border:0;border-radius:22px;background:#fff;color:#000;padding:11px 18px;font-weight:800;cursor:pointer}.request-sent{color:#8ee6a8;font-size:13px}</style></head><body><main class="page"><header class="head"><button class="back" onclick="history.back()">‹</button><div class="avatar" id="avatar">?</div><div class="info"><div class="name" id="name">Loading…</div><div class="handle" id="handle"></div></div></header><section id="msgs" class="msgs"><div class="empty">Loading…</div></section><div id="notice" class="notice"></div><form id="composer" class="composer"><input id="input" class="input" maxlength="2000" placeholder="Message…" autocomplete="off"><button class="send">➤</button></form></main><script>
const API=window.REELO_API||location.origin,qs=new URLSearchParams(location.search),uid=qs.get('user_id')||'',username=qs.get('username')||'',token=localStorage.getItem('reelo_token')||'',headers=()=>({Authorization:'Bearer '+token,'Content-Type':'application/json'});let cid=null;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const initials=s=>String(s||'?').replace(/^@/,'').slice(0,1).toUpperCase();
async function findConversation(){if(!token){location.href='/index.html?auth=login';return}if(!uid){$('msgs').innerHTML='<div class="empty">Missing creator.</div>';return}try{const r=await fetch(API+'/api/messages?limit=100',{headers:headers()}),d=await r.json();const c=(d.items||[]).find(x=>String(x.user_id)===String(uid));$('name').textContent=c?.display_name||username||'Creator';$('handle').textContent=(c?.username||username)?'@'+(c?.username||username):'';$('avatar').textContent=initials(c?.username||username);if(c){cid=c.conversation_id;await load()}else{await showRequestCard()}}catch(e){$('notice').textContent='Could not load conversation.'}}
async function showRequestCard(){const r=await fetch(API+'/api/message-requests?kind=sent&limit=100',{headers:headers()});const d=await r.json().catch(()=>({items:[]}));const pending=(d.items||[]).find(x=>String(x.user_id)===String(uid));if(pending){$('msgs').innerHTML='<div class="request-card"><h3>Request pending</h3><p>Your message request to '+esc(username?'@'+username:'this creator')+' is waiting for a response.</p><div class="request-sent">Pending response</div></div>'}else{$('msgs').innerHTML='<div class="request-card"><h3>Message request</h3><p>This creator is not in your inbox yet. Your first message will be sent as a request. If they accept, the conversation will move to your inbox.</p><button class="request-send" onclick="sendRequest()">Send message request</button></div>'}$('composer').style.display='none'}
async function sendRequest(){const body=prompt('Write your message (max 2000 characters):','Hi! 👋');if(!body?.trim())return;const r=await fetch(API+'/api/messages/'+encodeURIComponent(uid),{method:'POST',headers:headers(),body:JSON.stringify({body:body.trim()})});const d=await r.json();if(!r.ok){$('notice').textContent=d.detail||'Request could not be sent';return}if(d.status==='request_sent'){$('msgs').innerHTML='<div class="request-card"><h3>Request sent ✓</h3><p>Your message request was sent to '+esc(username?'@'+username:'this creator')+'. You will be able to continue chatting if they accept.</p><div class="request-sent">Pending response</div></div>';$('notice').textContent='';return}if(d.conversation_id){cid=d.conversation_id;$('composer').style.display='flex';$('input').value='';await load()}}
async function load(){if(!cid)return;const r=await fetch(API+'/api/messages/'+encodeURIComponent(cid)+'/messages?limit=100',{headers:headers()});if(!r.ok)return;const d=await r.json();const me=localStorage.getItem('reelo_user_id')||'';$('msgs').innerHTML=d.items?.length?d.items.map(m=>'<div class="bubble '+(String(m.sender_id)===String(me)?'mine':'theirs')+'">'+esc(m.body)+'<div class="time">'+new Date(String(m.created_at).replace(' ','T')+'Z').toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</div></div>').join(''):'<div class="empty">Say hello 👋</div>';$('msgs').scrollTop=$('msgs').scrollHeight;fetch(API+'/api/messages/'+encodeURIComponent(cid)+'/read',{method:'POST',headers:headers()}).catch(()=>{})}
$('composer').onsubmit=async e=>{e.preventDefault();const body=$('input').value.trim();if(!body||!uid)return;const r=await fetch(API+'/api/messages/'+encodeURIComponent(uid),{method:'POST',headers:headers(),body:JSON.stringify({body})});const d=await r.json();if(!r.ok){$('notice').textContent=d.detail||'Message could not be sent';return}if(d.status==='request_sent'){$('input').value='';$('composer').style.display='none';$('msgs').innerHTML='<div class="request-card"><h3>Request sent ✓</h3><p>Your first message was sent as a request. You can continue chatting after the recipient accepts.</p><div class="request-sent">Pending response</div></div>';return}cid=d.conversation_id;$('input').value='';$('notice').textContent='';await load()};findConversation();setInterval(()=>{if(cid)load()},5000);
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>REelo Camera</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font:14px Inter,system-ui,sans-serif;height:100%}.wrap{max-width:520px;margin:auto;height:100dvh;background:#050505;position:relative;overflow:hidden}.top{position:absolute;inset:0 0 auto;height:64px;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:linear-gradient(#000b,transparent)}button{font:inherit}.ghost{border:0;background:#0006;color:#fff;border-radius:20px;padding:9px 13px;font-weight:700}.stage{height:100%;display:grid;place-items:center;background:#111}.stage video{width:100%;height:100%;object-fit:cover}.hint{position:absolute;top:50%;left:30px;right:30px;text-align:center;color:#aaa}.controls{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:16px 18px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000e 35%);display:flex;align-items:center;justify-content:center;gap:18px}.record{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#e33;box-shadow:0 0 0 3px #0008}.record.live{background:#fff}.small{width:46px;height:46px;border:1px solid #555;border-radius:50%;background:#151515;color:#fff}.mini{width:42px;height:42px;border:1px solid #555;border-radius:50%;background:#151515;color:#fff}.status{position:absolute;bottom:112px;left:20px;right:20px;text-align:center;font-weight:700;text-shadow:0 1px 5px #000}.select{position:absolute;left:16px;right:16px;bottom:128px;z-index:5;display:none}.select button{width:100%;padding:13px;border:0;border-radius:12px;background:#fff;color:#000;font-weight:800}.tools{position:absolute;right:14px;top:90px;z-index:5;display:flex;flex-direction:column;gap:10px}.tool{width:44px;height:44px;border:1px solid #555;border-radius:50%;background:#0008;color:#fff;font-weight:800}.error{color:#ffb0b0}.hidden{display:none}.count{position:absolute;top:72px;left:0;right:0;text-align:center;font-size:24px;font-weight:900;text-shadow:0 2px 8px #000;display:none}.beauty{filter:saturate(1.08) contrast(1.03) brightness(1.03)}.warm{filter:sepia(.22) saturate(1.15)}.cool{filter:saturate(.9) hue-rotate(12deg)}</style></head><body><main class="wrap"><header class="top"><button class="ghost" onclick="history.back()">‹ Back</button><b>REelo Camera</b><button class="ghost" onclick="switchCamera()">↻</button></header><section class="stage"><video id="preview" autoplay muted playsinline></video><div id="hint" class="hint">Allow camera access to start recording.</div></section><div id="count" class="count"></div><div id="status" class="status"></div><div id="select" class="select"><button onclick="openEditor()">Continue to Editor →</button></div><div class="tools"><button class="tool" onclick="toggleBeauty()">✦</button><button class="tool" onclick="cycleFilter()">◐</button><button class="tool" onclick="setSpeed()">1×</button><button class="tool" onclick="setTimer()">⏱</button></div><footer class="controls"><button class="small" onclick="pickVideo()">▣</button><button id="record" class="record" onclick="toggleRecord()" aria-label="Record"></button><button class="small" onclick="toggleFacing()">◉</button></footer><input id="picker" class="hidden" type="file" accept="video/*"><script>const preview=document.getElementById('preview'),hint=document.getElementById('hint'),statusEl=document.getElementById('status'),selectEl=document.getElementById('select'),recordBtn=document.getElementById('record'),picker=document.getElementById('picker'),countEl=document.getElementById('count');let stream=null,recorder=null,chunks=[],blob=null,facing='user',timer=null,seconds=0,delay=0,beauty=false,filterIndex=0,speedValue=1;const filters=['none','warm','cool'];function bestMime(){return ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(x=>MediaRecorder.isTypeSupported?.(x))||''}async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1080},height:{ideal:1920}},audio:true});preview.srcObject=stream;hint.style.display='none'}catch(e){hint.textContent='Camera or microphone permission is required. You can also choose a video from your device.';hint.classList.add('error')}}async function countdown(){if(!delay)return true;for(let i=delay;i>0;i--){countEl.style.display='block';countEl.textContent=i;await new Promise(r=>setTimeout(r,1000))}countEl.style.display='none';return true}async function toggleRecord(){if(recorder?.state==='recording'){recorder.stop();return}if(!stream){await startCamera();if(!stream)return}await countdown();chunks=[];const mime=bestMime();try{recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined)}catch(e){statusEl.textContent='Recording is not supported in this browser.';return}recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{clearInterval(timer);blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'});const u=URL.createObjectURL(blob);preview.srcObject=null;preview.src=u;preview.controls=true;selectEl.style.display='block';statusEl.textContent='Recording ready';recordBtn.classList.remove('live')};recorder.start(250);recordBtn.classList.add('live');seconds=0;timer=setInterval(()=>{seconds++;statusEl.textContent=`Recording ${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`},1000)}function openEditor(){if(!blob)return;const key='reelo_camera_clip_'+Date.now();window._cameraBlobUrl=URL.createObjectURL(blob);sessionStorage.setItem(key,JSON.stringify({name:'reelo-camera.webm',type:blob.type,size:blob.size}));window.location.href='editor.html?camera='+encodeURIComponent(key)}function pickVideo(){picker.click()}picker.onchange=()=>{const f=picker.files[0];if(!f)return;blob=f;preview.srcObject=null;preview.src=URL.createObjectURL(f);preview.controls=true;hint.style.display='none';selectEl.style.display='block';statusEl.textContent='Video selected'}async function switchCamera(){facing=facing==='user'?'environment':'user';if(stream)stream.getTracks().forEach(t=>t.stop());await startCamera()}function toggleFacing(){switchCamera()}function toggleBeauty(){beauty=!beauty;preview.classList.toggle('beauty',beauty);statusEl.textContent=beauty?'Beauty on':'Beauty off'}function cycleFilter(){filterIndex=(filterIndex+1)%filters.length;preview.classList.remove('warm','cool');const f=filters[filterIndex];if(f!=='none')preview.classList.add(f);statusEl.textContent=f==='none'?'Filter off':f+' filter'}function setSpeed(){const values=[.5,1,1.5,2];speedValue=values[(values.indexOf(speedValue)+1)%values.length];preview.playbackRate=speedValue;statusEl.textContent='Speed '+speedValue+'×'}function setTimer(){const values=[0,3,5,10];delay=values[(values.indexOf(delay)+1)%values.length];statusEl.textContent=delay?delay+'s countdown':'Countdown off'}startCamera();window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));</script></main></body></html>
